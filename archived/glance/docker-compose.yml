x-networks: &default-networks
  networks:
    - glance
    - cloudflare_tunnel


configs:
  git_sync_sparse_checkout:
    content: |
      /*
      !/*/
      /services/
      !/services/*/
      /services/glance/


services:
  git-sync:
    container_name: glance-git-sync
    image: registry.k8s.io/git-sync/git-sync:v4.4.2@sha256:3089d9787b89bdc5af01d9f6e8d515aefb9672e8aea3972d7ff67478112bacb3
    restart: unless-stopped
    command:
      - git-sync
      - --repo=https://github.com/mspiegel31/home-services.git
      - --ref=main
      - --root=/git
      - --link=current
      - --depth=1
      - --submodules=off
      - --sparse-checkout-file=/etc/git-sync/sparse-checkout
      - --period=2s
      - --http-bind=:1234
    configs:
      - source: git_sync_sparse_checkout
        target: /etc/git-sync/sparse-checkout
    volumes:
      - /opt/glance-configs:/git
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /git/current/services/glance/config/glance.yml && curl -fsS http://127.0.0.1:1234/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s


  glance:
    <<: *default-networks
    container_name: glance
    image: glanceapp/glance
    restart: unless-stopped
    entrypoint: ["/app/glance", "--config", "/git/current/services/glance/config/glance.yml"]
    volumes:
      - /opt/glance-configs:/git:ro
      # Optionally, also mount docker socket if you want to use the docker containers widget
      # - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - 8080:8080
    environment:
      - GITHUB_TOKEN=${GITHUB_TOKEN}
      - AUTH_SECRET_KEY=${AUTH_SECRET_KEY}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - AWS_SSO_URL=${AWS_SSO_URL}
      - INFRA_DOCS_URL=${INFRA_DOCS_URL}
      - GRAFANA_URL=${GRAFANA_URL}
      - SPACELIFT_URL=${SPACELIFT_URL}
      - CODEFRESH_URL=${CODEFRESH_URL}
      - WIZ_URL=${WIZ_URL}
    depends_on:
      git-sync:
        condition: service_healthy

networks:
  glance:
  cloudflare_tunnel:
    external: true
