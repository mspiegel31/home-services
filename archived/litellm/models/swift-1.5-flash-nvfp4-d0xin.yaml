# swift-1.5-flash-nvfp4-d0xin — see ../AGENTS.md for the per-file include contract.

model_list:
  - model_name: swift-1.5-flash-nvfp4-d0xin
    litellm_params:
      model: swift-1.5-flash-nvfp4-d0xin
      api_base: http://192.168.1.98:11437/v1
      api_key: os.environ/LLAMA_SWAP_API_KEY
      custom_llm_provider: hosted_vllm
    model_info:
      context_window: 262144      # HF: 262,144 native (extensible to 1M)
      max_input_tokens: 262144
      reasoning: true
      supports_reasoning: true
      vision: true
      supports_vision: true
      reasoning_effort: [low, medium, xhigh]   # Froggeric tiers; OMP pins the same list in its profile models.yml
      # Explicit native-tool discovery keeps omp's text fallback from colliding
      # with vLLM's qwen3_xml parser.
      supports_function_calling: true
      supports_tool_choice: true
      supported_openai_params:
        - temperature
        - top_p
        - top_k
        - repetition_penalty
        - presence_penalty
        - max_tokens
        - stream
        - reasoning_effort
        - tools
        - tool_choice
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      # OMP derives a 32768 max-tokens clamp from LiteLLM's known-model DB
      # fallback; these custom ids match nothing there. Advertise the real
      # output ceiling (input+output share the 262,144 window).
      max_output_tokens: 262144
