server {
    listen 80;
    server_name _;

    # Cookbook scans can be large; allow generous multipart bodies.
    client_max_body_size 500M;

    # Long-running VLM extraction: the sync /extract can take minutes per page.
    proxy_read_timeout 1800s;
    proxy_send_timeout 1800s;
    proxy_connect_timeout 30s;

    # Static GUI (single-file app). Assets mount from the tank at /usr/share/nginx/html.
    root /usr/share/nginx/html;
    index index.html;

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # Reverse proxy to the xberg API. Same-origin -> no CORS needed.
    # Strip the /api prefix so /api/extract -> xberg:8000/extract.
    location /api/ {
        proxy_pass http://xberg:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Large uploads streamed, not buffered.
        proxy_request_buffering off;
    }
}
