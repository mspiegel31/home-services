# Qwen holds an explicit 256K target so --fit can spill MoE experts after
# context selection. It inherits the conservative system-RAM KV default.
#
# The E4B and dense Gemmas use GPU KV for faster attention. Their contexts stay
# unset so --fit chooses the largest VRAM-safe value while retaining the global
# 1 GiB CUDA margin.
version = 1

[Qwen3.6-35B-A3B-UD-Q4_K_XL]
ctx-size = 256000

[gemma-4-E4B-it-UD-Q4_K_XL]
kv-offload = true

[gemma-4-E4B-it-qat-UD-Q4_K_XL]
kv-offload = true

[gemma-4-12B-it-qat-UD-Q4_K_XL]
kv-offload = true

[gemma-4-12b-it-Q4_K_M]
kv-offload = true
