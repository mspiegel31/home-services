# qwen3.8-27b-fp8 — one model in the llama-swap config-dir split.
# Shared macros (DOCKER_PREFIX, VLLM_COMMON, QWEN38_COMMON, ...) live in
# ../config.yaml. This file defines exactly one top-level key: models.

models:
  "qwen3.8-27b-fp8":
    name: Qwen3.8 27B FP8 DSpark
    description: Qwen3.8 27B FP8 weights with Red Hat DSpark7, BF16 KV, auto-fit context, and prefix caching enabled
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      # All Qwen3.8-derived lanes share the Froggeric three-tier contract.
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "Qwen/Qwen3.8-27B-FP8"
    proxy: http://vllm-qwen3-8-27b-fp8:8000
    # DSpark7 speculative head for the Qwen3.8-27B base weights:
    # https://huggingface.co/RedHatAI/Qwen3.8-27B-speculator.dspark
    # DSpark7 was measured level with native MTP3 on prose/agent traffic
    # (BENCHMARKS.md section 3) while costing 3.7 GiB of draft weights, so
    # the lane went back to MTP3; the user asked for the drafter back, so
    # it is the default again.
    # Reused prefixes corrupted reasoning under DFlash2 and DSpark on this
    # hybrid GDN architecture at zero draft acceptance (vllm#53912). Three
    # distinct mechanisms sat behind that symptom: the async-scheduling
    # token-count race (#53919), the overlapping conv-state copy (#50729,
    # shipped in v0.28.1), and Mamba checkpoint reuse of decode-written state
    # (#57128). This image is v0.30.0; the last is still open and
    # speculation-gated, so prefix reuse is canary-checked
    # (../canary_prefix_cache.py) rather than assumed correct, and a revert is
    # a one-line --no-enable-prefix-caching away.
    # BF16 KV matches the other quantized dense 27B lanes; the KV pool with the
    # external drafter has not been measured.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-qwen3-8-27b-fp8
      --env VLLM_ENABLE_STARTUP_PLAN=1
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.90
      --attention-backend FLASHINFER
      --kv-cache-dtype bfloat16
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
      --speculative-config '{"method":"dspark","model":"RedHatAI/Qwen3.8-27B-speculator.dspark","num_speculative_tokens":7}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-qwen3-8-27b-fp8
