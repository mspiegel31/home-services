name: 'Portainer Stack Webhook'
description: 'Trigger Portainer stack redeploy webhooks for subdirectories that changed in the push'
inputs:
  config-file:
    description: 'Path to the YAML config file mapping subdirectories to webhook env var names'
    required: false
    default: '.github/portainer-webhooks.yml'
  base-url:
    description: 'Base URL of the Portainer/Cloudflare webhook endpoint (no trailing slash, e.g. https://portainer-webhooks.example.com)'
    required: true
  cf-access-client-id:
    description: 'Cloudflare Access service token client ID (optional, for hardened setups)'
    required: false
  cf-access-client-secret:
    description: 'Cloudflare Access service token client secret (optional, for hardened setups)'
    required: false
  fail-fast:
    description: 'Fail the action immediately if any webhook call fails'
    required: false
    default: 'false'
outputs:
  triggered:
    description: 'Comma-separated list of subdirectories whose webhooks were triggered'
runs:
  using: 'node20'
  main: 'entry.js'
