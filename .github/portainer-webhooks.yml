# Portainer stack webhook mapping
#
# Each key is a subdirectory (relative to repo root) whose changes should
# trigger a Portainer stack redeploy. Each value is the NAME of an
# environment variable that holds the webhook UUID for that stack.
#
# The environment variables are wired from GitHub secrets in the workflow
# (see .github/workflows/deploy.yml). Using the naming convention
# PORTAINER_WEBHOOK_<NAME> keeps the two in sync.
#
# Only stacks you want auto-deployed need to be listed here. Stacks using
# Portainer's built-in polling can be omitted entirely.

stacks:
  services/automatic-ripping-machine: PORTAINER_WEBHOOK_AUTOMATIC_RIPPING_MACHINE
  services/cloudflared: PORTAINER_WEBHOOK_CLOUDFLARED
  services/filebrowser: PORTAINER_WEBHOOK_FILEBROWSER
  services/frigate: PORTAINER_WEBHOOK_FRIGATE
  services/glance: PORTAINER_WEBHOOK_GLANCE
  services/gmail-cleaner: PORTAINER_WEBHOOK_GMAIL_CLEANER
  services/immich: PORTAINER_WEBHOOK_IMMICH
  services/immich-carroll: PORTAINER_WEBHOOK_IMMICH_CARROLL
  services/karakeep: PORTAINER_WEBHOOK_KARAKEEP
  services/openwebui: PORTAINER_WEBHOOK_OPENWEBUI
  services/plex: PORTAINER_WEBHOOK_PLEX
  services/taskview: PORTAINER_WEBHOOK_TASKVIEW
