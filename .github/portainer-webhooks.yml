# Portainer stack webhook mapping
#
# Each entry maps a subdirectory (relative to repo root) to its
# Portainer webhook UUID. When files in that subdirectory change,
# the action triggers a redeploy via the webhook.
#
# Security: UUIDs are not treated as secrets. They are protected by
# Cloudflare Access service tokens (CF-Access-Client-Id /
# CF-Access-Client-Secret). An attacker needs both the service token
# AND the UUID to trigger a redeploy.

webhooks:
  - path: services/automatic-ripping-machine
    uuid: <uuid>
  - path: services/cloudflared
    uuid: <uuid>
  - path: services/filebrowser
    uuid: <uuid>
  - path: services/frigate
    uuid: <uuid>
  - path: services/glance
    uuid: 53ce3180-30bd-4c2b-8bf2-c8770f3da6e1
  - path: services/gmail-cleaner
    uuid: <uuid>
  - path: services/immich
    uuid: <uuid>
  - path: services/immich-carroll
    uuid: <uuid>
  - path: services/karakeep
    uuid: <uuid>
  - path: services/openwebui
    uuid: <uuid>
  - path: services/plex
    uuid: <uuid>
