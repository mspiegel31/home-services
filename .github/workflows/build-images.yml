name: Build images

on:
  push:
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build (directory name under images/; blank builds all)'
        required: false
        default: ''

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/github-script@v7
        id: set
        with:
          script: |
            const fs = require('fs');

            // Every directory under images/ containing a Dockerfile is a buildable image.
            // NOTE: @actions/glob returns absolute paths — take the parent dir name,
            // never a fixed index (f.split('/')[1] would yield 'home' on runners).
            const globber = await glob.create('images/*/Dockerfile');
            const all = [...new Set((await globber.glob()).map(f => f.split('/').at(-2)))].sort();

            // GHA cache is the default backend, but the whole repo shares 10 GB
            // and one multi-GB export evicts every other image's layers. An
            // image in that size class caches to a :buildcache tag in ghcr
            // instead: no cap, no cross-image eviction, a push only on a miss.
            // Reading or writing a registry cache ref needs the ghcr login,
            // which the build job only performs on main.
            const ghaCache = image => ({
              cacheFrom: `type=gha,scope=${image}`,
              cacheTo: `type=gha,mode=max,scope=${image}`,
            });
            const registryCache = image => (context.ref === 'refs/heads/main' ? {
              cacheFrom: `type=registry,ref=ghcr.io/${context.repo.owner}/${image}:buildcache`,
              cacheTo: `type=registry,ref=ghcr.io/${context.repo.owner}/${image}:buildcache,mode=max,ignore-error=true`,
            } : { cacheFrom: '', cacheTo: '' });
            const noCache = { cacheFrom: '', cacheTo: '' };

            // Per-image build policy; unspecified fields fall back to the
            // defaults in the matrix below. arm64 is still built for local
            // debugging on Apple Silicon.
            const policy = {
              'vllm-fastokens': { platforms: 'linux/amd64,linux/arm64', ...noCache },
              // The upstream unified-cuda image does not publish arm64.
              'llama-swap-vllm': { platforms: 'linux/amd64' },
              // PyPI wheels are manylinux x86_64 only.
              'freetoken': { platforms: 'linux/amd64' },
              // CUDA devel base is tens of GB and the engine compile step is 25
              // of a 27 min build; the engine targets x86-64 AVX2.
              'strata': { platforms: 'linux/amd64', ...registryCache('strata') },
              // Same multi-GB CUDA build as strata (only the Q6K flags
              // differ), so it needs the same registry-cache treatment: the
              // default GHA cache cannot hold layers this size.
              'strata-q6k': { platforms: 'linux/amd64', ...registryCache('strata-q6k') },
              // The official signal-cli native release asset is x86_64 only.
              'signal-cli': { platforms: 'linux/amd64' },
            };
            const defaults = { platforms: 'linux/amd64,linux/arm64' };
            const versionFor = image => {
              const versionPath = `images/${image}/VERSION`;
              if (!fs.existsSync(versionPath)) {
                return '';
              }

              const version = fs.readFileSync(versionPath, 'utf8').trim();
              if (!version || !/^[A-Za-z0-9][A-Za-z0-9_.-]{0,127}$/.test(version)) {
                throw new Error(`${versionPath} must contain one valid OCI tag`);
              }
              return version;
            };


            const inputImage = context.payload.inputs?.image || '';
            let changed;

            if (inputImage) {
              changed = [inputImage];
            } else {
              // Diff the push range; fall back to all images when the range is
              // unavailable (manual dispatch, new branch, force push).
              let diffFiles = null;
              const before = context.payload.before;
              if (before) {
                try {
                  const res = await exec.getExecOutput('git', ['diff', '--name-only', before, context.sha]);
                  diffFiles = res.stdout.split('\n').filter(Boolean);
                } catch {
                  diffFiles = null;
                }
              }

              if (!diffFiles || diffFiles.includes('.github/workflows/build-images.yml')) {
                changed = all;
              } else {
                const touched = new Set(
                  diffFiles.filter(f => f.startsWith('images/')).map(f => f.split('/')[1])
                );
                changed = all.filter(i => touched.has(i));
              }
            }

            core.info(`Discovered images: ${all.join(', ') || '<none>'}`);
            core.info(`Building: ${changed.length ? changed.join(', ') : '<none>'}`);
            core.setOutput('count', changed.length);
            core.setOutput('matrix', JSON.stringify({
              include: changed.map(image => ({
                image,
                version: versionFor(image),
                ...defaults,
                ...ghaCache(image),
                ...(policy[image] || {}),
              })),
            }));

  build:
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short
            type=raw,value=${{ matrix.version }},enable=${{ matrix.version != '' }}

      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: ${{ matrix.platforms }}
          # Only main publishes; PR/branch builds validate without pushing.
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: ${{ matrix.cacheFrom }}
          cache-to: ${{ matrix.cacheTo }}
