name: Build images

on:
  push:
    paths:
      - 'images/**'
      - '.github/workflows/build-images.yml'
  workflow_dispatch:
    inputs:
      image:
        description: 'Image to build (directory name under images/; blank builds all)'
        required: false
        default: ''

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      count: ${{ steps.set.outputs.count }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - id: set
        env:
          INPUT_IMAGE: ${{ inputs.image }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
          WORKFLOW: .github/workflows/build-images.yml
        run: |
          set -euo pipefail

          # Every directory under images/ containing a Dockerfile is a buildable image.
          all=$(git ls-files 'images/*/Dockerfile' | cut -d/ -f2 | sort -u)

          if [ -n "$INPUT_IMAGE" ]; then
            changed="$INPUT_IMAGE"
          else
            # Diff the push range; fall back to all images when the range is
            # unavailable (manual dispatch, new branch, force push).
            files=$(git diff --name-only "$BEFORE" "$SHA" 2>/dev/null || true)
            if [ -z "$files" ] || echo "$files" | grep -qx "$WORKFLOW"; then
              changed="$all"
            else
              touched=$(echo "$files" | sed -n 's|^images/\([^/][^/]*\)/.*|\1|p' | sort -u)
              changed=$(comm -12 <(echo "$all") <(echo "$touched"))
            fi
          fi

          count=$(echo "$changed" | grep -c . || true)
          matrix=$(echo "$changed" | jq -R . | jq -cs '{image: map(select(length > 0))}')
          echo "Building: ${changed:-<none>}"
          echo "count=$count" >> "$GITHUB_OUTPUT"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.count != '0'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}
    steps:
      - uses: actions/checkout@v6

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=,format=short

      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
