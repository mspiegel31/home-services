# Lemonade Server — AMD's open-source local LLM inference server (OpenAI-compatible API)
# Deployed on Proxmox VM 600 (RTX 2070 SUPER, 8GB VRAM, 48GB RAM).
#
# Why Lemonade over ollama / llama.cpp directly:
# - Auto-detects and optimizes for your GPU/NPU hardware
# - Supports CUDA, Vulkan, ROCm, CPU, Metal, NPU backends
# - Built-in model management (pull, list, delete) via CLI or API
# - Multi-modal: LLM, speech-to-text (whisper), TTS, image generation
# - OpenAI-compatible API at /api/v1 — drop-in replacement for cloud APIs
#
# Running with the image's default config for now. The default CMD is
# `./lemond --host 0.0.0.0` (port 13305, auto backend detection).
# To customize later, set values at runtime via `lemonade config set`
# or drop a config.json into the lemonade-recipe volume; settings
# persist across restarts.
#
# Secrets (set in Portainer UI):
#   LEMONADE_API_KEY  — REQUIRED. Bearer token for /api/* and /v1/* endpoints.
#                       Without it, anyone on the LAN can use the server.
#   HF_TOKEN          — OPTIONAL. Needed only to pull gated HuggingFace models.
#
# API: curl -H "Authorization: Bearer $LEMONADE_API_KEY" http://localhost:13306/api/v1/models
# UI:  http://localhost:13306/

services:
  lemonade:
    image: ghcr.io/lemonade-sdk/lemonade-server:latest
    container_name: lemonade-server
    restart: unless-stopped
    ports:
      - "13306:13305"  # adjacent to llama-server (11435) and ollama (11434)
    environment:
      - LEMONADE_API_KEY=${LEMONADE_API_KEY}
      - HF_TOKEN=${HF_TOKEN}
    volumes:
      # Persist HuggingFace model downloads
      - /mnt/models/lemonade/cache:/opt/lemonade/.cache/huggingface
      # Persist llama backend binaries (vulkan, rocm, cpu, cuda)
      - /mnt/models/lemonade/llama:/opt/lemonade/llama
      # Persist config.json, model options, and other backend state
      - /mnt/models/lemonade/recipe:/opt/lemonade/.cache/lemonade
      # GGUFs already present in the llama.cpp models directory.
      # Requires `lemonade config set extra_models_dir /extra-models` to use.
      - /mnt/models/llama-server:/extra-models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
