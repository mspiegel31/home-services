name: paperclip

services:
  db:
    image: postgres:17.10-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_DB: paperclip
      POSTGRES_USER: paperclip
      POSTGRES_PASSWORD: ${PAPERCLIP_POSTGRES_PASSWORD:?Set a URL-safe hexadecimal database password}
    volumes:
      - ${PAPERCLIP_DATA_DIR:?Set an absolute PAPERCLIP_DATA_DIR}/postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paperclip -d paperclip"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - database
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  paperclip:
    image: ghcr.io/paperclipai/paperclip:2026.916.1@sha256:a02ac35ac41df911af477422ea0e781cf41d2b2c600c66f0a5ac9d8c63f52c2c
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      db:
        condition: service_healthy
    ports:
      - ${PAPERCLIP_BIND_IP:-127.0.0.1}:${PAPERCLIP_PORT:-3100}:3100
    environment:
      PAPERCLIP_DEPLOYMENT_MODE: authenticated
      PAPERCLIP_DEPLOYMENT_EXPOSURE: private
      PAPERCLIP_AUTH_BASE_URL_MODE: explicit
      PAPERCLIP_PUBLIC_URL: ${PAPERCLIP_PUBLIC_URL:?Set the canonical URL including scheme and port}
      DATABASE_URL: postgresql://paperclip:${PAPERCLIP_POSTGRES_PASSWORD:?Set a URL-safe hexadecimal database password}@db:5432/paperclip
      PAPERCLIP_MIGRATION_AUTO_APPLY: "true"
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set a persistent authentication secret}
      PAPERCLIP_AGENT_JWT_SECRET: ${PAPERCLIP_AGENT_JWT_SECRET:?Set a persistent agent signing secret}
      PAPERCLIP_TOOL_ACTION_SIGNING_SECRET: ${PAPERCLIP_TOOL_ACTION_SIGNING_SECRET:?Set a persistent tool-action signing secret}
      PAPERCLIP_SECRETS_MASTER_KEY: ${PAPERCLIP_SECRETS_MASTER_KEY:?Set a persistent 32-byte hexadecimal encryption key}
      PAPERCLIP_SECRETS_STRICT_MODE: "true"
      PAPERCLIP_AUTH_DISABLE_SIGN_UP: ${PAPERCLIP_AUTH_DISABLE_SIGN_UP:-true}
      HEARTBEAT_SCHEDULER_ENABLED: ${HEARTBEAT_SCHEDULER_ENABLED:-false}
      PAPERCLIP_TELEMETRY_DISABLED: "1"
      PAPERCLIP_ANNOUNCEMENTS_ENABLED: "false"
    volumes:
      - ${PAPERCLIP_DATA_DIR:?Set an absolute PAPERCLIP_DATA_DIR}/app:/paperclip
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:3100/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 90s
    networks:
      - application
      - database
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

networks:
  application:
  database:
    internal: true
