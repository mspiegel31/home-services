# Profile routing (managed, merged into /opt/data/config.yaml).
# Most-specific route wins (chat_id > guild_id > default). Owner DMs and the
# default profile keep the full toolset; spouse and family profiles are
# restricted via their own per-profile config.yaml.
gateway:
  # Serve the default profile plus every named profile below.
  multiplex_profiles: true
  # Restrict the gateway to exactly these profiles; anything else is not served.
  multiplex_profile_allowlist:
    - family
    - spouse
  profile_routes:
    # Bind real IDs at deployment (same values as principals.yaml sender_ids).
    # JID/LID variants of the same number collapse to one identity.
    - name: spouse-dm
      platform: whatsapp
      profile: spouse
      chat_id: ""      # real spouse WhatsApp sender ID
    - name: family-group
      platform: whatsapp
      profile: family
      chat_id: ""      # real family group JID (...@g.us)
    # No route for the owner DM -> falls through to the default profile.
