# Omitting tools.include intentionally exposes each server's full native tool
# surface. Resource and prompt wrappers stay disabled because these workflows
# use native tools only; config apply still rejects unlisted MCP servers.
# Credentials stay ${VAR} refs resolved from container env (Portainer values);
# no secrets live in this file.
mcp_servers:
  mealie:
    command: /opt/data/mcp/mealie-mcp-server/.venv/bin/mealie-mcp-server
    env:
      MEALIE_BASE_URL: "${MEALIE_BASE_URL}"
      MEALIE_API_KEY: "${MEALIE_API_KEY}"
    trust: full
    sampling:
      enabled: false
    tools:
      resources: false
      prompts: false

  mealie-feedback:
    command: /opt/data/mcp/mealie-mcp-server/.venv/bin/python
    args: [/opt/hermes-managed/current/services/hermes/managed/mcp/mealie_feedback_server.py]
    env:
      MEALIE_BASE_URL: "${MEALIE_BASE_URL}"
      MEALIE_API_KEY: "${MEALIE_API_KEY}"
    trust: full
    sampling:
      enabled: false
    tools:
      resources: false
      prompts: false

  # The pinned upstream server is trusted to define the complete Baby Buddy
  # surface; resource and prompt wrappers remain unnecessary.
  babybuddy:
    command: /opt/data/mcp/babybuddy-mcp/.venv/bin/babybuddy-mcp
    env:
      BABYBUDDY_URL: "http://192.168.1.39:9001"
      BABYBUDDY_TOKEN: "${BABYBUDDY_API_KEY}"
      MCP_TRANSPORT: stdio
    trust: full
    sampling:
      enabled: false
    tools:
      resources: false
      prompts: false

