# Template: bind the real, verified WhatsApp sender IDs before deployment.
# Empty sender_ids fail closed (the gateway refuses to load the plugin).
# Values are identities, not secrets; still keep this file out of the public repo.
principals:
  owner:
    role: owner
    profile: owner-private
    sender_ids: []
  spouse:
    role: spouse
    profile: spouse-private
    sender_ids: []
