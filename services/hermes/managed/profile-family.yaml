# Per-profile config for the family profile (/opt/data/profiles/family/config.yaml).
# Shared family conversation (diet, stool, care notes). Same restricted tool surface
# as the spouse profile: no terminal, code execution, file editing, UI control, or
# delegation. MCP care-app tools remain available so both adults can record data.
agent:
  disabled_toolsets:
    - terminal
    - code_execution
    - coding
    - computer_use
    - delegation
    - hermes-cli
    - hermes-gateway
    - debugging

# Provider block must be pinned per profile home: profile configs are
# standalone (no inheritance from the root home), and the managed policy
# pins the provider allowed for household data. model.provider references
# this named custom provider; a missing block makes the profile's model
# resolution fail.
providers:
  home-litellm:
    api: http://192.168.1.98:4000/v1
    default_model: muse-glimmer-30b
    discover_models: true
    key_env: LITELLM_KEY
    transport: chat_completions
# Plugins are opt-in per home; pin the household-auth plugin so a rogue edit
# of this profile's plugins section cannot silently disable the
# sender-bound authorization hooks for the shared family conversation.
plugins:
  enabled:
    - household-auth

# Bounded care-app MCP surface for the shared family conversation. Both
# adults record diet/stool data here (plan: shared Baby Buddy skill
# everywhere). Terminal and file toolsets remain disabled below.
mcp_servers:
  mealie:
    command: /opt/data/mcp/mealie-mcp-server/.venv/bin/mealie-mcp-server
    env:
      MEALIE_BASE_URL: "${MEALIE_BASE_URL}"
      MEALIE_API_KEY: "${MEALIE_API_KEY}"
    trust: full
    sampling:
      enabled: false
    tools:
      include:
        - get_recipes
        - get_recipe_detailed
        - get_recipe_concise
        - create_recipe
        - create_recipe_full
        - import_recipe_from_url
        - update_recipe
        - patch_recipe
        - duplicate_recipe
        - mark_recipe_last_made
        - set_recipe_categories
        - set_recipe_tags
        - update_recipe_categories_and_tags
        - get_categories
        - get_tags
        - get_tools
        - get_foods
        - get_units
        - get_shopping_lists
        - create_shopping_list
        - get_shopping_list
        - add_recipe_to_shopping_list
        - get_shopping_list_items
        - get_shopping_list_item
        - create_shopping_list_item
        - create_shopping_list_items_bulk
        - update_shopping_list_item
        - update_shopping_list_items_bulk
        - get_all_mealplans
        - create_mealplan
        - create_mealplan_bulk
        - get_todays_mealplan
      resources: false
      prompts: false

  mealie-feedback:
    command: /opt/data/mcp/mealie-mcp-server/.venv/bin/python
    args: [/opt/hermes-managed/current/mcp/mealie_feedback_server.py]
    env:
      MEALIE_BASE_URL: "${MEALIE_BASE_URL}"
      MEALIE_API_KEY: "${MEALIE_API_KEY}"
    trust: full
    sampling:
      enabled: false
    tools:
      include:
        - set_recipe_rating
        - add_recipe_favorite
        - get_recipe_comments
        - add_recipe_comment
        - update_recipe_comment
      resources: false
      prompts: false

  babybuddy:
    command: /opt/data/mcp/babybuddy-mcp/.venv/bin/babybuddy-mcp
    env:
      BABYBUDDY_URL: "http://babybuddy:80"
      BABYBUDDY_TOKEN: "${BABYBUDDY_API_KEY}"
      MCP_TRANSPORT: stdio
    trust: full
    sampling:
      enabled: false
    tools:
      include:
        - diapers_list_diaper_changes
        - diapers_create_diaper_change
        - diapers_update_diaper_change
        - feedings_list_feedings
        - feedings_create_feeding
        - feedings_update_feeding
        - medications_list_medications
        - medications_create_medication
        - medications_update_medication
        - notes_list_notes
        - notes_create_note
        - notes_create_tag
        - measurements_list_weight
        - measurements_create_weight
        - measurements_list_height
        - measurements_create_height
      resources: false
      prompts: false
