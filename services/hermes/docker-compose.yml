name: hermes

services:
  signal-cli:
    image: ghcr.io/mspiegel31/signal-cli:v0.14.7-qr1@sha256:315ac1bcb76e0c118b3211955133844c9710bb370cdac166d598ed878f0528ee
    container_name: signal-cli
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:?Set SIGNAL_ACCOUNT in Portainer}
      SIGNAL_DEVICE_NAME: ${SIGNAL_DEVICE_NAME:-Hermes Agent}
    volumes:
      - /mnt/tank/container-configs/signal-cli:/data
    networks:
      - hermes
    healthcheck:
      test: ["CMD", "gosu", "signal:signal", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/v1/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  git-sync:
    image: ghcr.io/mspiegel31/hermes-butler:v2026.9.7-mealie-02183a8@sha256:d6e980e597468358614847e9893bb4120b472b1d8852be71d47facf91cd61e77
    container_name: hermes-git-sync
    restart: unless-stopped
    command: ["/usr/local/bin/hermes-git-sync"]
    environment:
      GIT_SYNC_REPO: ${GIT_SYNC_REPO:?Set GIT_SYNC_REPO in Portainer}
      GIT_SYNC_BRANCH: ${GIT_SYNC_BRANCH:-main}
      GIT_SYNC_SUBPATH: ${GIT_SYNC_SUBPATH:-services/hermes/managed}
      GIT_SYNC_TOKEN: ${GIT_SYNC_TOKEN:-}
      GIT_SYNC_INTERVAL: ${GIT_SYNC_INTERVAL:-30}
      HERMES_MANAGED_DIR: /opt/hermes-managed
      HERMES_MANAGED_SCRATCH: /opt/hermes-managed-repo
    volumes:
      - hermes-managed:/opt/hermes-managed
    networks:
      - hermes
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  git-sync-init:
    image: ghcr.io/mspiegel31/hermes-butler:v2026.9.7-mealie-02183a8@sha256:d6e980e597468358614847e9893bb4120b472b1d8852be71d47facf91cd61e77
    container_name: hermes-git-sync-init
    restart: "no"
    command: ["/usr/local/bin/hermes-git-sync-init"]
    environment:
      GIT_SYNC_REPO: ${GIT_SYNC_REPO:?Set GIT_SYNC_REPO in Portainer}
      GIT_SYNC_BRANCH: ${GIT_SYNC_BRANCH:-main}
      GIT_SYNC_SUBPATH: ${GIT_SYNC_SUBPATH:-services/hermes/managed}
      GIT_SYNC_TOKEN: ${GIT_SYNC_TOKEN:-}
      HERMES_MANAGED_DIR: /opt/hermes-managed
      HERMES_MANAGED_SCRATCH: /opt/hermes-managed-repo
    volumes:
      - hermes-managed:/opt/hermes-managed
    networks:
      - hermes
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  hermes:
    image: ghcr.io/mspiegel31/hermes-butler:v2026.9.7-mealie-02183a8@sha256:d6e980e597468358614847e9893bb4120b472b1d8852be71d47facf91cd61e77
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      git-sync-init:
        condition: service_completed_successfully
      signal-cli:
        condition: service_healthy
    ports:
      - "192.168.1.39:9119:9119"
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:?Set HERMES_DASHBOARD_USER in Portainer}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?Set HERMES_DASHBOARD_PASSWORD in Portainer}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:?Set HERMES_DASHBOARD_SECRET in Portainer}
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY in Portainer}
      LITELLM_KEY: ${LITELLM_KEY:?Set LITELLM_KEY in Portainer}
      MEALIE_BASE_URL: http://mealie:9000
      MEALIE_API_KEY: ${MEALIE_API_KEY:?Set MEALIE_API_KEY in Portainer}
      SIGNAL_HTTP_URL: http://signal-cli:8080
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:?Set SIGNAL_ACCOUNT in Portainer}
      SIGNAL_ALLOWED_USERS: ${SIGNAL_ALLOWED_USERS:?Set explicit SIGNAL_ALLOWED_USERS in Portainer}
      SIGNAL_GROUP_ALLOWED_USERS: ${SIGNAL_GROUP_ALLOWED_USERS:-}
      SIGNAL_ALLOW_ALL_USERS: "false"
      HERMES_SIGNAL_SHARE_USERS: ${HERMES_SIGNAL_SHARE_USERS:-}
      HERMES_SIGNAL_SHARE_GROUPS: ${HERMES_SIGNAL_SHARE_GROUPS:-}
    volumes:
      - /mnt/tank/container-configs/hermes:/opt/data
      - hermes-managed:/opt/hermes-managed:ro
    networks:
      - hermes
      - home-butler
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    shm_size: 1g
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

volumes:
  hermes-managed:

networks:
  hermes:
    driver: bridge
  home-butler:
    external: true
    name: home-butler
