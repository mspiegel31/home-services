name: hermes

services:
  signal-cli:
    image: ghcr.io/mspiegel31/signal-cli:v0.14.7-qr1@sha256:315ac1bcb76e0c118b3211955133844c9710bb370cdac166d598ed878f0528ee
    container_name: signal-cli
    restart: unless-stopped
    tty: true
    stdin_open: true
    environment:
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:?Set SIGNAL_ACCOUNT in Portainer}
      SIGNAL_DEVICE_NAME: ${SIGNAL_DEVICE_NAME:-Hermes Agent}
    volumes:
      - /mnt/tank/container-configs/signal-cli:/data
    networks:
      - hermes
    healthcheck:
      test: ["CMD", "gosu", "signal:signal", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8080/api/v1/check"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "1.0"

  git-sync:
    container_name: hermes-git-sync
    image: registry.k8s.io/git-sync/git-sync:v4.4.2@sha256:3089d9787b89bdc5af01d9f6e8d515aefb9672e8aea3972d7ff67478112bacb3
    user: "0:0"
    restart: unless-stopped
    command:
      - git-sync
      - --repo=https://github.com/mspiegel31/home-services.git
      - --ref=main
      - --root=/git
      - --link=current
      - --depth=1
      - --submodules=off
      - --sparse-checkout-file=/etc/git-sync/sparse-checkout
      - --period=30s
      - --http-bind=:1234
    configs:
      - source: git_sync_sparse_checkout
        target: /etc/git-sync/sparse-checkout
    volumes:
      - hermes-managed:/git
    networks:
      - hermes
    healthcheck:
      test: ["CMD-SHELL", "test -f /git/current/services/hermes/managed/policy.yaml && curl -fsS http://127.0.0.1:1234/"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  hermes:
    image: nousresearch/hermes-agent:v2026.9.7@sha256:63bfb6d732f49a55d453e801057273785cc61e0f6ee43db3fa2f2a79846301b7
    container_name: hermes
    restart: unless-stopped
    command: ["gateway", "run"]
    depends_on:
      git-sync:
        condition: service_healthy
      signal-cli:
        condition: service_healthy
    ports:
      - "192.168.1.39:9119:9119"
    environment:
      HERMES_DASHBOARD: "1"
      HERMES_DASHBOARD_BASIC_AUTH_USERNAME: ${HERMES_DASHBOARD_USER:?Set HERMES_DASHBOARD_USER in Portainer}
      HERMES_DASHBOARD_BASIC_AUTH_PASSWORD: ${HERMES_DASHBOARD_PASSWORD:?Set HERMES_DASHBOARD_PASSWORD in Portainer}
      HERMES_DASHBOARD_BASIC_AUTH_SECRET: ${HERMES_DASHBOARD_SECRET:?Set HERMES_DASHBOARD_SECRET in Portainer}
      HERMES_GATEWAY_BOOTSTRAP_STATE: running
      HERMES_UID: ${HERMES_UID:-10000}
      HERMES_GID: ${HERMES_GID:-10000}
      # s6 defaults to continuing after cont-init.d failures; policy and MCP
      # initialization are readiness gates, so any lifecycle failure stops.
      S6_BEHAVIOUR_IF_STAGE2_FAILS: "2"
      API_SERVER_ENABLED: "true"
      API_SERVER_HOST: 127.0.0.1
      API_SERVER_KEY: ${HERMES_API_SERVER_KEY:?Set HERMES_API_SERVER_KEY in Portainer}
      LITELLM_KEY: ${LITELLM_KEY:?Set LITELLM_KEY in Portainer}
      MEALIE_BASE_URL: http://192.168.1.39:9000
      MEALIE_API_KEY: ${MEALIE_API_KEY:?Set MEALIE_API_KEY in Portainer}
      BABYBUDDY_API_KEY: ${BABYBUDDY_API_KEY:?Set BABYBUDDY_API_KEY in Portainer}
      SIGNAL_HTTP_URL: http://signal-cli:8080
      SIGNAL_ACCOUNT: ${SIGNAL_ACCOUNT:?Set SIGNAL_ACCOUNT in Portainer}
      SIGNAL_ALLOWED_USERS: ${SIGNAL_ALLOWED_USERS:?Set explicit SIGNAL_ALLOWED_USERS in Portainer}
      SIGNAL_GROUP_ALLOWED_USERS: ${SIGNAL_GROUP_ALLOWED_USERS:-}
      SIGNAL_ALLOW_ALL_USERS: "false"
      HERMES_HOUSEHOLD_PRINCIPALS: /opt/data/principals.yaml
      HERMES_MANAGED_DIR: /opt/hermes-managed/current/services/hermes/managed
    configs:
      - source: household_mcp_tools_init
        target: /etc/cont-init.d/018-household-mcp-tools.py
        mode: 0555
      - source: household_profiles_init
        target: /etc/cont-init.d/021-household-profiles.py
        mode: 0555
      - source: household_config_init
        target: /etc/cont-init.d/022-household-config.py
        mode: 0555
    volumes:
      - /mnt/tank/container-configs/hermes:/opt/data
      - hermes-managed:/opt/hermes-managed:ro
    networks:
      - hermes
    healthcheck:
      test: ["CMD-SHELL", "/opt/hermes/.venv/bin/python3 /opt/hermes-managed/current/services/hermes/managed/init/config-apply.py --check && curl --fail --silent --show-error http://127.0.0.1:8642/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    shm_size: 1g
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - KILL
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"

configs:
  household_mcp_tools_init:
    # Pinned MCP project installer (was ./init/018-household-mcp-tools.py); inlined because edge git deploys ship only the compose file, not configs: file: paths
    content: |
      #!/command/with-contenv /usr/bin/python3
      """Install locked household MCP projects into the persistent Hermes volume.

      This runs after upstream ``01-hermes-setup`` remaps the Hermes UID and owns
      ``/opt/data``, but before any profile gateway can start.
      """

      from __future__ import annotations

      import os
      import pwd
      import subprocess
      import sys
      from dataclasses import dataclass
      from pathlib import Path

      LOG_PREFIX = "[household-mcp-tools]"
      HERMES_HOME = Path(os.environ.get("HERMES_HOME", "/opt/data"))
      PROJECTS_DIR = HERMES_HOME / "mcp"
      UV_CACHE_DIR = HERMES_HOME / ".cache" / "uv"
      STAMP_PATH = HERMES_HOME / ".household-mcp-projects"
      PYTHON = "/usr/bin/python3.13"


      @dataclass(frozen=True)
      class McpProject:
          name: str
          repository: str
          revision: str
          executable: str

          @property
          def directory(self) -> Path:
              return PROJECTS_DIR / self.name

          @property
          def executable_path(self) -> Path:
              return self.directory / ".venv" / "bin" / self.executable


      PROJECTS = (
          McpProject(
              name="mealie-mcp-server",
              repository="https://github.com/rldiao/mealie-mcp-server.git",
              revision="02183a84b92ba88e69fa11ded8b8235cc01771eb",
              executable="mealie-mcp-server",
          ),
          McpProject(
              name="babybuddy-mcp",
              repository="https://github.com/babybuddy/babybuddy-mcp.git",
              revision="9f32d446241c323602b23160d05e926161184d9f",
              executable="babybuddy-mcp",
          ),
      )


      def run_as_hermes(
          *command: object,
          check: bool = True,
          capture_output: bool = False,
      ) -> subprocess.CompletedProcess[str]:
          """Run one command as the remapped runtime user with its persistent HOME."""
          return subprocess.run(
              [
                  "/command/s6-setuidgid",
                  "hermes",
                  "env",
                  f"HOME={HERMES_HOME}",
                  *(str(part) for part in command),
              ],
              check=check,
              capture_output=capture_output,
              text=True,
          )


      def current_revision(project: McpProject) -> str | None:
          if not (project.directory / ".git").is_dir():
              return None
          result = run_as_hermes(
              "git",
              "-C",
              project.directory,
              "rev-parse",
              "HEAD",
              check=False,
              capture_output=True,
          )
          return result.stdout.strip() if result.returncode == 0 else None


      def expected_stamp() -> str:
          return "".join(f"{project.name}={project.revision}\n" for project in PROJECTS)


      def installation_is_current() -> bool:
          if not STAMP_PATH.is_file():
              return False
          if STAMP_PATH.read_text(encoding="utf-8") != expected_stamp():
              return False
          return all(
              project.executable_path.is_file()
              and os.access(project.executable_path, os.X_OK)
              and current_revision(project) == project.revision
              for project in PROJECTS
          )


      def sync_project(project: McpProject) -> None:
          if current_revision(project) != project.revision:
              print(f"{LOG_PREFIX} Fetching {project.name}@{project.revision}", flush=True)
              run_as_hermes("rm", "-rf", project.directory)
              run_as_hermes("git", "init", project.directory)
              run_as_hermes(
                  "git", "-C", project.directory, "remote", "add", "origin", project.repository
              )
              run_as_hermes(
                  "git", "-C", project.directory, "fetch", "--depth", "1", "origin", project.revision
              )
              run_as_hermes(
                  "git", "-C", project.directory, "checkout", "--detach", "FETCH_HEAD"
              )
              actual = current_revision(project)
              if actual != project.revision:
                  raise RuntimeError(
                      f"{project.name} checkout is {actual!r}, expected {project.revision}"
                  )

          print(f"{LOG_PREFIX} Syncing locked {project.name} environment", flush=True)
          run_as_hermes(
              "env",
              f"UV_CACHE_DIR={UV_CACHE_DIR}",
              "uv",
              "sync",
              "--project",
              project.directory,
              "--frozen",
              "--no-dev",
              "--no-editable",
              "--python",
              PYTHON,
          )
          if not project.executable_path.is_file() or not os.access(
              project.executable_path, os.X_OK
          ):
              raise RuntimeError(
                  f"{project.name} executable missing at {project.executable_path}"
              )


      def write_stamp() -> None:
          temporary = STAMP_PATH.with_suffix(".tmp")
          temporary.write_text(expected_stamp(), encoding="utf-8")
          hermes = pwd.getpwnam("hermes")
          os.chown(temporary, hermes.pw_uid, hermes.pw_gid)
          temporary.chmod(0o644)
          temporary.replace(STAMP_PATH)


      def main() -> int:
          try:
              if installation_is_current():
                  print(f"{LOG_PREFIX} Pinned MCP projects already installed")
                  return 0

              run_as_hermes("mkdir", "-p", PROJECTS_DIR, UV_CACHE_DIR)
              for project in PROJECTS:
                  sync_project(project)
              write_stamp()
              print(f"{LOG_PREFIX} Pinned MCP projects ready")
              return 0
          except (OSError, RuntimeError, subprocess.CalledProcessError) as error:
              print(f"{LOG_PREFIX} REFUSING startup: {error}", file=sys.stderr)
              return 1


      if __name__ == "__main__":
          raise SystemExit(main())
  household_profiles_init:
    # Native household profile bootstrap (was ./init/021-household-profiles.py)
    content: |
      #!/command/with-contenv /usr/bin/python3
      """Create native household profiles before s6 starts gateway services."""

      from __future__ import annotations

      import os
      import subprocess
      import sys
      from pathlib import Path

      LOG_PREFIX = "[household-profiles]"
      HERMES_HOME = Path(os.environ.get("HERMES_HOME", "/opt/data"))
      PROFILE_NAMES = ("spouse", "family")


      def create_profile(name: str) -> None:
          profile = HERMES_HOME / "profiles" / name
          if (profile / "SOUL.md").is_file():
              return
          if profile.exists():
              raise RuntimeError(f"incomplete native profile at {profile}")

          print(f"{LOG_PREFIX} Creating native profile {name}", flush=True)
          subprocess.run(
              [
                  "/command/s6-setuidgid",
                  "hermes",
                  "env",
                  f"HOME={HERMES_HOME}",
                  f"HERMES_HOME={HERMES_HOME}",
                  "hermes",
                  "profile",
                  "create",
                  name,
                  "--clone",
                  "--no-alias",
              ],
              check=True,
          )


      def main() -> int:
          try:
              for name in PROFILE_NAMES:
                  create_profile(name)
              return 0
          except (OSError, RuntimeError, subprocess.CalledProcessError) as error:
              print(f"{LOG_PREFIX} REFUSING startup: {error}", file=sys.stderr)
              return 1


      if __name__ == "__main__":
          raise SystemExit(main())
  household_config_init:
    # Managed-snapshot config apply (was ./init/022-household-config.py)
    content: |
      #!/command/with-contenv /usr/bin/python3
      """Apply the Git-managed household snapshot before gateways start."""

      from __future__ import annotations

      import os
      import subprocess
      import sys
      from pathlib import Path

      LOG_PREFIX = "[household-config]"
      HERMES_HOME = Path(os.environ.get("HERMES_HOME", "/opt/data"))
      MANAGED_DIR = Path(os.environ.get("HERMES_MANAGED_DIR", "/opt/hermes-managed/current/services/hermes/managed"))
      CONFIG_APPLIER = MANAGED_DIR / "init" / "config-apply.py"
      PYTHON = "/opt/hermes/.venv/bin/python3"


      def require_file(path: Path) -> None:
          if not path.is_file():
              raise RuntimeError(f"required file missing: {path}")


      def main() -> int:
          try:
              require_file(MANAGED_DIR / "policy.yaml")
              require_file(CONFIG_APPLIER)

              environment = os.environ.copy()
              environment["HERMES_HOME"] = str(HERMES_HOME)
              environment["HERMES_MANAGED_DIR"] = str(MANAGED_DIR)
              result = subprocess.run(
                  [PYTHON, str(CONFIG_APPLIER)],
                  env=environment,
                  check=False,
              )
              return result.returncode
          except (OSError, RuntimeError) as error:
              print(f"{LOG_PREFIX} REFUSING startup: {error}", file=sys.stderr)
              return 1


      if __name__ == "__main__":
          raise SystemExit(main())
  git_sync_sparse_checkout:
    content: |
      /*
      !/*/
      /services/
      !/services/*/
      /services/hermes/managed/

volumes:
  hermes-managed:

networks:
  hermes:
    driver: bridge
