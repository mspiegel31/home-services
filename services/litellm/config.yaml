general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  # Cross-worker rate limits, spend tracking, pod lock + shared health checks;
  # standalone Redis, independent of any response-cache backend.
  coordination_redis:
    url: redis://valkey:6379

litellm_settings:
  drop_params: true
  # Central translation for the qwen3 reasoning-parser family's Froggeric chat-template controls.
  # The callback is loaded from the LiteLLM config's directory, so the
  # git-synced custom_callbacks.py sits beside this file.
  callbacks:
    - custom_callbacks.qwen_thinking_policy
  cache: true
  cache_params:
    type: redis
    url: redis://valkey:6379
