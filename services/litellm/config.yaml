# LiteLLM Proxy Gateway
# Managed via git-sync from services/litellm/config.yaml.
# Public-facing auth, routing, and subscription layer.
#   chat -> llama-swap -> GPU inference backend
#   embeddings -> always-resident CPU Text Embeddings Inference backend
#
# Model capability + reasoning metadata is authored here in model_info so it
# reaches clients (e.g. Oh My Pi) through LiteLLM's discovery endpoints
# (/v1/models, /model_group/info, /v2/model/info) and replaces any manual
# client-side models.yml overrides.
#
# Secrets (set in Portainer UI, never committed):
#   LITELLM_MASTER_KEY, LITELLM_SALT_KEY, LITELLM_POSTGRES_PASSWORD,
#   LLAMA_SWAP_API_KEY  (presented to the llama-swap router on every request)
#
# api_base below is the llama-swap router, exposed on the host LAN IP (same
# endpoint Oh My Pi already uses). To retarget it, change the value on every
# model_list entry (and the LLAMA_SWAP_API_KEY env var).
# Changes require a restart of the litellm container to take effect.

model_list:
  - model_name: nomic-embed-text-v2-moe
    litellm_params:
      model: nomic-embed-text-v2-moe
      api_base: http://litellm-nomic-embed-text-v2-moe:80/v1
      api_key: none
      custom_llm_provider: hosted_vllm
    model_info:
      mode: embedding
      context_window: 512
      max_input_tokens: 512
      supported_openai_params:
        - dimensions
        - encoding_format
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  # Qwen3.8 and Swift 1.5 share common model_info through a YAML anchor;
  # their advertised effort tiers differ by backend.

  - model_name: qwen3.8-27b-fp8
    litellm_params:
      model: qwen3.8-27b-fp8
      api_base: http://192.168.1.98:11437/v1
      api_key: os.environ/LLAMA_SWAP_API_KEY
      custom_llm_provider: hosted_vllm
    model_info: &qwen38_model_info
      context_window: 262144      # HF: 262,144 native (extensible to 1M)
      max_input_tokens: 262144
      reasoning: true
      supports_reasoning: true
      vision: true
      supports_vision: true
      reasoning_effort: [low]   # match llama-swap's advertised FP8 tier
      supported_parameters:
        - temperature
        - top_p
        - top_k
        - repetition_penalty
        - max_tokens
        - stream
        - reasoning_effort
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0


  - model_name: swift-1.5-qwen3.8-27b-nvfp4
    litellm_params:
      model: swift-1.5-qwen3.8-27b-nvfp4
      api_base: http://192.168.1.98:11437/v1
      api_key: os.environ/LLAMA_SWAP_API_KEY
      custom_llm_provider: hosted_vllm
    model_info:
      <<: *qwen38_model_info
      reasoning_effort: [low, medium, xhigh]
      supports_function_calling: true
      supports_tool_choice: true
      supported_openai_params:
        - temperature
        - top_p
        - top_k
        - repetition_penalty
        - presence_penalty
        - max_tokens
        - stream
        - reasoning_effort
        - tools
        - tool_choice

  - model_name: swift-1.5-qwen3.8-27b-bf16
    litellm_params:
      model: swift-1.5-qwen3.8-27b-bf16
      api_base: http://192.168.1.98:11437/v1
      api_key: os.environ/LLAMA_SWAP_API_KEY
      custom_llm_provider: hosted_vllm
    model_info:
      <<: *qwen38_model_info
      reasoning_effort: [low, medium, xhigh]
      supports_function_calling: true
      supports_tool_choice: true
      supported_openai_params:
        - temperature
        - top_p
        - top_k
        - repetition_penalty
        - presence_penalty
        - max_tokens
        - stream
        - reasoning_effort
        - tools
        - tool_choice

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  # Cross-worker rate limits, spend tracking, pod lock + shared health checks;
  # standalone Redis, independent of any response-cache backend.
  coordination_redis:
    url: redis://valkey:6379

litellm_settings:
  drop_params: true
  # Central translation for local reasoning-model chat-template controls.
  # The callback is loaded from the LiteLLM config's directory, so the
  # git-synced custom_callbacks.py sits beside this file.
  callbacks:
    - custom_callbacks.local_thinking_policy
  cache: true
  cache_params:
    type: redis
    url: redis://valkey:6379
