# LiteLLM Proxy Gateway
# Managed via git-sync from services/litellm/config.yaml.
# Public-facing auth, routing, and subscription layer.
#   chat -> llama-swap -> GPU inference backend
#   embeddings -> always-resident CPU Text Embeddings Inference backend
#
# Model capability + reasoning metadata is authored here in model_info so it
# reaches clients (e.g. Oh My Pi) through LiteLLM's discovery endpoints
# (/v1/models, /model_group/info, /v2/model/info) and replaces any manual
# client-side models.yml overrides.
#
# Secrets (set in Portainer UI, never committed):
#   LITELLM_MASTER_KEY, LITELLM_SALT_KEY, LITELLM_POSTGRES_PASSWORD,
#   LLAMA_SWAP_API_KEY  (presented to the llama-swap router on every request)
#
# api_base/api_key for the chat deployments live in models/*.yaml (one file
# per model, pulled in via the include list below); the llama-swap router is
# exposed on the host LAN IP (same endpoint Oh My Pi already uses). To
# retarget it, change the value in each models/*.yaml (and the
# LLAMA_SWAP_API_KEY env var).
# Changes require a restart of the litellm container to take effect.

# Chat-model deployments live in ./models/*.yaml — one model per file, pulled
# in via LiteLLM's `include` directive (no glob; every file is listed).
# Merge semantics: model_list entries are concatenated in listed order;
# a model id must appear in exactly one file.
# To add a model, drop a new <model-id>.yaml in models/ and add it to the
# include list below.
include:
  - models/qwen3.8-27b-fp8.yaml
  - models/qwen3.8-27b-bf16.yaml
  - models/qwen3.8-flash-next-iq3s-strata.yaml
  - models/qwen3.8-flash-next-unsloth-iq4xs-strata.yaml
  - models/qwen3.8-27b-bf16-sglang.yaml
  - models/qwen3.8-27b-nvfp4.yaml
  - models/qwen3.8-27b-nvfp4-redhat.yaml
  - models/qwen3.8-27b-nvfp4-unsloth.yaml
  - models/qwen3.8-flash-next-nvfp4.yaml
  - models/qwen3.8-flash-next-nvfp4-ram-ple.yaml
  - models/swift-1.5-flash-nvfp4.yaml
  - models/swift-1.5-flash-nvfp4-d0xin.yaml
  - models/swift-1.5-flash-strata.yaml
  - models/swift-1.5-nvfp4.yaml
  - models/swift-1.5-bf16.yaml
  - models/swift-1.5-awq.yaml
  - models/swift-1.5-fp8.yaml

model_list:
  - model_name: nomic-embed-text-v2-moe
    litellm_params:
      model: nomic-embed-text-v2-moe
      api_base: http://litellm-nomic-embed-text-v2-moe:80/v1
      api_key: none
      custom_llm_provider: hosted_vllm
    model_info:
      mode: embedding
      context_window: 512
      max_input_tokens: 512
      supported_openai_params:
        - dimensions
        - encoding_format
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  store_prompts_in_spend_logs: true
  # Cross-worker rate limits, spend tracking, pod lock + shared health checks;
  # standalone Redis, independent of any response-cache backend.
  coordination_redis:
    url: redis://valkey:6379

litellm_settings:
  drop_params: true
  # Central translation for local reasoning-model chat-template controls.
  # The callback is loaded from the LiteLLM config's directory, so the
  # git-synced custom_callbacks.py sits beside this file.
  callbacks:
    - custom_callbacks.local_thinking_policy
    # Prometheus: /metrics for the inference-telemetry Alloy collector.
    # otel: OTLP traces -> Alloy :4318 relay -> Tempo (env in docker-compose).
    - prometheus
    - otel
  prometheus_emit_stream_label: true
  cache: true
  cache_params:
    type: redis
    url: redis://valkey:6379
