# LiteLLM Proxy Gateway
# Managed via git-sync from services/litellm/config.yaml.
# Public-facing auth / routing / subscription layer; upstream is the
# llama-swap router, which fans out to vLLM / FreeToken backends.
#   client -> LiteLLM (authn, usage, cost) -> llama-swap (scheduling/lifecycle) -> vLLM
#
# Model capability + reasoning metadata is authored here in model_info so it
# reaches clients (e.g. Oh My Pi) through LiteLLM's discovery endpoints
# (/v1/models, /model_group/info, /v2/model/info) and replaces any manual
# client-side models.yml overrides.
#
# Secrets (set in Portainer UI, never committed):
#   LITELLM_MASTER_KEY, LITELLM_SALT_KEY, LITELLM_POSTGRES_PASSWORD,
#   LLAMA_SWAP_API_KEY  (presented to the llama-swap router on every request)
#
# api_base below is the llama-swap router, exposed on the host LAN IP (same
# endpoint Oh My Pi already uses). To retarget it, change the value on every
# model_list entry (and the LLAMA_SWAP_API_KEY env var).
# Changes require a restart of the litellm container to take effect.

model_list:
  - model_name: muse-glimmer-30b
    litellm_params:
      model: muse-glimmer-30b
      api_base: http://192.168.1.98:11437/v1
      api_key: os.environ/LLAMA_SWAP_API_KEY
      custom_llm_provider: openai
    model_info:
      context_window: 131072      # HF: 131,072+ (meta-models/Muse-Glimmer-30B)
      max_input_tokens: 131072
      reasoning: true
      vision: true
      reasoning_effort: [low, medium, high, xhigh]   # HF: low/medium/high/xhigh
      supported_parameters:
        - temperature
        - top_p
        - top_k
        - repetition_penalty
        - max_tokens
        - stream
        - reasoning_effort
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

  - model_name: gemma-4-31b
