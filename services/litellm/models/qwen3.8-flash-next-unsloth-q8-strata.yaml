# qwen3.8-flash-next-unsloth-q8-strata - one deployment in the litellm
# config split. Global settings live in ../config.yaml. This file defines
# exactly one top-level key: model_list, with one entry.

model_list:
  - model_name: qwen3.8-flash-next-unsloth-q8-strata
    litellm_params:
      model: qwen3.8-flash-next-unsloth-q8-strata
      api_base: http://192.168.1.98:11437/v1
      api_key: os.environ/LLAMA_SWAP_API_KEY
      custom_llm_provider: hosted_vllm
    model_info:
      context_window: 262144 # HF: 262,144 native (extensible to 1M)
      max_input_tokens: 262144
      reasoning: true
      supports_reasoning: true
      vision: true # shared BF16 mmproj; unverified on this quant, see the llama-swap lane yaml
      supports_vision: true
      reasoning_effort: [low, medium, xhigh] # Strata maps these to none/low/medium/xhigh
      # Explicit native-tool discovery keeps omp on structured tool calls;
      # Strata parses Qwen tool calls server-side.
      supports_function_calling: true
      supports_tool_choice: true
      supported_openai_params:
        - temperature
        - top_p
        - top_k
        - repetition_penalty
        - presence_penalty
        - max_tokens
        - stream
        - reasoning_effort
        - tools
        - tool_choice
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      # OMP derives a 32768 max-tokens clamp from LiteLLM's known-model DB
      # fallback; these custom ids match nothing there. Advertise the real
      # output ceiling (input+output share the 262,144 window).
      max_output_tokens: 262144