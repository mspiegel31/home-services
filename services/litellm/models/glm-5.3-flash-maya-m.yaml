# glm-5.3-flash-maya-m - one deployment in the litellm
# config split. Global settings live in ../config.yaml. This file defines
# exactly one top-level key: model_list, with one entry.

model_list:
  - model_name: glm-5.3-flash-maya-m
    litellm_params:
      model: glm-5.3-flash-maya-m
      api_base: http://192.168.1.98:11437/v1
      api_key: os.environ/LLAMA_SWAP_API_KEY
      custom_llm_provider: hosted_vllm
    model_info:
      context_window: 262144 # GLM-5.3-Flash native 1,048,576; lane serves 262,144
      max_input_tokens: 262144
      reasoning: true
      supports_reasoning: true
      vision: true # shared F16 mmproj (Maya's own vision tower in the patched mtmd)
      supports_vision: true
      # GLM's ladder is none/low/high/max (Maya's server.py validates exactly
      # those; requests naming none get the config's "high"). Not the Froggeric
      # contract, so this id is deliberately absent from custom_callbacks'
      # LocalReasoningModel - no thinking-control translation applies.
      reasoning_effort: [low, high, max]
      # Maya parses OpenAI tool calls server-side (OpenAI- and Anthropic-
      # compatible APIs, streamed tool calls).
      supports_function_calling: true
      supports_tool_choice: true
      supported_openai_params:
        - temperature
        - top_p
        - top_k
        - repetition_penalty
        - presence_penalty
        - max_tokens
        - stream
        - reasoning_effort
        - tools
        - tool_choice
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0
      # input+output share the 262,144 window; advertise the real ceiling so
      # OMP's known-model fallback clamp does not bite
      max_output_tokens: 262144
