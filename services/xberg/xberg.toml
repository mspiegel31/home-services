# Xberg config for cookbook → Mealie.
# VLM OCR + structured extraction both use the existing swift-1.5-bf16 vLLM lane.
# Routed through the LiteLLM proxy (http://192.168.1.98:4000/v1), which owns
# the llama-swap auth and model routing. The LiteLLM master key is supplied
# via XBERG_LLM_API_KEY (Portainer env var, never committed).
# Scan path settings live here, not in the request: a request-scope `config`
# REPLACES this file wholesale (it does not merge), and callers may not supply
# LLM credentials. Requests from the bridge send no `config` at all.
force_ocr = true

[ocr]
language = ["eng"]
# VLM (swift-1.5-bf16) is primary. The explicit `[ocr.pipeline]` form is
# deliberately NOT used: a pipeline stage carries its own `vlm_config`, and that
# per-stage value is never populated from XBERG_LLM_API_KEY — the request goes
# out as `Authorization: Bearer ` with an empty key and every VLM OCR call 401s
# (verified against a capture listener; also unaffected by load_env, by a
# provider-standard env var, or by a custom provider block). `vlm_fallback`
# instead synthesizes its stage from the `[ocr.vlm_config]` below, which the
# env var does fill. `mode = "always"` = skip the classical backend; the
# synthesized pipeline is [vlm] only, so tesseract is not a fallback here.
[ocr.vlm_fallback]
mode = "always"

[ocr.vlm_config]
model = "swift-1.5-bf16"
base_url = "http://192.168.1.98:4000/v1"
timeout_secs = 300

[structured_extraction]
schema_name = "recipe"
schema_description = "A single cookbook recipe. Return one recipe per document."
strict = true

[structured_extraction.schema]
type = "object"
required = ["title", "ingredients", "steps"]

[structured_extraction.schema.properties]
title = { type = "string", description = "Recipe name, clean title case." }
description = { type = ["string", "null"], description = "Short intro/notes if present." }
servings = { type = ["string", "null"], description = "Yield, e.g. 4 servings." }
prep_time = { type = ["string", "null"] }
cook_time = { type = ["string", "null"] }

[structured_extraction.schema.properties.ingredients]
type = "array"

[structured_extraction.schema.properties.ingredients.items]
type = "object"
required = ["name"]

[structured_extraction.schema.properties.ingredients.items.properties]
quantity = { type = ["number", "null"] }
unit = { type = ["string", "null"] }
name = { type = "string" }
note = { type = ["string", "null"] }

[structured_extraction.schema.properties.steps]
type = "array"

[structured_extraction.schema.properties.steps.items]
type = "object"
required = ["text"]

[structured_extraction.schema.properties.steps.items.properties]
text = { type = "string" }

[structured_extraction.schema.properties.tags]
type = "array"
items = { type = "string" }

[structured_extraction.schema.properties.categories]
type = "array"
items = { type = "string" }

[structured_extraction.llm]
model = "swift-1.5-bf16"
base_url = "http://192.168.1.98:4000/v1"
timeout_secs = 300
