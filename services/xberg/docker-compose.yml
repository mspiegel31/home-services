name: xberg

services:
  xberg:
    image: ghcr.io/xberg-io/xberg:1.3.0
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    command: ["serve", "-H", "0.0.0.0", "-p", "8000", "--config", "/config/xberg.toml"]
    environment:
      XBERG_OCR_LANGUAGE: eng
      # LiteLLM master key — xberg forwards it onto ocr.vlm_config.api_key and
      # structured_extraction.llm.api_key at load time. base_url/model stay in
      # xberg.toml (git-synced, version-stable).
      XBERG_LLM_API_KEY: "${XBERG_LLM_API_KEY:?Set XBERG_LLM_API_KEY in Portainer}"
      TZ: "${TZ:?Set TZ in Portainer}"
    volumes:
      # Portainer CE edge git deploys ship only the compose file, so the TOML
      # lives on the tank (mirror of services/xberg/xberg.toml in git —
      # re-copy it to the tank after editing the git copy).
      - /mnt/tank/container-configs/xberg/xberg.toml:/config/xberg.toml:ro
      - /mnt/tank/container-configs/xberg/cache:/data/cache
      - /mnt/tank/container-configs/xberg/scan-inbox:/inbox:ro
    ports:
      - "127.0.0.1:8999:8000"
    healthcheck:
      test: ["CMD", "xberg", "--version"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - xberg
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"

networks:
  xberg:
    name: xberg
