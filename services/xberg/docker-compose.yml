name: xberg

# Xberg config comes from git via a git-sync sidecar (this stack's directory,
# sparse checkout, named volume). The container reads the TOML once at startup,
# so config activation is a deliberate restart/redeploy — --watch-config is
# intentionally not used. Container data (model cache, scan inbox) stays on the
# tank.
#
# Portainer CE stack: repo https://github.com/mspiegel31/home-services.git,
# ref main, path services/xberg/docker-compose.yml, poll 5 min.

configs:
  git_sync_sparse_checkout:
    content: |
      /*
      !/*/
      /services/
      !/services/*/
      /services/xberg/

volumes:
  xberg-config:

services:
  git-sync:
    image: registry.k8s.io/git-sync/git-sync:v4.4.2@sha256:3089d9787b89bdc5af01d9f6e8d515aefb9672e8aea3972d7ff67478112bacb3
    restart: unless-stopped
    user: "0:0"
    command:
      - git-sync
      - --repo=https://github.com/mspiegel31/home-services.git
      - --ref=main
      - --root=/git
      - --link=current
      - --depth=1
      - --submodules=off
      - --sparse-checkout-file=/etc/git-sync/sparse-checkout
      - --period=30s
      - --http-bind=:1234
    configs:
      - source: git_sync_sparse_checkout
        target: /etc/git-sync/sparse-checkout
    volumes:
      - xberg-config:/git
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "test -f /git/current/services/xberg/xberg.toml && curl -fsS http://127.0.0.1:1234/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s

  xberg:
    image: ghcr.io/xberg-io/xberg:1.3.0
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      git-sync:
        condition: service_healthy
    command: ["serve", "-H", "0.0.0.0", "-p", "8000", "--config", "/config/current/services/xberg/xberg.toml"]
    environment:
      XBERG_OCR_LANGUAGE: eng
      # LiteLLM master key — xberg forwards it onto ocr.vlm_config.api_key and
      # structured_extraction.llm.api_key at load time. base_url/model stay in
      # xberg.toml (git-synced via the sidecar above).
      XBERG_LLM_API_KEY: "${XBERG_LLM_API_KEY:?Set XBERG_LLM_API_KEY in Portainer}"
      TZ: "${TZ:?Set TZ in Portainer}"
    volumes:
      # Config is git-synced; the tank keeps only container state.
      - xberg-config:/config:ro
      - /mnt/tank/container-configs/xberg/cache:/data/cache
      - /mnt/tank/container-configs/xberg/scan-inbox:/inbox:ro
    ports:
      - "127.0.0.1:8999:8000"
    healthcheck:
      test: ["CMD", "xberg", "--version"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - xberg
    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "4.0"

  xberg-gui:
    image: nginx:1.27-alpine
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    depends_on:
      git-sync:
        condition: service_healthy
    # Static GUI + reverse proxy in front of xberg. Serves the single-file app
    # at / and proxies /api/* -> xberg:8000 (same-origin, no CORS). Assets are
    # git-synced into the same xberg-config volume as xberg.toml (sparse checkout
    # of services/xberg/ includes gui/). You can't bind individual files OUT of a
    # named volume (compose treats the left side as a host path), so the
    # start command stages the two files into nginx's locations, then execs
    # nginx. Activation is a restart/redeploy, same as xberg.toml.
    command:
      - sh
      - -c
      - |
        cp /config/current/services/xberg/gui/index.html /usr/share/nginx/html/index.html
        cp /config/current/services/xberg/gui/nginx.conf /etc/nginx/conf.d/default.conf
        exec nginx -g "daemon off;"
    volumes:
      - xberg-config:/config:ro
    ports:
      - "8998:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/index.html"]
      interval: 30s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - xberg
    deploy:
      resources:
        limits:
          memory: 128M
          cpus: "0.5"

networks:
  xberg:
    name: xberg
