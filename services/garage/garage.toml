# Garage template. render-config (docker-compose.yml) replaces the
# @PLACEHOLDER@ tokens with the GARAGE_* Portainer stack variables; the
# rendered file lands at /mnt/tank/container-configs/GARAGE/garage.toml.
# Never commit real values for the placeholders.
metadata_dir = "/var/lib/garage/meta"
data_dir = "/var/lib/garage/data"
# sqlite metadata engine: Garage's recommendation for single-node/small
# deployments (v2.2+); fsync keeps metadata crash-consistent on the NAS.
db_engine = "sqlite"
metadata_auto_snapshot_interval = "6h"
metadata_fsync = true
# Single node: every byte lives on the NAS pool (plan §9 warning).
replication_factor = 1
rpc_bind_addr = "[::]:3901"
rpc_secret = "@RPC_SECRET@"

[s3_api]
api_bind_addr = "[::]:3900"
s3_region = "garage"
# Signature-relevant: clients sign against the public HTTPS endpoint.
advertise_endpoint = "https://s3.mgmt.electricgarage.net:9443"
advertise_path_style = true

[s3_web]
bind_addr = "[::]:3902"
index = "index.html"
# Required since v2.2: domain serving bucket websites (unused here —
# clients use the path-style API only).
root_domain = "s3.mgmt.electricgarage.net"

[admin]
# Loopback only: status/metrics/admin never leave the host.
api_bind_addr = "127.0.0.1:3903"
metrics_token = "@METRICS_TOKEN@"
admin_token = "@ADMIN_TOKEN@"
