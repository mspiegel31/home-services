name: babybuddy

services:
  babybuddy:
    image: lscr.io/linuxserver/babybuddy:v2.10.1-ls250@sha256:985a2adc74c431271d0273db9d14196cd28a50aadc943fe3b36af3c45f7030a0
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "192.168.1.39:9001:80"
    environment:
      PUID: "${BABYBUDDY_PUID:?Set BABYBUDDY_PUID in Portainer}"
      PGID: "${BABYBUDDY_PGID:?Set BABYBUDDY_PGID in Portainer}"
      TZ: "${TZ:?Set TZ in Portainer}"
    volumes:
      - /mnt/tank/container-configs/babybuddy:/config
    healthcheck:
      test: ["CMD-SHELL", "wget --quiet --spider http://127.0.0.1:80/login/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - babybuddy
      - home-butler
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "2.0"

networks:
  babybuddy:
    name: babybuddy
  home-butler:
    name: home-butler
    external: true
