# DeerFlow nginx — same-origin reverse proxy for frontend + gateway.
# Copied from bytedance/deer-flow docker/nginx/nginx.conf (main server block
# trimmed to the paths DeerFlow needs; provisioner location dropped —
# sandbox runs in local mode, no K8s provisioner).
events {
    worker_connections 1024;
}
pid /tmp/nginx.pid;
http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # SSE and already-compressed media are deliberately uncompressed.
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    access_log /dev/stdout;
    error_log /dev/stderr;

    # Docker internal DNS (resolves service names at request time).
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Preserve an upstream proxy's X-Forwarded-Proto so the Gateway sees the
    # real client scheme when running behind another TLS edge.
    map $http_x_forwarded_proto $forwarded_proto {
        default    $scheme;
        "~*^https" https;
    }

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    server {
        listen 2026 default_server;
        listen [::]:2026 default_server;
        server_name _;

        set $gateway_upstream gateway:8001;
        set $frontend_upstream frontend:3000;

        # Streaming/SSE support
        proxy_buffering off;
        proxy_cache off;

        # LangGraph-compatible API routes (rewritten to Gateway native routes).
        location /api/langgraph/ {
            rewrite ^/api/langgraph/(.*) /api/$1 break;
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Connection '';
            proxy_set_header X-Accel-Buffering no;

            client_max_body_size 20M;
            proxy_request_buffering off;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
            chunked_transfer_encoding on;
        }

        # Live browser stream is a WebSocket upgrade; must match before the
        # generic /api/threads regex.
        location ~ ^/api/threads/[^/]+/browser/stream {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }

        # Everything else under /api/* (models, memory, mcp, skills, agents,
        # threads, auth, docs, health).
        location /api/ {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 600s;
        }

        # Admin-only local .skill archive upload.
        location = /api/skills/install/upload {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            client_max_body_size 101M;
            proxy_request_buffering off;
            proxy_read_timeout 600s;
        }

        # Uploads (larger body limit).
        location ~ ^/api/threads/[^/]+/uploads {
            proxy_pass http://$gateway_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            client_max_body_size 100M;
            proxy_request_buffering off;
        }

        # Default: frontend.
        location / {
            proxy_pass http://$frontend_upstream;
            proxy_http_version 1.1;
            proxy_set_header Host $http_host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_cache_bypass $http_upgrade;
            proxy_connect_timeout 600s;
            proxy_send_timeout 600s;
            proxy_read_timeout 600s;
        }
    }
}
