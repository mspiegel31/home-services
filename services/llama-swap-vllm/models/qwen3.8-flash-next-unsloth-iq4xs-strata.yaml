# qwen3.8-flash-next-unsloth-iq4xs-strata — one model in the llama-swap
# config-dir split. Shared macros live in ../config.yaml. This file defines
# exactly one top-level key: models.
#
# Unsloth's UD-IQ4_XS of the ORIGINAL Qwen3.8-Flash-Next: ~4-bit i-quants
# (IQ3_S gate/up experts, IQ4_NL downs on 43 layers and Q8_0 on 5), quality
# between IQ3_S and UD-Q4_K_XL. setup.py's MODELS table marks it a regular
# choice from engine 0.1.38 with "budget": True, which means the engine keeps a
# RAM budget of its 59.5 GB of experts (--resident-budget-gib) and reads the
# remainder through the file cache. On this box setup's own clamp
# resident_budget_gib() = 107 - 24 - ceil(3.59 KV) = 79, capped at
# int(59.5 / 1.0737) = 55 GiB, so the budget covers every expert and nothing is
# read from disk per token.

models:
  "qwen3.8-flash-next-unsloth-iq4xs-strata":
    name: Qwen3.8 Flash Next UD-IQ4_XS (Strata, Unsloth)
    description: Unsloth UD-IQ4_XS GGUF of Qwen3.8 Flash Next on the Strata tiered-expert engine, 262,144-token context, int8 KV, MTP drafts, full 55 GiB expert RAM budget
    concurrencyLimit: 12
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      STRATA_IMAGE: "ghcr.io/mspiegel31/strata:fb58e0d"
    proxy: http://strata-qwen3-8-flash-next-unsloth:8080
    # LOW_RAM=auto: setup.py warns that --low-ram does not apply to a budget
    # model (it always reads part of its experts through the file cache), so the
    # entrypoint's mandatory --low-ram flag is inert here; the RAM plan comes
    # from --resident-budget-gib instead.
    # The 93.7 GB download lands under /data/models/unsloth-ud-iq4_xs/ on the
    # 1.5 TB free of /mnt/more-models; the pack step then writes its own
    # experts.bin. The family's pack_args (--compat-bf16) and its three-shard
    # layout are setup.py's, not lane settings.
    # Vision: MODELS["UD-IQ4_XS"] carries "vision": True, so VISION=yes is
    # valid; the encoder is the ISTA mmproj-Qwen3.8-Flash-Next-BF16.gguf that
    # the qwen family entry names, shared with the IQ3_S lane.
    # PARALLEL=6 (was 8): the engine's verify path keeps one CUDA graph pair
    # per distinct busy-slot subset and never evicts them (~9 MiB/pair, 2^N-1
    # subsets), so at 8 slots the pairs accumulated past --vram-reserve-mib
    # 700 — "verify: batch instantiate: out of memory", engine exit 1,
    # llama-swap restart loop (2026-10-05). 6 caps the subsets at 63; full
    # diagnosis in images/strata/merge_args.py's docstring. Each slot costs
    # 0.95 GiB of VRAM at 262144 with --kv-resident 32768 (its session, KV
    # streaming keeping the rest in RAM) plus its whole KV cache in pinned RAM
    # (3.3 GB at 262144); batch slots carry no repetition/presence penalties
    # and no MTP drafts unless STRATA_BATCH_MTP=1 (below).
    # STRATA_BATCH_MTP=1 (0.1.40, PR #846): batch slots keep MTP drafts
    # instead of one token per window — +31-39% aggregate with 2-4 clients,
    # measured upstream on the RTX PRO 5000. Server env, no merge_args
    # change. If the draft state does not fit the post-load free VRAM
    # (measured 1736 MiB here, 850 MiB floor) the engine logs it and
    # batches without drafts — graceful.
    # STRATA_PREFILL_CPU_SHARE=auto: the CPU computes the least-routed
    # experts for short prompt chunks — 19-35% faster chat turns and tool
    # calls; not byte-identical (mean KL ~0.004). 0.1.41 made the share a
    # default only for one GPU with no batch slots, but explicit auto still
    # arms it on a batched lane's solo-request prompt path, and now also
    # stages chunks up to STRATA_PREFILL_CPU_SHARE_MAX (3072, measured ~2%
    # slower at 2K upstream) — pinned to 1024 to keep the 0.1.40.2 range.
    # parallel, --vram-reserve-mib 2048 and --ple-io all come from the cmd
    # env below: images/strata/merge_args.py writes them into the config json
    # on every start, so a REINSTALL keeps them. The 2 GiB reserve leaves
    # room for the batch graphs — post-load free VRAM must cover
    # (2^6-1) x ~9 MiB x 1.5 (>= 850 MiB; measured 1736 MiB free here). The
    # multi-session cache flags (--prompt-cache 32, --conversation-cache-*)
    # are merged the same way.
    # PLE (the 28.8 GB n-gram table): STRATA_PLE_IO=direct, the engine
    # default — this lane's RAM budget is the tightest of the three (59.5 GB
    # of experts with a 55 GiB resident budget + 28.8 GB table + 3.6 GB int8
    # KV against 107 GB), so locking the table in RAM on top of the expert
    # budget is unsafe; it streams from sdc instead.
    # Chat template: Strata renders the tokenizer dir's chat_template.jinja
    # (serve/server.py:4014, the config's "tokenizer" key), which setup writes
    # from the GGUF's embedded template (reasoning_effort defaulting to xhigh,
    # accepting only low/medium/xhigh).
    # /mnt/more-models/strata/tokenizers/qwen3.8-flash-next supplies the whole
    # directory instead: vocab.json, merges.txt, token_type.json and
    # tokenizer.json are byte-identical to this model's own extraction
    # (cmp-verified) and to Swift 1.5's, and chat_template.jinja is the repo's
    # Froggeric v22.5 (images/vllm-fastokens/qwen3.8-froggeric-v22.5.jinja,
    # 28,250 bytes, default medium), so this lane renders what the vLLM lanes
    # render: per-message think_on/think_off state, tool-argument truncation,
    # preserve_thinking.
    # It is mounted as a DIRECTORY over <pack>/tokenizer, never as a
    # single-file bind over chat_template.jinja: the extraction guards test for
    # vocab.json (setup.py:4182) and vocab.json+chat_template.jinja
    # (tools/iq_pack.py:564), so a file bind creates the template while
    # vocab.json is still missing, the one writer that then runs dies with
    # EROFS, and the 0-byte file it leaves makes every later run skip the
    # writer and serve an empty template. With the directory mounted, both
    # guards skip the writer and nothing is ever written into the pack.
    cmd: >-
      docker run --init --rm --gpus all --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --network llama-swap-vllm-backend
      --env FAMILY=unsloth --env MODEL=UD-IQ4_XS --env CONTEXT=262144
      --env VISION=yes --env GPU=0 --env LOW_RAM=auto --env PARALLEL=6
      --env STRATA_VRAM_RESERVE_MIB=2048 --env STRATA_PLE_IO=direct
      --env STRATA_BATCH_MTP=1 --env STRATA_PREFILL_CPU_SHARE=auto
      --env STRATA_PREFILL_CPU_SHARE_MAX=1024
      --env HOST=0.0.0.0 --env PORT=8080
      --env STRATA_ALLOWED_HOSTS=strata-qwen3-8-flash-next-unsloth
      --volume /mnt/more-models/strata:/data
      --volume /mnt/more-models/strata/tokenizers/qwen3.8-flash-next:/data/packs/unsloth-ud-iq4_xs/tokenizer:ro
      --label io.mspiegel.llama-swap.managed=true
      --label io.mspiegel.llama-swap.model=${MODEL_ID}
      --name strata-qwen3-8-flash-next-unsloth
      ${STRATA_IMAGE}
    cmdStop: docker stop --time 90 strata-qwen3-8-flash-next-unsloth
