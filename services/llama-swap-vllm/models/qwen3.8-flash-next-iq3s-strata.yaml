# qwen3.8-flash-next-iq3s-strata — one model in the llama-swap config-dir split.
# Shared macros live in ../config.yaml. This file defines exactly one top-level
# key: models.
#
# IQ3_S is the ORIGINAL Qwen3.8-Flash-Next (ISTA-DASLab GSQ-RCO), not Swift 1.5:
# setup.py's MODELS table tags it "families": ("qwen",) with the note "the
# original model only (Swift 1.5 has no IQ3_S)". Routing to it therefore trades
# away Swift's 63% shorter thinking for the strongest published operating point
# on this backbone (task avg 93.26 vs BF16's 93.12, GPQA-Diamond 92.93 above the
# base model's 91.92). It is a quality ceiling for hard problems, not a daily
# driver: per-task wall clock favours the Swift IQ3_XXS lane.

models:
  "qwen3.8-flash-next-iq3s-strata":
    name: Qwen3.8 Flash Next IQ3_S (Strata)
    description: Original Qwen3.8 Flash Next GSQ-RCO IQ3_S GGUF on the Strata tiered-expert engine, 262,144-token context, int8 KV, MTP drafts, n-gram table read from disk
    concurrencyLimit: 12
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      STRATA_IMAGE: "ghcr.io/mspiegel31/strata:fb58e0d"
    proxy: http://strata-qwen3-8-flash-next-iq3s:8080
    # LOW_RAM=auto, not the Swift lane's "on": setup.py's low_ram_needed() is
    # ram < arena_gb + 10, i.e. 107 < 60.3, so it picks the RAM-resident mode by
    # itself and pins all 50.3 GB of experts. "on" would force the mapped path
    # and read experts through the file cache for no reason.
    # No --memory cap: setup.py sizes RAM from /proc/meminfo, which in a
    # container is the host's total, and 107 GB is what the engine actually has.
    # ctx_ram_need() at 262144 = 50.3 + 3.59 (int8 KV) + 24 = 77.9 GB, inside
    # the box, so setup accepts the full native context without --rope-scaling.
    # /data is shared with the Swift Strata lane: the mtp/rt draft layer and the
    # expert profile are the base model's, so they are reused, not rebuilt. The
    # qwen family's vision encoder is mmproj-Qwen3.8-Flash-Next-BF16.gguf, which
    # is a different file from the Swift mmproj already on the volume; setup
    # downloads it on the first start.
    # parallel, --vram-reserve-mib 2048 and --ple-io all come from the cmd
    # env below: images/strata/merge_args.py writes them into the config json
    # on every start, so a REINSTALL keeps them. 6 slots and the 2 GiB
    # reserve because the engine's verify path keeps one CUDA graph pair per
    # distinct busy-slot subset and never evicts them (~9 MiB/pair, 2^N-1
    # subsets; full diagnosis in merge_args.py's docstring). Each slot costs
    # 0.95 GiB of VRAM at 262144 with --kv-resident 32768 (its session, KV
    # streaming keeping the rest in RAM) plus its whole KV cache in pinned
    # RAM (3.3 GB at 262144); batch slots carry no repetition/presence
    # penalties and no MTP drafts unless STRATA_BATCH_MTP=1 (below).
    # STRATA_BATCH_MTP=1 (0.1.40, PR #846): batch slots keep MTP drafts —
    # +31-39% aggregate with 2-4 clients, upstream on the RTX PRO 5000;
    # graceful degrade (logged) if draft state exceeds free VRAM.
    # STRATA_PREFILL_CPU_SHARE=auto: the CPU computes the least-routed
    # experts for short prompt chunks — 19-35% faster chat turns; not
    # byte-identical (mean KL ~0.004). 0.1.41 made the share a default only
    # for one GPU with no batch slots, but explicit auto still arms it on a
    # batched lane's solo-request prompt path, and now also stages chunks up
    # to STRATA_PREFILL_CPU_SHARE_MAX (3072, measured ~2% slower at 2K
    # upstream) — pinned to 1024 to keep the 0.1.40.2 range.
    # PLE (the 28.8 GB n-gram table): STRATA_PLE_IO=direct, the engine
    # default — not the Swift lane's ram. This lane pins all 50.3 GB of
    # experts (LOW_RAM=auto), and 6 slots add ~3.3 GB of pinned KV each, so
    # locking the table on top (50.3 + 28.8 + ~20 GB) is unsafe on 107 GB;
    # the table streams from sdc.
    # Chat template: Strata renders the tokenizer dir's chat_template.jinja
    # (serve/server.py:4014, the config's "tokenizer" key), which setup writes
    # from the GGUF's embedded template (reasoning_effort defaulting to xhigh,
    # accepting only low/medium/xhigh).
    # /mnt/more-models/strata/tokenizers/qwen3.8-flash-next supplies the whole
    # directory instead: vocab.json, merges.txt, token_type.json and
    # tokenizer.json are byte-identical between Swift 1.5 and the base model's
    # UD-IQ4_XS (cmp-verified - all three lanes are the same Qwen3.8-Flash-Next
    # tokenizer), and chat_template.jinja is the repo's Froggeric v22.5
    # (images/vllm-fastokens/qwen3.8-froggeric-v22.5.jinja, 28,250 bytes,
    # default medium), so this lane renders what the vLLM lanes render:
    # per-message think_on/think_off state, tool-argument truncation,
    # preserve_thinking.
    # It is mounted as a DIRECTORY over <pack>/tokenizer, never as a
    # single-file bind over chat_template.jinja: the extraction guards test for
    # vocab.json (setup.py:4182) and vocab.json+chat_template.jinja
    # (tools/iq_pack.py:564), so a file bind creates the template while
    # vocab.json is still missing, the one writer that then runs dies with
    # EROFS, and the 0-byte file it leaves makes every later run skip the
    # writer and serve an empty template. With the directory mounted, both
    # guards skip the writer and nothing is ever written into the pack.
    # LiteLLM's callback registers this id as a plain Qwen route, so an
    # uncontrolled request keeps Froggeric's medium default.
    cmd: >-
      docker run --init --rm --gpus all --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --network llama-swap-vllm-backend
      --env FAMILY=qwen --env MODEL=IQ3_S --env CONTEXT=262144
      --env VISION=yes --env GPU=0 --env LOW_RAM=auto --env PARALLEL=6
      --env STRATA_VRAM_RESERVE_MIB=2048 --env STRATA_PLE_IO=direct
      --env STRATA_BATCH_MTP=1 --env STRATA_PREFILL_CPU_SHARE=auto
      --env STRATA_PREFILL_CPU_SHARE_MAX=1024
      --env HOST=0.0.0.0 --env PORT=8080
      --env STRATA_ALLOWED_HOSTS=strata-qwen3-8-flash-next-iq3s
      --volume /mnt/more-models/strata:/data
      --volume /mnt/more-models/strata/tokenizers/qwen3.8-flash-next:/data/packs/iq3_s/tokenizer:ro
      --label io.mspiegel.llama-swap.managed=true
      --label io.mspiegel.llama-swap.model=${MODEL_ID}
      --name strata-qwen3-8-flash-next-iq3s
      ${STRATA_IMAGE}
    cmdStop: docker stop --time 90 strata-qwen3-8-flash-next-iq3s
