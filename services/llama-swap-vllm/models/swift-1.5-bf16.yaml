# swift-1.5-bf16 — one model in the llama-swap config-dir split.
# Shared macros (DOCKER_PREFIX, VLLM_COMMON, QWEN38_COMMON, ...) live in
# ../config.yaml. This file defines exactly one top-level key: models.

models:
  "swift-1.5-bf16":
    name: Swift 1.5 Qwen3.8 27B BF16
    description: UkisAI Swift-1.5-Qwen3.8-27b BF16 with FlashInfer, FP8 KV, RedHat DSpark7, auto-fit context, and 16 GiB RAM prefix cache
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "ukisai/Swift-1.5-Qwen3.8-27b"
    proxy: http://vllm-swift-1-5-bf16:8000
    # The 51.75 GiB BF16 weights stay on GPU; no dense-weight CPU offload.
    # FlashInfer supports FP8 full-attention KV on SM120. The checkpoint's
    # KV scales are not applied by this loader, so FP8 uses unit scales;
    # the model's recurrent SSM state remains FP32.
    # With the native tier, vLLM 0.30.0 measured 14.94 GiB /
    # 420,309 GPU cache tokens at 0.98 utilization, enough for one full
    # 262,144-token window. Keep the 4096-token prefill chunk after the
    # 8192-token graph OOM. 16 GiB, not the 24 GiB this lane carried until
    # 2026-09-28: vLLM's check_shm_free_space aborts engine start unless the
    # whole tier fits free space on /dev/shm, a 25 GiB host tmpfs shared with
    # llama-server and any co-resident lane. Cold-prefix cache only; does not
    # extend active context, and dies with this --rm container.
    # The cache capacity above was measured with MTP3; DSpark adds draft
    # weights and KV, so auto-fit must recalculate capacity at startup.
    # Reused hybrid prefixes have corrupted external drafting (vllm#53912);
    # the retained prefix cache needs a live correctness canary.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-swift-1-5-bf16
      --env MAX_JOBS=4
      --env VLLM_ENABLE_STARTUP_PLAN=1
      --env VLLM_DISABLED_KERNELS=FlashInferFP8ScaledMMLinearKernel
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-num-seqs 8
      --max-num-batched-tokens 4096
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.98
      --attention-backend FLASHINFER
      --kv-cache-dtype fp8
      --mamba-cache-mode align
      --kv-offloading-size 16
      --kv-offloading-backend native
      --generation-config auto
      --max-cudagraph-capture-size 16
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
      --speculative-config '{"method":"dspark","model":"RedHatAI/Qwen3.8-27B-speculator.dspark","num_speculative_tokens":7}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-swift-1-5-bf16
