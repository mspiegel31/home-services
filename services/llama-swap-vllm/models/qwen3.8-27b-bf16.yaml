# qwen3.8-27b-bf16 — one model in the llama-swap config-dir split.
# Shared macros (DOCKER_PREFIX, VLLM_COMMON, QWEN38_COMMON, ...) live in
# ../config.yaml. This file defines exactly one top-level key: models.

models:
  "qwen3.8-27b-bf16":
    name: Qwen3.8 27B BF16
    description: Qwen3.8 27B BF16 with FlashInfer, FP8 KV, native MTP3, auto-fit context, and 16 GiB RAM prefix cache
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "Qwen/Qwen3.8-27B"
    proxy: http://vllm-qwen3-8-27b-bf16:8000
    # Use the checkpoint's built-in MTP head, matching the FP8 dense and
    # Swift BF16 lanes. Both external drafters corrupted reasoning on reused
    # prefixes: repeated "!ductduct..." coincided with prefix hits and zero
    # draft acceptance, while a fresh cache_salt on the same prompt produced
    # a coherent tool call. Swapping DFlash2 for DSpark did not fix it, so
    # this lane keeps prefix caching and drops external drafters.
    # Keep max-model-len auto: MTP3's KV capacity has not been measured.
    # A 24 GiB native CPU KV tier could not allocate 24,575 MiB in /dev/shm
    # (17,373 MiB free at first launch). Use 16 GiB instead; offloading
    # evicted prefixes does not extend the active GPU context window.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-qwen3-8-27b-bf16
      --env MAX_JOBS=4
      --env VLLM_ENABLE_STARTUP_PLAN=1
      --env VLLM_DISABLED_KERNELS=FlashInferFP8ScaledMMLinearKernel
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-num-seqs 8
      --max-num-batched-tokens 4096
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.98
      --attention-backend FLASHINFER
      --kv-cache-dtype fp8
      --mamba-cache-mode align
      --kv-offloading-size 16
      --kv-offloading-backend native
      --generation-config auto
      --max-cudagraph-capture-size 16
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-qwen3-8-27b-bf16
