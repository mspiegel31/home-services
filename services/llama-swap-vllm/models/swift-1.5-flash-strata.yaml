# swift-1.5-flash-strata — one model in the llama-swap config-dir split.
# Shared macros live in ../config.yaml. This file defines exactly one top-level
# key: models.
#
# Strata (https://github.com/Niko1221/Strata) runs the GGUF quants of Swift 1.5
# with its own tiered-expert engine, not vLLM, so it takes no ${DOCKER_PREFIX}:
# that macro injects vLLM/HF env and the /mnt/models:/models bind, and the image
# carries its own entry point and env contract (see images/strata/Dockerfile).

models:
  "swift-1.5-flash-strata":
    name: Swift 1.5 Qwen3.8 Flash Next IQ3_XXS (Strata)
    description: Swift 1.5 Flash Next GSQ-RCO IQ3_XXS GGUF on the Strata tiered-expert engine, 262,144-token context, int8 KV, MTP drafts, n-gram table read from disk
    concurrencyLimit: 12
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      STRATA_IMAGE: "ghcr.io/mspiegel31/strata:6f32ec0"
    proxy: http://strata-swift-1-5-flash:8080
    # LOW_RAM=on because the host's MemTotal (107 GB) lies to setup.py, which
    # sizes RAM from /proc/meminfo: with all experts pinned it needs ~75 GB,
    # which is this box's whole allocatable ceiling. In this mode the engine
    # keeps in RAM only the experts the card does not hold, which on a 72 GB
    # card is none of them, so it runs at the RAM-resident speed with the
    # arena read from experts.bin. No --memory cap for the same reason: a cap
    # would not shrink the plan, only break it.
    # STRATA_ALLOWED_HOSTS is the engine's DNS-rebinding check: without an API
    # key it 403s any Host that is not an IP, and llama-swap connects by
    # container name. /data holds the GGUF, MTP layer, mmproj, the pack
    # (experts.bin included) and the config setup writes; the first start
    # downloads ~83 GB there. Setup picks --ple-io ram by itself when it reads
    # the model disk as rotational; the Proxmox disks are now ssd=1
    # (/sys/block/sd*/queue/rotational = 0), so a REINSTALL leaves the n-gram
    # table mmap'd from disk. The running config has --ple-io ram removed by
    # hand, measured A/B below.
    # /data is /mnt/more-models/strata on the 1.75 TB more-vm-data disk (sdc).
    # --ple-io A/B (900-token decode, three runs per mode, alternating):
    # direct 130.7/131.5/136.8 tok/s client-side, engine 132-142; ram
    # 131.2/140.1/140.5, engine 140-141. Steady state is identical, and the
    # strata process RSS is identical (34.5 GiB direct, 34.9 GiB ram) - the
    # 28.8 GB n-gram table is not charged to the process in either mode, so
    # removing --ple-io ram frees no RAM. It does remove a cold-start penalty:
    # the first ram run after load measured 24-53 tok/s while the table was
    # being read in. Direct is the engine's own default ("made for SSDs",
    # docs/DETAILS.md), which is what the disk now is.
    # Two different limits: past concurrencyLimit llama-swap 429s the caller,
    # while Strata queues. The engine's own knob is "parallel": N in
    # /mnt/more-models/strata/config/strata-swift-iq3_xxs.json (--batch N at start),
    # 2..8 - 8 is the ceiling, the engine's verify window holds 8 rows - so 12
    # here means 8 decode and the rest wait rather than fail.
    # "parallel" is hand-set on the volume: setup.py writes it only for an
    # explicit --parallel, which the image's env contract does not expose
    # (docker-entrypoint.sh builds setup.py's arguments itself and drops "$@").
    # A REINSTALL or a volume wipe therefore loses it; absent = one at a time.
    # Each slot costs 0.56 GiB of VRAM (its session, KV streaming keeping the
    # rest in RAM) plus its whole KV cache in pinned RAM (3.3 GB at 262144), and
    # batch slots carry no MTP drafts and no repetition/presence penalties.
    # Chat template: Strata renders the tokenizer dir's chat_template.jinja
    # (serve/server.py:4014, the config's "tokenizer" key). Setup writes the
    # GGUF's embedded template there - 8,952 bytes, reasoning_effort defaulting
    # to xhigh, accepting only low/medium/xhigh. A read-only single-file bind
    # mounts the repo's Froggeric v22.5 template
    # (images/vllm-fastokens/qwen3.8-froggeric-v22.5.jinja, 28,250 bytes,
    # default medium) over it, so this lane renders the same template as the
    # vLLM Swift lanes: per-message think_on/think_off state, tool-argument
    # truncation, preserve_thinking. The bind survives a re-pack, which would
    # overwrite a copied file. After a volume wipe, run the cmd with the bind
    # line removed for setup's first pass: tools/strata_tokenizer.py:297 opens
    # that exact path for writing and dies with EROFS against the bind.
    # Verified live with the bind in place: low/medium/xhigh each change the
    # reasoning block, chat_template_kwargs.enable_thinking=false yields an
    # empty think block, native tool calls emit structured tool_calls, and an
    # unknown effort is a 400 from the engine, not a crash.
    # STRATA_VERIFY_ALL_RESIDENT=0 works around a 0.1.39 engine bug
    # (github.com/Niko1221/Strata/issues/776, fix in PR #792, unmerged): with
    # every expert in VRAM the verify window is captured as the zero-doorbell
    # graph, which rings no layer, yet batch windows still wait on layer 0's
    # ring. The second concurrent chat then hits "verify batch: timed out at
    # layer 0", the engine exits 1 and restarts, in a loop. Cost per the issue:
    # solo decode ~6% slower (130 -> 122 tok/s). Drop it once STRATA_IMAGE
    # carries #792.
    cmd: >-
      docker run --init --rm --gpus all --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --network llama-swap-vllm-backend
      --env FAMILY=swift --env MODEL=IQ3_XXS --env CONTEXT=262144
      --env VISION=yes --env GPU=0 --env LOW_RAM=on
      --env HOST=0.0.0.0 --env PORT=8080
      --env STRATA_ALLOWED_HOSTS=strata-swift-1-5-flash
      --env STRATA_VERIFY_ALL_RESIDENT=0
      --volume /mnt/more-models/strata:/data
      --volume /mnt/more-models/strata/chat-templates/qwen3.8-froggeric-v22.5.jinja:/data/packs/swift-iq3_xxs/tokenizer/chat_template.jinja:ro
      --label io.mspiegel.llama-swap.managed=true
      --label io.mspiegel.llama-swap.model=${MODEL_ID}
      --name strata-swift-1-5-flash
      ${STRATA_IMAGE}
    cmdStop: docker stop --time 90 strata-swift-1-5-flash
