# swift-1.5-flash-strata — one model in the llama-swap config-dir split.
# Shared macros live in ../config.yaml. This file defines exactly one top-level
# key: models.
#
# Strata (https://github.com/Niko1221/Strata) runs the GGUF quants of Swift 1.5
# with its own tiered-expert engine, not vLLM, so it takes no ${DOCKER_PREFIX}:
# that macro injects vLLM/HF env and the /mnt/models:/models bind, and the image
# carries its own entry point and env contract (see images/strata/Dockerfile).

models:
  "swift-1.5-flash-strata":
    name: Swift 1.5 Qwen3.8 Flash Next IQ3_XXS (Strata)
    description: Swift 1.5 Flash Next GSQ-RCO IQ3_XXS GGUF on the Strata tiered-expert engine, 262,144-token context, int8 KV, MTP drafts, n-gram table read from disk
    concurrencyLimit: 12
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      STRATA_IMAGE: "ghcr.io/mspiegel31/strata:e8ca9af"
    proxy: http://strata-swift-1-5-flash:8080
    # LOW_RAM=on because the host's MemTotal (107 GB) lies to setup.py, which
    # sizes RAM from /proc/meminfo: with all experts pinned it needs ~75 GB,
    # which is this box's whole allocatable ceiling. In this mode the engine
    # keeps in RAM only the experts the card does not hold, which on a 72 GB
    # card is none of them, so it runs at the RAM-resident speed with the
    # arena read from experts.bin. No --memory cap for the same reason: a cap
    # would not shrink the plan, only break it.
    # STRATA_ALLOWED_HOSTS is the engine's DNS-rebinding check: without an API
    # key it 403s any Host that is not an IP, and llama-swap connects by
    # container name. /data holds the GGUF, MTP layer, mmproj, the pack
    # (experts.bin included) and the config setup writes; the first start
    # downloads ~83 GB there.
    # /data is /mnt/more-models/strata on the 1.75 TB more-vm-data disk (sdc).
    # PLE (the 28.8 GB n-gram table, per_layer_token_embd.weight) is kept in
    # RAM by STRATA_PLE_IO=ram below. Setup adds --ple-io only when it reads
    # the model disk as rotational (#605); sdc reports
    # /sys/block/sdc/queue/rotational = 0, an SSD, so setup alone would leave
    # the engine default, --ple-io direct. parallel, --vram-reserve-mib and
    # --ple-io all come from the cmd env: images/strata/merge_args.py writes
    # them into the config json on every start, so a REINSTALL keeps them.
    # The engine's own words: direct = "unbuffered SSD reads, the table never
    # enters RAM or the file cache"; ram = "mmap with the whole table locked in
    # RAM at start". Measured on the live lane (strata process RSS): direct
    # 36.9 GB, ram 52.3 GB - the table is charged to the process in ram mode.
    # Decode, 900 tokens at xhigh: direct 198.7/211.2/211.0 tok/s, ram
    # 212.9/212.9/214.4. 8 concurrent slots:
    # direct 222.3 tok/s aggregate, ram 223.7 - 28 tok/s per slot either way.
    # ram costs 15.4 GB of RAM for a few percent on single-stream and removes
    # the cold-start penalty (the first decode after a load measured 24-53
    # tok/s while the table was read in). The box has 107 GB and 41 GB
    # available with the lane loaded, so the table stays resident.
    # Two different limits: past concurrencyLimit llama-swap 429s the caller,
    # while Strata queues. The engine's own knob is "parallel": N in the config
    # json (--batch N at start), 2..8 - so 12 here means 6 decode (PARALLEL=6)
    # and the rest wait rather than fail. 6 because the engine's verify path
    # keeps one CUDA graph pair per distinct busy-slot subset and never evicts
    # them (~9 MiB/pair, 2^N-1 subsets; full diagnosis in merge_args.py's
    # docstring) - at 8 slots the pairs accumulated past --vram-reserve-mib
    # 700 on the iq4xs lane: "verify: batch instantiate: out of memory",
    # engine restart loop. STRATA_VRAM_RESERVE_MIB=2048 leaves room for all
    # 63 subsets of 6 slots (rule: post-load free VRAM >= (2^6-1) x ~9 MiB x
    # 1.5). Each slot costs 0.95 GiB of VRAM at 262144 with --kv-resident
    # 32768 (its session, KV streaming keeping the rest in RAM) plus its whole
    # KV cache in pinned RAM (3.3 GB at 262144); batch slots carry no
    # repetition/presence penalties and no MTP drafts unless
    # STRATA_BATCH_MTP=1 (below).
    # STRATA_BATCH_MTP=1 (0.1.40, PR #846): batch slots keep MTP drafts —
    # +31-39% aggregate with 2-4 clients, upstream on the RTX PRO 5000;
    # graceful degrade (logged) if draft state exceeds free VRAM.
    # STRATA_PREFILL_CPU_SHARE=auto (0.1.40.2): CPU computes least-routed
    # experts for prompt chunks under 1024 tokens, 19-35% faster chat turns;
    # not byte-identical (mean KL 0.006).
    # The multi-session cache flags (--prompt-cache 32, --conversation-cache-*)
    # are merged into this config the same way, on every start.
    # Chat template: Strata renders the tokenizer dir's chat_template.jinja
    # (serve/server.py:4014, the config's "tokenizer" key), which setup writes
    # from the GGUF's embedded template (8,952 bytes here, reasoning_effort
    # defaulting to xhigh, accepting only low/medium/xhigh).
    # /mnt/more-models/strata/tokenizers/qwen3.8-flash-next supplies the whole
    # directory instead: vocab.json, merges.txt, token_type.json and
    # tokenizer.json are byte-identical between Swift 1.5 and the base model's
    # UD-IQ4_XS (cmp-verified - both derive from Qwen3.8-Flash-Next), and
    # chat_template.jinja is the repo's Froggeric v22.5
    # (images/vllm-fastokens/qwen3.8-froggeric-v22.5.jinja, 28,250 bytes,
    # default medium), so this lane renders what the vLLM Swift lanes render:
    # per-message think_on/think_off state, tool-argument truncation,
    # preserve_thinking.
    # It is mounted as a DIRECTORY over <pack>/tokenizer, never as a
    # single-file bind over chat_template.jinja: the extraction guards test for
    # vocab.json (setup.py:4182) and vocab.json+chat_template.jinja
    # (tools/iq_pack.py:564), so a file bind creates the template while
    # vocab.json is still missing, the one writer that then runs dies with
    # EROFS, and the 0-byte file it leaves makes every later run skip the
    # writer and serve an empty template. With the directory mounted, both
    # guards skip the writer and nothing is ever written into the pack.
    # Verified live with the bind in place: low/medium/xhigh each change the
    # reasoning block, chat_template_kwargs.enable_thinking=false yields an
    # empty think block, native tool calls emit structured tool_calls, and an
    # unknown effort is a 400 from the engine, not a crash.
    cmd: >-
      docker run --init --rm --gpus all --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --network llama-swap-vllm-backend
      --env FAMILY=swift --env MODEL=IQ3_XXS --env CONTEXT=262144
      --env VISION=yes --env GPU=0 --env LOW_RAM=on --env PARALLEL=6
      --env STRATA_VRAM_RESERVE_MIB=2048 --env STRATA_PLE_IO=ram
      --env STRATA_BATCH_MTP=1 --env STRATA_PREFILL_CPU_SHARE=auto
      --env HOST=0.0.0.0 --env PORT=8080
      --env STRATA_ALLOWED_HOSTS=strata-swift-1-5-flash
      --volume /mnt/more-models/strata:/data
      --volume /mnt/more-models/strata/tokenizers/qwen3.8-flash-next:/data/packs/swift-iq3_xxs/tokenizer:ro
      --label io.mspiegel.llama-swap.managed=true
      --label io.mspiegel.llama-swap.model=${MODEL_ID}
      --name strata-swift-1-5-flash
      ${STRATA_IMAGE}
    cmdStop: docker stop --time 90 strata-swift-1-5-flash
