# qwen3.8-27b-fp8 — one model in the llama-swap config-dir split.
# Shared macros (DOCKER_PREFIX, VLLM_COMMON, QWEN38_COMMON, ...) live in
# ../config.yaml. This file defines exactly one top-level key: models.

models:
  "qwen3.8-27b-fp8":
    name: Qwen3.8 27B FP8 DSpark
    description: Qwen3.8 27B FP8 weights with Red Hat DSpark7, BF16 KV, auto-fit context, and prefix caching disabled
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      # All Qwen3.8-derived lanes share the Froggeric three-tier contract.
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "Qwen/Qwen3.8-27B-FP8"
    proxy: http://vllm-qwen3-8-27b-fp8:8000
    # DSpark7 speculative head for the Qwen3.8-27B base weights:
    # https://huggingface.co/RedHatAI/Qwen3.8-27B-speculator.dspark
    # Both DFlash2 and DSpark corrupted reasoning on reused prefixes in this
    # hybrid GDN architecture, at zero draft acceptance (vllm#53912); swapping
    # drafter or weight quant did not fix the recurrent-state bookkeeping. The
    # negative flag below overrides VLLM_COMMON's prefix-cache default.
    # BF16 KV matches the other quantized dense 27B lanes; the KV pool with the
    # external drafter has not been measured.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-qwen3-8-27b-fp8
      --env VLLM_ENABLE_STARTUP_PLAN=1
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --no-enable-prefix-caching
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.90
      --attention-backend FLASHINFER
      --kv-cache-dtype bfloat16
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
      --speculative-config '{"method":"dspark","model":"RedHatAI/Qwen3.8-27B-speculator.dspark","num_speculative_tokens":7}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-qwen3-8-27b-fp8
