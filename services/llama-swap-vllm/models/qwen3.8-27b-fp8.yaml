# qwen3.8-27b-fp8 — one model in the llama-swap config-dir split.
# Shared macros (DOCKER_PREFIX, VLLM_COMMON, QWEN38_COMMON, ...) live in
# ../config.yaml. This file defines exactly one top-level key: models.

models:
  # Use built-in MTP3 instead of DFlash2 after cached-prefix corruption.
  # Prefix caching stays enabled; cached-repeat correctness needs runtime validation.
  "qwen3.8-27b-fp8":
    name: Qwen3.8 27B FP8
    description: Qwen3.8 27B FP8 weights with BF16 KV and auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      # All Qwen3.8-derived lanes share the Froggeric three-tier contract.
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "Qwen/Qwen3.8-27B-FP8"
    proxy: http://vllm-qwen3-8-27b-fp8:8000
    # Match the other quantized dense 27B lanes' BF16 KV; the resulting KV
    # pool has not been measured. The BF16 Swift and Flash Next lanes retain
    # FP8 KV to preserve their measured long-context memory budgets.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-qwen3-8-27b-fp8
      --env VLLM_ENABLE_STARTUP_PLAN=1
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.90
      --attention-backend FLASHINFER
      --kv-cache-dtype bfloat16
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-qwen3-8-27b-fp8
