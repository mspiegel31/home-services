# qwen3.8-flash-next-unsloth-q5kxl-strata — one model in the llama-swap
# config-dir split. Shared macros live in ../config.yaml. This file defines
# exactly one top-level key: models.
#
# Unsloth's UD-Q5_K_XL of the ORIGINAL Qwen3.8-Flash-Next replaces the retired
# UD-Q6_K_XL lane: on the 0.1.44 quant yardstick (docs/QUANTS.md, 4,995
# teacher-forced positions against Q8_0) Q5 is 94.55% same top token / mean KL
# 0.038 against Q6's 94.61% / 0.033 — the same answers in practice — while
# decoding faster (57-60 vs 54 tok/s on a story, 81-83 vs 76 on code, R9700
# with every expert in RAM) and 11 GB smaller. Its routed experts are Q5_K
# gate/up (Q6_K in layer 2) + Q8_0 down: 91.6 GiB, between the Q4 lane's 71.7
# GiB and Q6's 101.7 GiB.
#
# ENGINE: ed4773e.2 adds a fail-fast hugepage preflight to the ed4773e.1
# shard-alignment fix. The pinned upstream 0.1.44 rejects this pack's shard 1:
# check_shards derives a shard's needed
# length from its GGUF header, which counts 6 bytes of final-tensor alignment
# padding HuggingFace never wrote, so a SHA-perfect download (10,946,618 bytes)
# fails setup as "short" of 10,946,624. The patch allows 64 bytes of slack,
# mirroring the same alignment note upstream's longer-than-its-tensor branch
# already makes. 0.1.44 builds the Q6_K expert kernels + libstrata_kq.so by
# default (STRATA_MMQ_KQ=1) and has UD-Q5_K_XL in setup.py's MODELS table, so
# this lane uses the normal MODEL= setup path; the fresh setup writes the
# Unsloth env block itself (STRATA_MMQ_KQ=1, STRATA_HC_Q8=1; route tail skip
# stays on in budget mode).
#
# The installed config uses full residency: no --resident-budget-gib or
# --mmap-experts. Its 91.6 GiB expert arena needs explicit hugepages beside
# the OS and other services. STRATA_PLE_IO=direct keeps the 50.7 GiB Q8_0
# PLE table on disk rather than competing for the remaining host RAM.
#
# The expert arena needs 46,909 2-MiB hugepages. Without them the 4K-page
# fallback exceeded server.py's 900 s READY budget (2026-10-13); with them,
# READY took ~45 s. Hugepages are a host prerequisite, never changed by this
# container. Reserve them only while Strata runs; release them before switching
# to a RAM-offloaded engine. A permanent 91.6-GiB reservation can OOM the VM.
# STRATA_REQUIRED_HUGEPAGES checks free minus outstanding reservations before
# setup or the encoder starts. A pool sized exactly for Q5 has no room for
# PostgreSQL's default huge_pages=try; the LiteLLM stack disables that use.
# This check does not reserve pages: host allocation and other consumers must
# remain stable during startup. On Talos, provision the pool in machine config
# and expose the matching hugepage resources to the pod.
#
# VRAM plan: 72 GB of VRAM caches ~66 GiB of the 91.6 GiB of experts (~72%);
# the rest is served from the host expert arena. Expect decode
# under the Q4 lane's ~100-117 tok/s solo — this lane trades speed for
# near-Q8_0 quality.
#
# parallel 4 limits the batch-slot share of VRAM. A batch slot
# costs ~0.95 GiB of VRAM plus its share of the verify-path CUDA-graph working
# set (merge_args.py's docstring), and this lane's expert cache is tighter than
# the Q4 lane's, so every slot is VRAM taken from experts. The multi-session
# cache flags (--prompt-cache 32, --conversation-cache-*) merge from env on
# every start like the Q4 lane's.
# STRATA_BATCH_MTP=1: batch slots keep MTP drafts (+31-39% aggregate with 2-4
# clients, measured upstream on the RTX PRO 5000).
# STRATA_PREFILL_CPU_SHARE=auto + MAX=1024: same reasoning as the Q4 lane.
#
# Model files: staged on the box by /mnt/more-models/strata/download-ud-q5_k_xl.sh
# (box-only, mirrors the Q4/Q6 downloaders: curl per shard, sizes + SHA-256
# from setup.py's UNSLOTH_BIG_SHARDS at rev 38bb39e, setup-compatible .done
# marks). Shards 2 (output head) and 3 (the 54 GB Q8_0 PLE table) are
# byte-identical across UD-Q5_K_XL / UD-Q6_K_XL / Q8_0 (docs/QUANTS.md), so
# the downloader hardlinks them from the already-present unsloth-UD-Q6_K_XL
# set: ~103 GB of new bytes, not 158. The six shards land under
# /data/models/unsloth-UD-Q5_K_XL/; setup verifies via the .done marks and
# packs --compat-bf16 (budget models read the GGUFs in place, no experts.bin).
#
# Chat template: /mnt/more-models/strata/tokenizers/qwen3.8-flash-next
# supplies the whole tokenizer directory (same base model as every other lane,
# repo's Froggeric chat_template.jinja). Mounted as a DIRECTORY over
# <pack>/tokenizer so the extraction guards skip their writers.
#
# Vision: MODELS["UD-Q5_K_XL"] has "vision": True in 0.1.44 (upstream ran the
# shared mmproj end to end with this file on an R9700 CPU encoder), so setup
# wires images itself — no STRATA_VISION_MMPROJ force like the Q4 lane needed.
# The GPU encoder shares the 2048 MiB reserve.

models:
  "qwen3.8-flash-next-unsloth-q5kxl-strata":
    name: Qwen3.8 Flash Next UD-Q5_K_XL (Strata, Unsloth)
    description: Unsloth UD-Q5_K_XL GGUF of Qwen3.8 Flash Next on the Strata tiered-expert engine, 262,144-token context, int8 KV, MTP drafts, 91.6 GiB host expert arena requiring uncommitted 2 MiB hugepages, Q8_0 PLE table streamed from disk, images via the shared BF16 mmproj
    concurrencyLimit: 8
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      STRATA_IMAGE: "ghcr.io/mspiegel31/strata:ed4773e.2"
    proxy: http://strata-qwen3-8-flash-next-unsloth-q5kxl:8080
    cmd: >-
      docker run --init --rm --gpus all --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --network llama-swap-vllm-backend
      --env FAMILY=unsloth --env MODEL=UD-Q5_K_XL --env CONTEXT=262144
      --env VISION=yes --env GPU=0 --env LOW_RAM=auto --env PARALLEL=4
      --env STRATA_VRAM_RESERVE_MIB=2048 --env STRATA_PLE_IO=direct
      --env STRATA_REQUIRED_HUGEPAGES=46909
      --env HOST=0.0.0.0 --env PORT=8080
      --env STRATA_ALLOWED_HOSTS=strata-qwen3-8-flash-next-unsloth-q5kxl
      --env STRATA_BATCH_MTP=1 --env STRATA_PREFILL_CPU_SHARE=auto
      --env STRATA_PREFILL_CPU_SHARE_MAX=1024
      --volume /mnt/more-models/strata:/data
      --volume /mnt/more-models/strata/tokenizers/qwen3.8-flash-next:/data/packs/unsloth-ud-q5_k_xl/tokenizer:ro
      --label io.mspiegel.llama-swap.managed=true
      --label io.mspiegel.llama-swap.model=${MODEL_ID}
      --name strata-qwen3-8-flash-next-unsloth-q5kxl
      ${STRATA_IMAGE}
    cmdStop: docker stop --time 90 strata-qwen3-8-flash-next-unsloth-q5kxl
