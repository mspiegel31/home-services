# swift-1.5-flash-nvfp4 — one model in the llama-swap config-dir split.
# Shared macros (DOCKER_PREFIX, VLLM_COMMON, QWEN38_COMMON, ...) live in
# ../config.yaml. This file defines exactly one top-level key: models.

models:
  "swift-1.5-flash-nvfp4":
    name: Swift 1.5 Qwen3.8 Flash Next NVFP4
    description: Swift 1.5 Flash Next NVFP4 with FP8 host PLE, 262,144-token context, BF16 KV, and MTP3
    concurrencyLimit: 4
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens@sha256:b298ea1c97bcdc4ff6755a7616b4c4fbb98d0e9a9b335b78468f13fff0fa3c47"
      checkpoint: "/models/huggingface/models/d0xin/Swift-1.5-Qwen3.8-Flash-Next-NVFP4-FP8PLE"
      USE_FASTOKENS: "1"
      MAX_NUM_SEQS: "4"
    proxy: http://vllm-swift-1-5-flash-nvfp4:8000
    # Stock vLLM uses pinned-host FP8 PLE; LIL's table-memory flags do not apply.
    # QSA in this image supports BF16 KV, not the LIL lane's FP8 KV.
    # Preserve MTP3 and budget expert offload separately from the 47.68 GiB PLE.
    cmd: >-
      ${DOCKER_PREFIX}
      --env VLLM_PLE_CPU_OFFLOAD=1
      --name vllm-swift-1-5-flash-nvfp4
      ${VLLM_IMAGE}
      ${VLLM_COMMON} ${QWEN38_COMMON}
      --load-format safetensors
      --dtype bfloat16 --kv-cache-dtype bfloat16
      --max-model-len 262144 --max-num-batched-tokens 4096
      --gpu-memory-utilization 0.96
      --cpu-offload-gb 25 --cpu-offload-params experts
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --mamba-cache-mode align
      --max-cudagraph-capture-size 16
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
    cmdStop: docker stop --time 90 vllm-swift-1-5-flash-nvfp4
