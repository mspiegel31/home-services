# swift-1.5-flash-nvfp4 — one model in the llama-swap config-dir split.
# Shared macros (DOCKER_PREFIX, VLLM_COMMON, QWEN38_COMMON, ...) live in
# ../config.yaml. This file defines exactly one top-level key: models.

models:
  "swift-1.5-flash-nvfp4":
    name: Swift 1.5 Qwen3.8 Flash Next W4A16
    description: Swift 1.5 Flash Next AutoRound W4A16 with FP8 host PLE, 262,144-token context, BF16 KV, and compact INT4 MTP3
    concurrencyLimit: 4
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      VLLM_IMAGE: "ghcr.io/local-inference-lab/vllm:karmic-kraken-beta-20261002-7b398c9e420c91eb@sha256:2230db60afb4fd06dc2ef2b7f7f27dc7f78d7a50be70a08461b4df9fa5e90732"
      checkpoint: "/models/huggingface/models/auggie246/Swift-1.5-Qwen3.8-Flash-Next-W4A16-FP8PLE"
      MAX_NUM_SEQS: "4"
    proxy: http://vllm-swift-1-5-flash-nvfp4:8000
    # Keep the existing client model ID; the checkpoint now uses AutoRound W4A16.
    # Bypass LIL's NVFP4 preset: this backbone is AutoRound INT4 with FP8 PLE.
    # The separate compressed-tensors MTP must retain its own quantization.
    # This AutoRound lane selects standard QSA, which rejects FP8 main KV;
    # the fork's FP8-capable b12x QSA is selected by b12x linear/MoE backends.
    # The 96 GiB cgroup limit leaves headroom for the VM's other services.
    # PyTorch otherwise rounds the 47.68 GiB pinned PLE allocation to 64 GiB.
    # Exact-size large pinned blocks also avoid rounding each offloaded expert.
    # 2026-10-03 smoke: MTP3 completion passed; exact-size pinning reduced
    # cgroup shmem from 82.18 to 61.96 GiB. Minimum host MemAvailable was
    # 35.37 GiB, with no cgroup OOM events. Full-context load is unverified.
    cmd: >-
      docker run --init --rm --gpus all --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --network llama-swap-vllm-backend
      --env HF_TOKEN --env HF_HOME=/models/huggingface
      --env VLLM_PLE_TABLE_MEMORY=ram --env VLLM_PLE_CPU_OFFLOAD=1
      --env VLLM_ENABLE_STARTUP_PLAN=1 --env MAX_JOBS=4
      --env VLLM_CACHE_ROOT=/cache/vllm
      --env PYTORCH_ALLOC_CONF=pinned_max_round_threshold_mb:16
      --volume /mnt/models:/models
      --volume llama-swap_llama-swap-config:/config:ro
      --volume /mnt/models/swift-1.5-flash-runtime:/cache
      --label io.mspiegel.llama-swap.managed=true
      --label io.mspiegel.llama-swap.model=${MODEL_ID}
      --memory 96g --memory-swap 104g
      --name vllm-swift-1-5-flash-nvfp4
      --entrypoint /opt/venv/bin/vllm
      ${VLLM_IMAGE}
      serve ${checkpoint} --served-model-name ${MODEL_ID}
      --enable-prefix-caching --max-num-seqs ${MAX_NUM_SEQS}
      ${QWEN38_COMMON}
      --load-format safetensors
      --safetensors-load-strategy lazy
      --dtype bfloat16 --kv-cache-dtype bfloat16
      --max-model-len 262144 --max-num-batched-tokens 4096
      --gpu-memory-utilization 0.96
      --cpu-offload-gb 14 --cpu-offload-params experts
      --speculative-config '{"method":"mtp","num_speculative_tokens":3,"model":"/models/huggingface/models/auggie246/Swift-1.5-Qwen3.8-Flash-Next-W4A16-FP8PLE/runtime/mtp-int4-g32"}'
      --mamba-cache-mode align
      --max-cudagraph-capture-size 16
      --chat-template /config/current/images/vllm-fastokens/qwen3.8-froggeric-v22.5.jinja
    cmdStop: docker stop --time 90 vllm-swift-1-5-flash-nvfp4
