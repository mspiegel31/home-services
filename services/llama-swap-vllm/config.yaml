    proxy: http://vllm-gemma-4-31b:8000
    # Gemma 4 has heterogeneous per-layer head_dim (256 sliding, 512 global
    # attention); v0.27.1 + transformers ≥5.15 crashed with
    # AmbiguousGlobalPerLayerAttributeError. Fixed upstream in vllm PR #49797
    # (merged 2026-08-10), which shipped in v0.28.0 — so this model now uses
    # the global VLLM_IMAGE (v0.28.0) like the others.
    cmd: >-
