      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
      --performance-mode throughput
    cmdStop: docker stop --time 90 vllm-ornith-1-5-9b

  "gemma-4-26b-a4b":
    name: Google Gemma 4 26B-A4B NVFP4
    description: Gemma 4 26B-A4B MoE (128 experts, top-8) with auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [minimal, low, medium, high]
    macros:
      checkpoint: "unsloth/gemma-4-26B-A4B-it-NVFP4"
      MAX_NUM_SEQS: "64"
    proxy: http://vllm-gemma-4-26b:8000
    # Gemma 4 has heterogeneous per-layer head_dim (256 sliding, 512 global
    # attention); v0.27.1 + transformers ≥5.15 crashed with
    # AmbiguousGlobalPerLayerAttributeError. Fixed upstream in vllm PR #49797
    # (merged 2026-08-10), which shipped in v0.28.0 — so this model now uses
    # the global VLLM_IMAGE (v0.28.0) like the others.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-gemma-4-26b
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.4
      --kv-cache-dtype fp8
      --reasoning-parser gemma4
      --tool-call-parser gemma4
      --enable-auto-tool-choice
    cmdStop: docker stop --time 90 vllm-gemma-4-26b

