  #     reasoning: true
  #     thinking: true
  #     reasoning_effort: [low, high, max]
  #   macros:
  #     FREETOKEN_IMAGE: "ghcr.io/mspiegel31/freetoken:latest"
  #     checkpoint: "/models/huggingface/models/deepseek-ai/DeepSeek-V4-Flash-0731"
  #   proxy: http://freetoken-deepseek-v4-flash:1919
  #   # 156GB checkpoint (FP8 dense + FP4 experts) on the 72GB GPU: FreeToken's
  #   # bandwidth-adaptive offload backend keeps an LRU of hot expert slots in
  #   # VRAM; misses stream from the SSD page cache or compute on CPU. First
  #   # request is slow (JIT kernel compile + weight page-in) — the named
  #   # volume keeps the JIT/benchbw cache warm across container rebuilds.
