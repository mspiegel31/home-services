routing:
  router:
    settings:
      groups:
        dense:
          exclusive: false
          members:
            - muse-glimmer-30b
            - gemma-4-31b
            - qwen3.8-27b
        moe:
          exclusive: false
          members:
            - nemotron-3.5-lightning
            - ornith-1.5-35b-a3b
            - gemma-4-26b-a4b
