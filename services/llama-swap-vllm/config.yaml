      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      # ghcr.io/mspiegel31/vllm-fastokens:latest — see global macros note.
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead"
    proxy: http://vllm-qwen3-8-27b-nvfp4-bf16:8000
    # #54623 (open; fix PR #54624 pending): the qwen3_5 loader never routes
    # checkpoint-shipped KV scales. This checkpoint ships none at all, so
    # --kv-cache-dtype fp8 would run at the uncalibrated unit scale anyway
    # (init_fp8_kv_scales TODO: "scale is 1.0 if user uses on-the-fly fp8
    # kvcache quant"); auto (bf16) is the best quality reachable via args,
    # same rationale as the unsloth NVFP4 sibling above.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-qwen3-8-27b-nvfp4-bf16
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.9
      --kv-cache-dtype auto
      --speculative-config '{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-qwen3-8-27b-nvfp4-bf16


  "qwen3.8-27b-nvfp4-bf16-lmhead-sglang":
    name: Qwen3.8 27B NVFP4 BF16 LM Head (SGLang)
    description: Qwen3.8 27B mixed-precision (NVFP4 MLP, FP8 attention, BF16 embeddings/lm_head) served by SGLang with DFlash2 spec decode
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      SGLANG_IMAGE: "lmsysorg/sglang@sha256:eb090e39434085f713d39421cb2e5b6d342424aa95c3d9ecdfe8cadd4289e99b"
      checkpoint: "RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead"
    proxy: http://sglang-qwen3-8-27b-nvfp4-bf16:8000
    # Throughput profile for long-context agent fanout:
    #   prefix caching  -> radix cache + lazy Mamba checkpoint donation
    #   prefill         -> LPM groups the shared agent prefix; 4K chunks double
    #                      baseline size while fitting captured-graph headroom
    #   concurrency     -> 64 Mamba slots / 4 lazy-strategy slots per request
    #   state memory    -> a four-token DFlash window matches the measured
    #                      2.8-token acceptance length and halves per-request
    #                      speculative recurrent-state scratch
    #   context         -> the resulting KV pool must exceed the advertised
    #                      262,144-token per-request limit
    #   chat template   -> shared HF snapshot; qwen3_coder parses XML tools
    cmd: >-
      ${SGLANG_PREFIX}
      --name sglang-qwen3-8-27b-nvfp4-bf16
      ${SGLANG_IMAGE}
      sglang serve
      --model-path ${checkpoint}
      --served-model-name ${MODEL_ID}
      --host 0.0.0.0
      --port 8000
      --kv-cache-dtype fp8_e4m3
      --mem-fraction-static 0.92
      --attention-backend flashinfer
      --chunked-prefill-size 4096
      --max-prefill-tokens 16384
      --schedule-policy lpm
      --context-length 262144
      --max-running-requests 16
      --max-mamba-cache-size 64
      --mamba-radix-cache-strategy extra_buffer_lazy
      --mamba-ssm-dtype float32
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --enable-cache-report
      --speculative-algorithm DFLASH
      --speculative-draft-model-path incoai/Qwen3.8-27B-DFlash2
      --enable-metrics
      --speculative-num-draft-tokens 4
    cmdStop: docker stop --time 90 sglang-qwen3-8-27b-nvfp4-bf16

