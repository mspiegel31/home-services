healthCheckTimeout: 3600
logToStdout: both
globalTTL: 28800  # default model TTL in seconds; 28800 = 8 hours (8 × 3600)
unloadTimeout: 120

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"


macros:
  VLLM_IMAGE: "vllm/vllm-openai:v0.29.0@sha256:c2914767605584b6d8f45686b82de173ecc99e781897aa3d0a66dacd72c51ae1"
# fastokens image: ghcr.io/mspiegel31/vllm-fastokens:latest — derived from
# the pinned vllm/vllm-openai above; stock images don't ship fastokens
# (vllm#47855 — no pip extra, no build arg). Inlined per-model below:
# model-level macros can't reference global macros in llama-swap's
# expansion pass ("unknown macro" at load).
#
# VLLM_USE_FASTOKENS=1 requires the fastokens pip package in the image, so
# it's opt-in per model: set USE_FASTOKENS: "1" AND use the fastokens image.
# Otherwise vLLM crashes at startup (ImportError in apply_fastokens_patch).
  USE_FASTOKENS: "0"
  checkpoint: "${MODEL_ID}"
  DOCKER_PREFIX: >-
    docker run --init --rm --gpus all --ipc host
    --shm-size=16g --ulimit memlock=-1 --ulimit stack=67108864
    --network llama-swap-vllm-backend
    --env HF_TOKEN --env HF_HOME=/models/huggingface
    --env SAFETENSORS_FAST_GPU=1
    --env VLLM_CACHE_ROOT=/models/vllm --env VLLM_USE_FASTOKENS=${USE_FASTOKENS}
    --env PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
    --volume /mnt/models:/models
    --label io.mspiegel.llama-swap.managed=true
    --label io.mspiegel.llama-swap.model=${MODEL_ID}
  # ── vLLM engine flags ──────────────────────────────────────────
  # Docs: https://docs.vllm.ai/en/stable/configuration/engine_args/
  #
  # vLLM's automatic 1024-sequence limit OOMs Qwen3.8 DFlash2 warmup on 72GB.
  # 64 matches the desired concurrency ceiling; model-specific 32 limits remain.
  MAX_NUM_SEQS: "64"
  # interactivity captures an exact CUDA graph for every batch size 1-32
  # (zero padding); the step-8 captures throughput mode uses only win above
  # 32 tokens/step, i.e. ~9+ concurrent subagents with spec decode. Unlike
  # throughput it does not double the derived max-num-batched-tokens default,
  # so unpinned lanes now run at the derived 8K instead of 16K.
  VLLM_COMMON: "${checkpoint} --served-model-name ${MODEL_ID} --enable-prefix-caching --performance-mode interactivity --max-num-seqs ${MAX_NUM_SEQS}"
  QWEN38_COMMON: "--reasoning-parser qwen3 --tool-call-parser qwen3_xml --enable-auto-tool-choice"

models:
  "qwen3.8-flash-next-nvfp4":
    name: Qwen3.8 Flash Next NVFP4
    description: Qwen3.8 Flash Next QAD NVFP4 with 131,072-token context, disk-backed PLE, native RAM prefix cache, and MTP3
    concurrencyLimit: 4
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 131072
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      VLLM_IMAGE: "ghcr.io/local-inference-lab/vllm:karmic-kraken-beta-20260922-3221ccacf71002ea@sha256:bf2c8f5da6f1de82b345367102b528692231a23eadc1b49c180c82c397c77522"
      checkpoint: "/models/huggingface/models/local-inference-lab/Qwen3.8-Flash-Next-NVFP4"
    proxy: http://vllm-qwen3-8-flash-next:8000
    # https://github.com/local-inference-lab/rtx6kpro/blob/master/models/qwen38-flash-next.md
    # The LIL profile owns its launcher flags and JIT cache paths; stock
    # VLLM_COMMON/DOCKER_PREFIX overrides are not compatible with that contract.
    # Disk PLE preserves the checkpoint's table, not the Primitive AI sidecar.
    # io_uring needs a relaxed seccomp filter, limited to this container.
    # Non-PLE weights occupy 71.71 GiB before KV and working memory;
    # expert-weight offload and the native SimpleCPU prefix tier are separate.
    # InstantTensor's GPU staging OOMs during MTP loading on this 72 GB GPU;
    # safetensors loads the same weights without that transient allocation.
    cmd: >-
      docker run --init --rm --gpus all --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --security-opt seccomp=unconfined
      --network llama-swap-vllm-backend
      --name vllm-qwen3-8-flash-next
      --env HF_TOKEN --env HF_HOME=/models/huggingface
      --env PROFILE=qwen38-flash-next --env TP=1 --env DCP=1 --env PORT=8000
      --env MAX_MODEL_LEN=131072 --env MAX_NUM_SEQS=4
      --env MAX_NUM_BATCHED_TOKENS=4096 --env GPU_MEMORY_UTILIZATION=0.96
      --env VLLM_PLE_TABLE_MEMORY=disk
      --env CACHE_MODE=native --env NATIVE_KV_OFFLOADING_SIZE_GB=8
      --env MAX_JOBS=4
      --env VLLM_ENABLE_STARTUP_PLAN=1
      --volume /mnt/models:/models
      --volume llama-swap_llama-swap-config:/config:ro
      --volume /mnt/models/qwen3.8-flash-next-runtime:/cache
      --label io.mspiegel.llama-swap.managed=true
      --label io.mspiegel.llama-swap.model=${MODEL_ID}
      ${VLLM_IMAGE}
      --model ${checkpoint} --served-model-name ${MODEL_ID}
      --load-format safetensors
      --mode mtp --draft-tokens 3
      --cpu-offload-gb 12 --cpu-offload-params experts
      --max-cudagraph-capture-size 16
      --chat-template /config/current/images/vllm-fastokens/qwen3.8-froggeric-v22.5.jinja
    cmdStop: docker stop --time 90 vllm-qwen3-8-flash-next

  "swift-1.5-flash-nvfp4":
    name: Swift 1.5 Qwen3.8 Flash Next NVFP4
    description: Swift 1.5 Flash Next NVFP4 with 262,144-token served context, disk-backed PLE, native RAM prefix cache, and MTP3
    concurrencyLimit: 4
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      VLLM_IMAGE: "ghcr.io/local-inference-lab/vllm:karmic-kraken-beta-20260922-3221ccacf71002ea@sha256:bf2c8f5da6f1de82b345367102b528692231a23eadc1b49c180c82c397c77522"
      checkpoint: "/models/huggingface/models/ukisai/Swift-1.5-Qwen3.8-Flash-Next-NVFP4"
    proxy: http://vllm-swift-1-5-flash-nvfp4:8000
    # Swift's checkpoint uses the same Qwen4Exp ModelOpt NVFP4 architecture.
    # The fastokens vLLM 0.30.0 image recognizes it but lacks the disk PLE
    # table backend needed for this 174 GiB checkpoint on 64 GiB host RAM;
    # retain LIL's qwen38-flash-next profile and isolate its JIT cache.
    # Measured residency (2026-09-26): GPU-eligible tensors total 78.19 GiB
    # (56.25 NVFP4 + 7.03 FP8 + 6.85 BF16 body, 4.86 MTP draft, 1.18
    # embed_tokens, 1.18 lm_head, 0.84 vision) against 71.16 GiB usable VRAM,
    # and the 95.37 GiB PLE table stays on disk. Full residency is therefore
    # impossible, and the load-time floor is 20 GiB of expert offload: the
    # draft MoE layout conversion allocates a transient 3.12 GiB copy, and 19
    # GiB OOMs after KV allocation (also with CUDA graph profiling enabled).
    # 20 GiB yields a 4.56 GiB KV pool = 294,690 tokens (1.12x at 262,144);
    # the pool is graph-unaccounted because the profile pins
    # VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS=0, so raising
    # --gpu-memory-utilization past 0.96 or the batched-token chunk to 8192
    # shrinks it (1.76 GiB measured) and fails startup.
    # Host RAM (51 GiB) is the other binding constraint: the 20 GiB pinned
    # offload plus a 24 GiB native tier exhausted the VM (1.6 GiB available,
    # 7.0 GiB swap); an 8 GiB tier leaves ~9.7 GiB available.
    cmd: >-
      docker run --init --rm --gpus all --ipc host
      --ulimit memlock=-1 --ulimit stack=67108864
      --security-opt seccomp=unconfined
      --network llama-swap-vllm-backend
      --name vllm-swift-1-5-flash-nvfp4
      --env HF_TOKEN --env HF_HOME=/models/huggingface
      --env PROFILE=qwen38-flash-next --env TP=1 --env DCP=1 --env PORT=8000
      --env MAX_MODEL_LEN=262144 --env MAX_NUM_SEQS=4
      --env MAX_NUM_BATCHED_TOKENS=4096 --env GPU_MEMORY_UTILIZATION=0.96
      --env VLLM_PLE_TABLE_MEMORY=disk
      --env CACHE_MODE=native --env NATIVE_KV_OFFLOADING_SIZE_GB=8
      --env MAX_JOBS=4
      --env VLLM_ENABLE_STARTUP_PLAN=1
      --volume /mnt/models:/models
      --volume /mnt/models/swift-1.5-qwen3.8-flash-next-runtime:/cache
      --volume llama-swap_llama-swap-config:/config:ro
      --label io.mspiegel.llama-swap.managed=true
      --label io.mspiegel.llama-swap.model=${MODEL_ID}
      ${VLLM_IMAGE}
      --model ${checkpoint} --served-model-name ${MODEL_ID}
      --load-format safetensors
      --mode mtp --draft-tokens 3
      --cpu-offload-gb 20 --cpu-offload-params experts
      --max-cudagraph-capture-size 16
      --chat-template /config/current/images/vllm-fastokens/qwen3.8-froggeric-v22.5.jinja
    cmdStop: docker stop --time 90 vllm-swift-1-5-flash-nvfp4

  "swift-1.5-nvfp4":
    name: Swift 1.5 Qwen3.8 27B NVFP4
    description: UkisAI Swift-1.5-Qwen3.8-27b NVFP4 with native MTP spec decode and auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "ukisai/Swift-1.5-Qwen3.8-27b-NVFP4"
    proxy: http://vllm-swift-1-5-nvfp4:8000
    # Use the repo's patched Froggeric template rather than the checkpoint's
    # bundled template to preserve the three-tier OMP/LiteLLM effort contract.
    # Run NVFP4 weights through Marlin W4A16; keep FP8 layer dispatch automatic.
    # The override key describes the checkpoint scheme, not the selected kernel's
    # activation precision. No checkpoint changes; MTP3.
    #
    # KV cache: fp8 (e4m3) with unit scales — the checkpoint ships no
    # k/v scales (same plain cast as the bf16 lane, vllm#54623). Only the 16
    # full-attention layers' KV shrinks (64 -> 32 KiB/token); GDN state stays
    # bf16. On sm120 FA2 cannot read fp8 KV, so this also moves attention
    # from FLASH_ATTN to FLASHINFER — the intended test of the long-context
    # step-time growth (44 ms @~29K -> 109 ms @~145K under bf16 KV/FA2).
    # If the enlarged pool OOMs the prefill graph, pin
    # --max-num-batched-tokens 4096 as on the bf16 lane.
    # CPU KV offloading dropped 2026-09-27: 5h of logs showed the 8 GB tier
    # never served an external hit (0.0% across all samples) while the GPU
    # prefix cache sat at 85%, and long-prefill requests filled the arena
    # fast enough to spam "cannot store chunks" (6k+ lines, 7 requests).
    # The GPU pool (582k tokens under bf16 KV, ~2.2x a full 262k context) already covers the
    # working set; re-add only if contexts start evicting from GPU KV.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-swift-1-5-nvfp4
      --env MAX_JOBS=4
      --env VLLM_ENABLE_STARTUP_PLAN=1
      --env VLLM_DISABLED_KERNELS=FlashInferFP8ScaledMMLinearKernel
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --kernel-config '{"linear_backend_per_quant":{"nvfp4_w4a4":"marlin","nvfp4_w4a16":"marlin"}}'
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.96
      --kv-cache-dtype fp8
      --mamba-cache-mode align
      --generation-config auto
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-swift-1-5-nvfp4

  "swift-1.5-bf16":
    name: Swift 1.5 Qwen3.8 27B BF16
    description: UkisAI Swift-1.5-Qwen3.8-27b BF16 (quality canary) with native MTP5 spec decode and auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "ukisai/Swift-1.5-Qwen3.8-27b"
    proxy: http://vllm-swift-1-5-bf16:8000
    # BF16 quality canary that mirrors the swift-1.5 NVFP4 lane. Measured
    # weights 51.75 GiB (31.88 MLP, 13.49 attn, 2.37 embed, 2.37 lm_head,
    # 0.86 vision, 0.79 MTP draft) need no expert offload; 0.98 utilization
    # leaves ~16 GiB for KV + graphs, and the CPU tier fits 24 GiB.
    #
    # KV cache: fp8 with unit scales (the qwen3_5 loader does not apply
    # checkpoint KV scales yet, vllm#54623 — a plain cast, no calibration).
    # Only the 16 full-attention layers' KV is affected; the 48 GDN state
    # caches stay bf16. Effective cost measured 41.5 KiB/token.
    #
    # Prefill-graph OOM (2026-09-27): with fp8 KV the auto-fit pool grows to
    # 14.83 GiB (401,764 tokens, full 262,144 context) and the prefill AOT
    # graph at the derived 8192-token chunk then asks for a 544 MiB bf16
    # activation buffer with ~100 MiB free. Fix: pin the prefill chunk to
    # 4096, halving that buffer to 272 MiB (matches the flash-next lanes).
    # expandable_segments:True would also reclaim the ~902 MiB of stranded
    # allocator fragmentation, but VllmConfig rejects it here: the native KV
    # offloading connector pins host memory for DMA and VMM remapping would
    # invalidate those registrations (hence the DOCKER_PREFIX default).
    #
    # Spec decode: native MTP head at 5 draft tokens — the official
    # Qwen3.8-27B recipe's rtx_pro_6000 override; family BF16 draft
    # acceptance measured 92.2%. Graph cap 16 keeps graph memory out of the
    # KV pool and the mamba cache lines above the capture size (vllm#34571).
    # The 24 GiB CPU tier fits because the router never co-resides this
    # lane with the flash-next lanes (it evicts across sets). CPU tiers
    # only extend prefix reuse, never max_model_len.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-swift-1-5-bf16
      --env MAX_JOBS=4
      --env VLLM_ENABLE_STARTUP_PLAN=1
      --env VLLM_DISABLED_KERNELS=FlashInferFP8ScaledMMLinearKernel
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-num-seqs 8
      --max-num-batched-tokens 4096
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.98
      --kv-cache-dtype fp8
      --mamba-cache-mode align
      --kv-offloading-size 24
      --kv-offloading-backend native
      --generation-config auto
      --max-cudagraph-capture-size 16
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
      --speculative-config '{"method":"mtp","num_speculative_tokens":5}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-swift-1-5-bf16

  "swift-1.5-awq":
    name: Swift 1.5 Qwen3.8 27B AWQ
    description: UkisAI Swift-1.5-Qwen3.8-27b W4A16 AWQ (measured parity) with bf16 KV, native MTP5 spec decode, and 262,144 context
    concurrencyLimit: 4
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "ukisai/Swift-1.5-Qwen3.8-27b-W4A16-AWQ"
    proxy: http://vllm-swift-1-5-awq:8000
    # ukisai's measured-parity export (2026-09-21 single-seed: AIME 86.67
    # = their bf16, GPQA 88.38 vs 91.41, IFBench 72.00 = bf16). 18.21 GiB
    # on disk: group-4-bit W4A16 (group 128, int8 zero-points) on the MLP
    # and full-attn projections; lm_head, embeddings, vision tower, and
    # all GDN linear_attn projections stay bf16. kv_cache_scheme is null,
    # so fp8 KV would run at unit scales — bf16 KV is this lane's identity
    # vs the bf16 lane, which trades fp8 KV for full context.
    #
    # Native MTP5, matching the bf16 lane. The checkpoint's MTP head was
    # unusable as shipped: llm-compressor 0.13 dropped the mtp entry from
    # quantization_config.ignore, so vLLM built the draft quantized and
    # rejected the 15 bf16 tensors in model-mtp-bf16.safetensors. Fixed by
    # adding the canonical compressed-tensors pattern "re:^mtp.*" (what its
    # own save_mtp_tensors_to_checkpoint writes) to the cached config.json in
    # the HF hub snapshot — backup at config.json.orig. The patch lives
    # outside git: a cache re-download restores the buggy config and the lane
    # stops booting. Check "Avg Draft acceptance rate" under load.
    #
    # bf16 KV is ~64 KiB/token, so 262,144 needs ~17 GiB effective; at
    # util 0.9 the pool is ~40 GiB — full context with ~2x headroom. The
    # 16 GiB CPU tier was dropped 2026-09-27: the same 0% external-hit
    # finding as the NVFP4 lane, and the 2x GPU headroom makes the tier
    # redundant (re-add only if contexts start evicting from GPU KV).
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-swift-1-5-awq
      --env MAX_JOBS=4
      --env VLLM_ENABLE_STARTUP_PLAN=1
      --env VLLM_DISABLED_KERNELS=FlashInferFP8ScaledMMLinearKernel
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.9
      --kv-cache-dtype bfloat16
      --mamba-cache-mode align
      --generation-config auto
      --chat-template /opt/chat-templates/qwen3.8-froggeric-v22.5.jinja
      --speculative-config '{"method":"mtp","num_speculative_tokens":5}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-swift-1-5-awq

  "qwen3.8-27b-fp8":
    name: Qwen3.8 27B FP8
    description: Qwen3.8 27B FP8 with auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      # All Qwen3.8-derived lanes share the Froggeric three-tier contract.
      reasoning_effort: [low, medium, xhigh]
    macros:
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "Qwen/Qwen3.8-27B-FP8"
    proxy: http://vllm-qwen3-8-27b-fp8:8000
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-qwen3-8-27b-fp8
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-num-batched-tokens 4096
      --long-prefill-token-threshold 2048
      --max-model-len auto
      --gpu-memory-utilization 0.90
      --kv-cache-dtype fp8
      --speculative-config '{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-qwen3-8-27b-fp8

routing:
  router:
    use: matrix
    settings:
      matrix:
        sets:
          qwen-flash-next: "qwen3.8-flash-next-nvfp4"
          swift-flash-next: "swift-1.5-flash-nvfp4"
          co-resident: "qwen3.8-27b-fp8 | swift-1.5-nvfp4 | swift-1.5-bf16 | swift-1.5-awq"
