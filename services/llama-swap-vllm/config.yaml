  "qwen3.8-27b-nvfp4":
    name: Qwen3.8 27B NVFP4
    description: Qwen3.8 27B with auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      # ghcr.io/mspiegel31/vllm-fastokens:latest — see global macros note.
      USE_FASTOKENS: "1"
      VLLM_IMAGE: "ghcr.io/mspiegel31/vllm-fastokens:latest"
      checkpoint: "unsloth/Qwen3.8-27B-NVFP4"
    # Spec decode: DFlash2 (vllm#52816) — grouped dynamic depthwise conv +
    # candidate selector. Requires the #53435 load fix (decoder_layer_cls
    # indirection), both of which shipped in v0.28.0. 7 draft tokens/verify.
    # (Was MTP x3 — previously 1 due to an accuracy bug with prefix caching,
    # vllm#43559, closed in PR #43650/#47861.)
    # Sleep/wake disabled: garbled output on wake was caused by FP8 KV cache
    # scale factors not reinitialized (vllm#25800, fixed in PR #28783) and
    # prefix-cache not resetting (vllm#16234). Container vs native was not
    # the cause; re-enable when our vLLM image includes both fixes.
    proxy: http://vllm-qwen3-8-27b-nvfp4:8000
    # #54623 (open; fix PR #54624 pending): the qwen3_5 loader drops this
    # checkpoint's calibrated FP8 KV scales, so --kv-cache-dtype fp8 serves
    # uncalibrated at scale 1.0. Issue-measured GSM8K: 92.3 uncalibrated fp8
    # KV, 93.7 calibrated fp8 KV, 94.5 bf16 KV. auto (bf16) is the best
    # config reachable via args; restore --kv-cache-dtype fp8 when #54624
    # ships (calibrated scales + ~2x KV token capacity).
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-qwen3-8-27b-nvfp4
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.9
      --kv-cache-dtype auto
      --speculative-config '{"method":"dflash","model":"incoai/Qwen3.8-27B-DFlash2","num_speculative_tokens":7}'
      ${QWEN38_COMMON}
    cmdStop: docker stop --time 90 vllm-qwen3-8-27b-nvfp4

  "qwen3.8-27b-nvfp4-bf16-lmhead":
    name: Qwen3.8 27B NVFP4 BF16 LM Head
    description: Qwen3.8 27B mixed-precision (NVFP4 MLP, FP8 attention, BF16 embeddings/lm_head) with auto-fit context (native 262,144 when served alone)
    capabilities:
