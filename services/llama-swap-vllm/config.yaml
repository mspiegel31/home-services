routing:
  router:
    settings:
      groups:
        dense:
          exclusive: false
          members:
            - muse-glimmer-30b
            - gemma-4-31b
            - thinkingcap-qwen3.6-27b
            - ornith-1.5-35b-a3b
            - qwen3.8-27b-fp8
            - ornith-1.5-35b-a3b-fp8
            - qwen3.8-27b-bf16
            - qwen3.8-27b-nvfp4
        moe:
          exclusive: false
          members:
            - nemotron-3.5-lightning
            - north-mini-code-1.0-fp8
            - ornith-1.5-35b-a3b-nvfp4
            - ornith-1.5-9b-nvfp4
            - gemma-4-26b-a4b
