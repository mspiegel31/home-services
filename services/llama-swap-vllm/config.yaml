healthCheckTimeout: 3600
logToStdout: both
globalTTL: 28800  # default model TTL in seconds; 28800 = 8 hours (8 × 3600)
unloadTimeout: 120

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"

# hooks: event-driven actions
# Preload qwen3.8-27b on startup so it's warm and ready when the router
# comes online. Single-model preload; no group needed (see llama-swap docs).
hooks:
  on_startup:
    preload:
      - "qwen3.8-27b"

macros:
  VLLM_IMAGE: "vllm/vllm-openai:v0.27.1@sha256:0a51ea5b4ae2dc5d81890e5173f54203d2a3ae0cfffe51b8fd2afd4391bfd967"
  checkpoint: "${MODEL_ID}"
  DOCKER_PREFIX: >-
    docker run --init --rm --gpus all --ipc host
    --network llama-swap-vllm-backend
    --env HF_TOKEN --env HF_HOME=/models/huggingface
    --env VLLM_CACHE_ROOT=/models/vllm
    --env PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True
    --volume /mnt/models:/models
    --label io.mspiegel.llama-swap.managed=true
    --label io.mspiegel.llama-swap.model=${MODEL_ID}
  # ── vLLM engine flags ──────────────────────────────────────────
  # Docs: https://docs.vllm.ai/en/stable/configuration/engine_args/
  #
  # --max-num-seqs: max concurrent sequences. vLLM default = 1024 (≥70GB GPU).
  #   Co-residency on 72GB: at 0.40 util, ~241 linear-attention blocks available
  #   for hybrid SSM models → 128 is a safe shared cap. Solo models can go higher.
  #   Override per-model by setting MAX_NUM_SEQS in the model's macros.
  MAX_NUM_SEQS: "128"
  VLLM_COMMON: "--model ${checkpoint} --served-model-name ${MODEL_ID} --enable-prefix-caching --max-num-seqs ${MAX_NUM_SEQS}"

models:
  "muse-glimmer-30b":
    name: Muse Glimmer 30B NVFP4
    description: Muse Glimmer 30B with auto-fit context (native 131,072 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 131072
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, high, xhigh]
    macros:
      VLLM_IMAGE: "vllm/vllm-openai:muse-glimmer@sha256:413c8fbecb1204a218117c77a4ea4b3a211d5686ff99c31d82ba6dd0cec8c5a6"
      checkpoint: "Inferact/Muse-Glimmer-30B-NVFP4-W4A4"
      # DFlash spec decode needs lower --max-num-seqs: the global 128 produces
      # a negative token budget (-6144) with the draft head. 64 + explicit
      # --max-num-batched-tokens 16384 avoids the crash (recipes#782).
      MAX_NUM_SEQS: "64"
    proxy: http://vllm-muse-glimmer:8000
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-muse-glimmer
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.48
      --kv-cache-dtype fp8
      --reasoning-parser muse_glimmer
      --tool-call-parser muse_glimmer
      --enable-auto-tool-choice
      --speculative-config '{"method":"dflash","model":"meta-models/Muse-Glimmer-30B-assistant","num_speculative_tokens":15}'
    cmdStop: docker stop --time 90 vllm-muse-glimmer

  "gemma-4-31b":
    name: Google Gemma 4 31B NVFP4
    description: Gemma 4 31B dense with auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
    macros:
      VLLM_IMAGE: "vllm/vllm-openai:nightly@sha256:95bed119f39e2414973cf7224df31c9a3ed213566138722346d7bd360edf842b"
      checkpoint: "unsloth/gemma-4-31B-it-NVFP4"
    proxy: http://vllm-gemma-4-31b:8000
    # Gemma 4 models have heterogeneous per-layer head_dim (256 sliding, 512
    # global attention). v0.27.1 + transformers ≥5.15 crash with
    # AmbiguousGlobalPerLayerAttributeError. Fixed upstream in vllm PR #49797
    # (merged 2026-08-10), not in any stable release yet. Using nightly until
    # the next vLLM release ships — switch back to the global VLLM_IMAGE then.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-gemma-4-31b
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.48
      --kv-cache-dtype fp8
      --reasoning-parser gemma4
      --tool-call-parser gemma4
      --enable-auto-tool-choice
    cmdStop: docker stop --time 90 vllm-gemma-4-31b

  "qwen3.8-27b":
    name: Qwen3.8 27B NVFP4
    description: Qwen3.8 27B with auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, xhigh]
    macros:
      checkpoint: "unsloth/Qwen3.8-27B-NVFP4"
    # MTP: 3 draft tokens. Previously 1 due to accuracy bug with prefix
    # caching (vllm#43559, closed in PR #43650/#47861); bumping now.
    # Sleep/wake disabled: garbled output on wake was caused by FP8 KV cache
    # scale factors not reinitialized (vllm#25800, fixed in PR #28783) and
    # prefix-cache not resetting (vllm#16234). Container vs native was not
    # the cause; re-enable when our vLLM image includes both fixes.
    proxy: http://vllm-qwen3-8-27b:8000
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-qwen3-8-27b
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.9
      --kv-cache-dtype fp8
      --speculative-config '{"method":"mtp","num_speculative_tokens":3}'
      --reasoning-parser qwen3
      --tool-call-parser qwen3_coder
      --enable-auto-tool-choice
      --performance-mode throughput
    cmdStop: docker stop --time 90 vllm-qwen3-8-27b

  "nemotron-3.5-lightning":
    name: NVIDIA Nemotron 3.5 Lightning 30B-A3B NVFP4
    description: Nemotron 3.5 Lightning with auto-fit context (native 1,048,576 when served alone)
    capabilities:
      in: ["text"]
      out: ["text"]
      tools: true
      context: 1048576
    metadata:
      reasoning: true
      thinking: true
    macros:
      checkpoint: "nvidia/NVIDIA-Nemotron-3.5-Lightning-30B-A3B-NVFP4"
      MAX_NUM_SEQS: "64"
    proxy: http://vllm-nemotron-3-5:8000
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-nemotron-3-5
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.40
      --kv-cache-dtype fp8
      --max-num-batched-tokens 16384
      --mamba-backend flashinfer
      --mamba-ssm-cache-dtype float16
      --enable-mamba-cache-stochastic-rounding
      --mamba-cache-philox-rounds 5
      --reasoning-parser nemotron_v3
      --tool-call-parser qwen3_coder
      --enable-auto-tool-choice
    cmdStop: docker stop --time 90 vllm-nemotron-3-5

  "ornith-1.5-35b-a3b":
    name: Ornith 1.5 35B-A3B NVFP4
    description: Ornith 1.5 35B-A3B with auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
    macros:
      MAX_NUM_SEQS: "64"
      checkpoint: "ornith-ai/Ornith-1.5-35B-A3B-NVFP4"
    proxy: http://vllm-ornith-1-5:8000
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-ornith-1-5
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.40
      --kv-cache-dtype fp8
      --reasoning-parser qwen3
      --tool-call-parser qwen3_xml
      --enable-auto-tool-choice
    cmdStop: docker stop --time 90 vllm-ornith-1-5

  "gemma-4-26b-a4b":
    name: Google Gemma 4 26B-A4B NVFP4
    description: Gemma 4 26B-A4B MoE (128 experts, top-8) with auto-fit context (native 262,144 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
    macros:
      VLLM_IMAGE: "vllm/vllm-openai:nightly@sha256:95bed119f39e2414973cf7224df31c9a3ed213566138722346d7bd360edf842b"
      checkpoint: "unsloth/gemma-4-26B-A4B-it-NVFP4"
      MAX_NUM_SEQS: "64"
    proxy: http://vllm-gemma-4-26b:8000
    # Gemma 4 models have heterogeneous per-layer head_dim (256 sliding, 512
    # global attention). v0.27.1 + transformers ≥5.15 crash with
    # AmbiguousGlobalPerLayerAttributeError. Fixed upstream in vllm PR #49797
    # (merged 2026-08-10), not in any stable release yet. Using nightly until
    # the next vLLM release ships — switch back to the global VLLM_IMAGE then.
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-gemma-4-26b
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.40
      --kv-cache-dtype fp8
      --reasoning-parser gemma4
      --tool-call-parser gemma4
      --enable-auto-tool-choice
    cmdStop: docker stop --time 90 vllm-gemma-4-26b

  # "deepseek-v4-flash":
  #   name: DeepSeek V4 Flash
  #   description: DeepSeek-V4-Flash 290B MoE served by FreeToken (experts page in from SSD, hot experts LRU-cached on GPU)
