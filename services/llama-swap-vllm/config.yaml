healthCheckTimeout: 3600
logToStdout: both
globalTTL: 28800  # default model TTL in seconds; 28800 = 8 hours (8 × 3600)
unloadTimeout: 120

apiKeys:
  - "${env.LLAMA_SWAP_API_KEY}"


macros:
  VLLM_IMAGE: "vllm/vllm-openai:v0.28.0@sha256:61fc8a896b0a4fbbbdc063bc4b0dbc25ce98e02b5050c24aeb7830ac02039b14"
# fastokens image: ghcr.io/mspiegel31/vllm-fastokens:latest — derived from
# the pinned vllm/vllm-openai above; stock images don't ship fastokens
# (vllm#47855 — no pip extra, no build arg). Inlined per-model below:
# model-level macros can't reference global macros in llama-swap's
# expansion pass ("unknown macro" at load).
#
# VLLM_USE_FASTOKENS=1 requires the fastokens pip package in the image, so
# it's opt-in per model: set USE_FASTOKENS: "1" AND use the fastokens image.
# Otherwise vLLM crashes at startup (ImportError in apply_fastokens_patch).
  USE_FASTOKENS: "0"
  checkpoint: "${MODEL_ID}"
  DOCKER_PREFIX: >-
    docker run --init --rm --gpus all --ipc host
    --shm-size=16g --ulimit memlock=-1 --ulimit stack=67108864
    --network llama-swap-vllm-backend
    --env HF_TOKEN --env HF_HOME=/models/huggingface
    --env SAFETENSORS_FAST_GPU=1
    --env VLLM_CACHE_ROOT=/models/vllm --env VLLM_USE_FASTOKENS=${USE_FASTOKENS}
    --env PYTORCH_CUDA_ALLOC_CONF=expandable_segments:False
    --volume /mnt/models:/models
    --label io.mspiegel.llama-swap.managed=true
    --label io.mspiegel.llama-swap.model=${MODEL_ID}
  # SGLang backends. No VLLM_*/PYTORCH_CUDA_ALLOC_CONF (vLLM-only knobs);
  # the shared /mnt/models HF cache is what lets SGLang pick up the same
  # patched chat_template.jinja snapshots the vLLM backends use.
  SGLANG_PREFIX: >-
    docker run --init --rm --gpus all --ipc host
    --shm-size=16g --ulimit memlock=-1 --ulimit stack=67108864
    --network llama-swap-vllm-backend
    --env HF_TOKEN --env HF_HOME=/models/huggingface
    --env SAFETENSORS_FAST_GPU=1
    --volume /mnt/models:/models
    --label io.mspiegel.llama-swap.managed=true
    --label io.mspiegel.llama-swap.model=${MODEL_ID}
  # ── vLLM engine flags ──────────────────────────────────────────
  # Docs: https://docs.vllm.ai/en/stable/configuration/engine_args/
  #
  # --max-num-seqs: max concurrent sequences. vLLM default = 1024 (≥70GB GPU).
  #   Co-residency on 72GB: at 0.40 util, ~241 linear-attention blocks available
  #   for hybrid SSM models → 128 is a safe shared cap. Solo models can go higher.
  #   Override per-model by setting MAX_NUM_SEQS in the model's macros.
  MAX_NUM_SEQS: "128"
  VLLM_COMMON: "--model ${checkpoint} --served-model-name ${MODEL_ID} --enable-prefix-caching --max-num-seqs ${MAX_NUM_SEQS}"
  QWEN38_COMMON: "--reasoning-parser qwen3 --tool-call-parser qwen3_xml --enable-auto-tool-choice --performance-mode throughput"

models:
  "muse-glimmer-30b":
    name: Muse Glimmer 30B NVFP4
    description: Muse Glimmer 30B with auto-fit context (native 131,072 when served alone)
    capabilities:
      in: ["text", "image"]
      out: ["text"]
      tools: true
      context: 262144
    metadata:
      reasoning: true
      thinking: true
      vision: true
      reasoning_effort: [low, medium, high, xhigh]
    macros:
      VLLM_IMAGE: "vllm/vllm-openai:muse-glimmer@sha256:413c8fbecb1204a218117c77a4ea4b3a211d5686ff99c31d82ba6dd0cec8c5a6"
      checkpoint: "Inferact/Muse-Glimmer-30B-NVFP4-W4A4"
      # DFlash spec decode needs lower --max-num-seqs: the global 128 produces
      # a negative token budget (-6144) with the draft head. 64 + explicit
      # --max-num-batched-tokens 16384 avoids the crash (recipes#782).
      MAX_NUM_SEQS: "64"
    proxy: http://vllm-muse-glimmer:8000
    cmd: >-
      ${DOCKER_PREFIX}
      --name vllm-muse-glimmer
      ${VLLM_IMAGE}
      ${VLLM_COMMON}
      --max-model-len auto
      --gpu-memory-utilization 0.4
      --kv-cache-dtype fp8
      --reasoning-parser muse_glimmer
      --tool-call-parser muse_glimmer
      --enable-auto-tool-choice
      --speculative-config '{"method":"dflash","model":"meta-models/Muse-Glimmer-30B-assistant","num_speculative_tokens":15}'
    cmdStop: docker stop --time 90 vllm-muse-glimmer

