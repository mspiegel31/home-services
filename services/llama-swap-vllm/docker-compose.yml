# llama-swap vLLM router for RTX PRO 5000 Blackwell 72GB.
#
# Router runs in a derived image (unified-cuda + docker.io CLI) so it can
# spawn vLLM backend containers through the Docker socket. The base image
# bundles vllm-wrapper (vLLM sleep/wake) and nvidia-smi for GPU stats.
#
# The base tag `unified-cuda` is a moving nightly from llama-swap main HEAD.
# Rebuilding the derived image via CI picks up base updates; with
# `pull_policy: always` Portainer re-pulls the derived image on deploy.
#
# git-sync sparsely checks out this stack's directory into a named volume. The
# router reads config.yaml at startup. --watch-config is intentionally omitted;
# configuration activation happens through a deliberate restart or redeploy.
#
# Portainer CE stack: repo https://github.com/mspiegel31/home-services.git,
# ref main, path services/llama-swap-vllm/docker-compose.yml, poll 5 min,
# re-pull image on, force redeployment off.

configs:
  git_sync_sparse_checkout:
    content: |
      /*
      !/*/
      /services/
      !/services/*/
      /services/llama-swap-vllm/


name: llama-swap-vllm

volumes:
  llama-swap-config:

networks:
  backend:
    name: llama-swap-vllm-backend

services:
  git-sync:
    container_name: llama-swap-vllm-git-sync
    image: registry.k8s.io/git-sync/git-sync:v4.4.2@sha256:3089d9787b89bdc5af01d9f6e8d515aefb9672e8aea3972d7ff67478112bacb3
    restart: unless-stopped
    user: "0:0"
    command:
      - git-sync
      - --repo=https://github.com/mspiegel31/home-services.git
      - --ref=main
      - --root=/git
      - --link=current
      - --depth=1
      - --submodules=off
      - --sparse-checkout-file=/etc/git-sync/sparse-checkout
      - --period=30s
      - --http-bind=:1234
    configs:
      - source: git_sync_sparse_checkout
        target: /etc/git-sync/sparse-checkout
    volumes:
      - llama-swap-config:/git
    healthcheck:
      test: ["CMD-SHELL", "test -f /git/current/services/llama-swap-vllm/config.yaml && curl -fsS http://127.0.0.1:1234/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 15s


  llama-swap:
    container_name: llama-swap-vllm
    image: ghcr.io/mspiegel31/llama-swap-vllm:latest
    pull_policy: always
    restart: unless-stopped
    ports:
      - "11437:8080"
    networks:
      - backend
    # GPU device so in-container nvidia-smi works for /metrics; no VRAM is
    # allocated unless a CUDA context is created (the router never does).
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    stop_grace_period: 2m
    environment:
      - LLAMA_SWAP_API_KEY=${LLAMA_SWAP_API_KEY:?Set LLAMA_SWAP_API_KEY in Portainer}
      - HF_TOKEN=${HF_TOKEN:?Set HF_TOKEN in Portainer}
    command: ["--config", "/config/current/services/llama-swap-vllm/config.yaml", "--listen", "0.0.0.0:8080"]
    volumes:
      - llama-swap-config:/config:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      git-sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
