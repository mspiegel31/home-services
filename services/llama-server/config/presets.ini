# Qwen holds an explicit 256K target so --fit can spill MoE experts after
# context selection. Its KV remains on GPU by default for fast attention.
version = 1

[Qwen3.6-35B-A3B-UD-Q4_K_XL]
ctx-size = 256000

# The 12B dense models need system-RAM KV to avoid the 8GB-card context floor.
[gemma-4-12B-it-qat-UD-Q4_K_XL]
no-kv-offload = true

[gemma-4-12b-it-Q4_K_M]
no-kv-offload = true
