# Qwen holds an explicit 256K target so --fit can spill MoE experts after
# context selection. It inherits the conservative system-RAM KV default.
#
# The two E4B Gemmas are the deliberate small-model exceptions: their KV cache
# lives in VRAM for faster attention. Their context remains unset so --fit can
# choose the largest GPU-safe value while retaining the global 1 GiB margin.
version = 1

[Qwen3.6-35B-A3B-UD-Q4_K_XL]
ctx-size = 256000

[gemma-4-E4B-it-UD-Q4_K_XL]
kv-offload = true

[gemma-4-E4B-it-qat-UD-Q4_K_XL]
kv-offload = true
