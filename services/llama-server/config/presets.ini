# llama.cpp router per-model preset config
# Loaded via `--models-preset`. Requires a llama.cpp build AFTER 2025-12-15
# (PR #17859). Verify with: docker exec llama-server llama-server --help | grep models-preset
#
# Precedence (highest wins): CLI args > [model] section > [*] global section.
# Section names MUST exactly match the GGUF filename minus ".gguf" as it
# appears in /mnt/models/llama-server/. Keys are CLI long-arg names without
# the leading dashes (e.g. `ctx-size` == --ctx-size).
#
# Args that are TRULY global live in docker-compose.yml `environment:` as
# LLAMA_ARG_* (flash-attn, cache-type, batch sizes, threads).
# Only args that DIFFER per model belong here: ctx-size and KV/expert
# placement, which depend on whether the model fits in 8GB VRAM.
#
# KV placement polarity (verified against common/arg.cpp):
#   omit key            -> KV on GPU (default; fastest — use when model fits)
#   no-kv-offload = true -> KV in system RAM (frees VRAM; ~30-50% slower via PCIe)

version = 1

# ── Global defaults for every model the router loads ──
# Intentionally minimal: the compose environment already sets the shared
# LLAMA_ARG_* defaults. Per-model sections below override only where models
# genuinely differ (context size, MoE offload).
[*]

# ── Gemma 4 E4B (dense, hybrid sliding-window attention) ──
# Weights (~4.77GB) fit fully on the 8GB card, so KV stays on GPU (omit
# no-kv-offload) — this is the fast path and the fix for the slow TTFT/tok-s.
# SWA (5:1 SWA:global, 512-tok window) keeps real KV at ~2-4GB even at 128K,
# so full context is affordable on-GPU with weights still resident. The prior
# slowness was the global no-kv-offload forcing KV to system RAM, NOT the
# context size — so we keep the full 128K.
[gemma-4-E4B-it-UD-Q4_K_XL]
ctx-size = 131072

# ── Gemma 4 26B-A4B (MoE, 4B active, hybrid sliding-window attention) ──
# 26B total weights do NOT fit 8GB, so offload MoE experts to CPU (cpu-moe).
# Gemma 4's SWA keeps KV cheap even at 128K, so full context stays affordable.
# KV placement: experts already spill to CPU, but the attention KV itself can
# stay on GPU — SWA makes it small (~2-4GB). Leave KV on GPU (omit no-kv-offload)
# for faster attention; flip `no-kv-offload = true` only if you hit OOM at 128K.
[gemma-4-26B-A4B-it-UD-Q4_K_XL]
ctx-size = 131072
cpu-moe  = true

# ── Qwen3.6-35B-A3B (MoE, NO sliding-window attention) ──
# No SWA means KV grows linearly with context — 128K here was the likely TTFT
# killer flagged in analysis. Cut context hard and offload ALL expert tensors
# to CPU. `cpu-moe = true` is the boolean form (all layers); use
# `n-cpu-moe = N` instead if you want only the first N layers on CPU.
# KV: with experts on CPU and only 16K context, KV is tiny — keep it on GPU
# (omit no-kv-offload) so the little KV traffic there is stays fast.
[Qwen3.6-35B-A3B-UD-Q4_K_M]
ctx-size = 16384
cpu-moe  = true