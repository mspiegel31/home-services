# llama.cpp router for Proxmox VM 600 (RTX 2070 SUPER, 8GB VRAM, 48GB RAM).
#
# Context stays unset: llama.cpp reads each GGUF's training limit, then --fit
# reduces it only when the available GPU or system memory cannot sustain it.
# Never set LLAMA_ARG_CTX_SIZE=0 here: an explicit zero requests the full
# training context and disables --fit's context reduction.
#
# KV lives in system RAM so dense 12B models retain long agent contexts instead
# of being reduced to the 4K --fit floor. This is slower than GPU KV but makes
# long-context operation reliable across arbitrary downloaded GGUFs.

x-networks: &default-networks
  networks:
    - llama-server

services:
  llama-server:
    <<: *default-networks
    container_name: llama-server
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    ports:
      - "11435:8080"
    environment:
      # Leave placement and context sizing adaptive for every current and future GGUF.
      - LLAMA_ARG_FIT=on
      # Reserve 1 GiB for transient CUDA allocations instead of loading at the OOM edge.
      - LLAMA_ARG_FIT_TARGET=1024
      # Reject a model that cannot sustain at least a minimally useful agent context.
      - LLAMA_ARG_FIT_CTX=4096
      # Keep the large attention history in 48GB system RAM, not scarce 8GB VRAM.
      - LLAMA_ARG_KV_OFFLOAD=false

      # Quantized KV cache depends on Flash Attention; it also accelerates long attention passes.
      - LLAMA_ARG_FLASH_ATTN=1
      # Four-bit keys double history capacity relative to q8_0 at a small cache-quality cost.
      - LLAMA_ARG_CACHE_TYPE_K=q4_0
      # Four-bit values provide the matching memory reduction for the other half of the cache.
      - LLAMA_ARG_CACHE_TYPE_V=q4_0
      # A shared cache arena avoids reserving a fixed partition for every request slot.
      - LLAMA_ARG_KV_UNIFIED=true
      # A 2048-token logical batch keeps large prompt prefills efficient.
      - LLAMA_ARG_BATCH_SIZE=2048
      # A 512-token physical batch limits CUDA scratch-memory spikes on the 8GB card.
      - LLAMA_ARG_UBATCH_SIZE=512
      # Twelve CPU threads handle RAM-resident cache traffic and CPU-offloaded tensors.
      - LLAMA_ARG_THREADS=12
      # The embedded GGUF template preserves each model's role and tool-call formatting.
      - LLAMA_ARG_JINJA=true

      # Two model weight sets do not safely coexist in the available VRAM.
      - LLAMA_ARG_MODELS_MAX=1
      # Give a single agent session the full fitted context instead of splitting it across clients.
      - LLAMA_ARG_N_PARALLEL=1
      # Accept LAN traffic through the published Docker port.
      - LLAMA_ARG_HOST=0.0.0.0
    command: --models-dir /models
    volumes:
      - /mnt/models/llama-server:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  llama-server:
