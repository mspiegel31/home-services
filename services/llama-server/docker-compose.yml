# llama.cpp router for Proxmox VM 600 (RTX 2070 SUPER, 8GB VRAM, 48GB RAM).
#
# Context stays unset: llama.cpp reads each GGUF's training limit, then --fit
# reduces it only when the available GPU or system memory cannot sustain it.
# Never set LLAMA_ARG_CTX_SIZE=0 here: an explicit zero requests the full
# training context and disables --fit's context reduction.
#
# KV lives in system RAM so dense 12B models retain long agent contexts instead
# of being reduced to the 4K --fit floor. This is slower than GPU KV but makes
# long-context operation reliable across arbitrary downloaded GGUFs.

x-networks: &default-networks
  networks:
    - llama-server

services:
  llama-server:
    <<: *default-networks
    container_name: llama-server
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    restart: unless-stopped
    ports:
      - "11435:8080"
    environment:
      # --fit adjusts only unset values. Preserve a 1 GiB VRAM margin for
      # transient CUDA allocations instead of risking successful-load OOMs.
      - LLAMA_ARG_FIT=on
      - LLAMA_ARG_FIT_TARGET=1024
      - LLAMA_ARG_FIT_CTX=4096
      - LLAMA_ARG_KV_OFFLOAD=false

      # q8_0 is the quality-preserving KV tradeoff for long system-RAM caches.
      - LLAMA_ARG_FLASH_ATTN=1
      - LLAMA_ARG_CACHE_TYPE_K=q8_0
      - LLAMA_ARG_CACHE_TYPE_V=q8_0
      - LLAMA_ARG_BATCH_SIZE=2048
      - LLAMA_ARG_UBATCH_SIZE=512
      - LLAMA_ARG_THREADS=12
      - LLAMA_ARG_JINJA=true

      # One loaded model and one slot reserve all fitted context for one agent.
      - LLAMA_ARG_MODELS_MAX=1
      - LLAMA_ARG_N_PARALLEL=1
      - LLAMA_ARG_HOST=0.0.0.0
    command: --models-dir /models
    volumes:
      - /mnt/models/llama-server:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  llama-server:
