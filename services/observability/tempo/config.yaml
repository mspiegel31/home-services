server:
  http_listen_port: 3200
  grpc_listen_port: 9095

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: "0.0.0.0:4317"
        http:
          endpoint: "0.0.0.0:4318"

ingester:
  trace_idle_period: 10s
  max_block_duration: 1h

compactor:
  compaction:
    block_retention: 168h
    compacted_block_retention: 1h

metrics_generator:
  registry:
    collection_interval: 15s
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: "http://victoriametrics:8428/api/v1/write"
        send_exemplars: false

# tempo 2.9: processors live in overrides, flat key (generator.Config has no
# processors field); dashed names, the plan's underscore form is invalid.
# local-blocks is mandatory for Grafana Traces Drilldown's TraceQL metrics
# (span rate/duration/error ratio); without it the panel fails with
# "localblocks processor not found".
overrides:
  metrics_generator_processors: [local-blocks, service-graphs, span-metrics]

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/traces
    wal:
      path: /var/tempo/wal
