auth_enabled: false

server:
  http_listen_port: 3100
  grpc_listen_port: 9096

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory
  storage:
    filesystem:
      chunks_directory: /loki/chunks
      rules_directory: /loki/rules

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  # 30d retention
  retention_period: 720h
  retention_stream:
    - selector: '{job="vllm"}'
      priority: 1
      # Omitted period parses as 0s and loki 3.4 fails validation at boot
      # (each stream's retention must be >= 24h); pin it to the global 30d.
      period: 720h

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
