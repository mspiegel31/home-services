services:
  git-sync:
    container_name: frigate-git-sync
    image: registry.k8s.io/git-sync/git-sync:v4.4.2
    restart: unless-stopped
    command: [
      "git-sync",
      "--repo=https://github.com/mspiegel31/home-services.git",
      "--ref=main",
      "--root=/git",
      "--link=current",
      "--period=2s",
      "--username=mspiegel31",
      "--add-user",
      "--http-bind=:1234",
      ]
    environment:
      - GITSYNC_PASSWORD=${GITSYNC_PASSWORD}
    volumes:
      - /opt/home-services:/git
    user: "1000:1000"
    healthcheck:
      test: ["CMD-SHELL", "test -f /git/current/services/frigate/config/config.yml && curl -f http://localhost:1234/ || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 10s

  config-renderer:
    container_name: frigate-config-renderer
    image: alpine:latest
    restart: unless-stopped
    command: ["sh", "/git/current/services/frigate/render-config.sh"]
    volumes:
      - /opt/home-services:/git:ro
      - /home/cloud/frigate/config:/config
    environment:
      - FRIGATE_MQTT_USER=${FRIGATE_MQTT_USER}
      - FRIGATE_MQTT_PASSWORD=${FRIGATE_MQTT_PASSWORD}
      - FRIGATE_GENAI_API_KEY=${FRIGATE_GENAI_API_KEY}
    depends_on:
      git-sync:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "test -f /config/config.yml"]
      interval: 5s
      timeout: 3s
      retries: 3
      start_period: 60s


  scrypted:
    container_name: scrypted
    restart: unless-stopped
    network_mode: host
    # privileged: true
    image: ghcr.io/koush/scrypted
    volumes:
      # Uncomment the following lines to use Avahi daemon from the host.
      # Ensure Avahi is running on the host machine:
      # It can be installed with: sudo apt-get install avahi-daemon
      # This is not compatible with running avahi inside the container (see above).
      # Also, uncomment the lines under security_opt
      # - /var/run/dbus:/var/run/dbus
      # - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket

      # Default volume for the Scrypted database. Typically should not be changed.
      - /mnt/tank/container-configs/scrypted:/server/volume
    devices: [
      # uncomment the common systems devices to pass
      # them through to docker.

      # all usb devices, such as coral tpu
      # "/dev/bus/usb:/dev/bus/usb",

      # hardware accelerated video decoding, opencl, etc.
      "/dev/dri:/dev/dri",

      # AMD GPU
      # "/dev/kfd:/dev/kfd",

      # uncomment below as necessary.
      # zwave usb serial device

      # "/dev/ttyACM0:/dev/ttyACM0",

      # coral PCI devices
      # "/dev/apex_0:/dev/apex_0",
      # "/dev/apex_1:/dev/apex_1",
    ]


  frigate:
    container_name: frigate
    privileged: true # this may not be necessary for all setups
    restart: unless-stopped
    image: ghcr.io/blakeblackshear/frigate:stable
    shm_size: "256mb" # update for your cameras based on calculation above
    devices:
      - /dev/bus/usb:/dev/bus/usb # Passes the USB Coral, needs to be modified for other versions
      - /dev/dri/renderD128:/dev/dri/renderD128 # For intel hwaccel, needs to be updated for your hardware
    volumes:
      - /etc/localtime:/etc/localtime:ro
      - /home/cloud/frigate/config:/config
      - /mnt/large/frigate:/media/frigate
      - type: tmpfs # Optional: 1GB of memory, reduces SSD/SD Card wear
        target: /tmp/cache
        tmpfs:
          size: 1000000000
    ports:
      - "8971:8971"
      - "5000:5000" # Internal unauthenticated access. Expose carefully.
      - "8554:8554" # RTSP feeds
      - "8555:8555/tcp" # WebRTC over tcp
      - "8555:8555/udp" # WebRTC over udp
    environment:
      FRIGATE_RTSP_PASSWORD: "${FRIGATE_RTSP_PASSWORD}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL}"
    depends_on:
      config-renderer:
        condition: service_healthy
