name: omni-provider

# Proxmox infrastructure provider for Omni — TrueNAS SCALE host, Portainer CE
# edge stack. Deploying this stack IS the opt-in gate: while it is undeployed
# nothing can mutate Proxmox. It is deliberately a separate stack from
# `omni-mgmt`: enabling a compose profile would require rewriting that stack's
# environment through the API, which cannot round-trip the redacted secrets.
# Procedure: home-prod/docs/management-stack.md → Provider enablement gate.
#
# No env_file (Portainer CE rule): every ${VAR} is declared below and set in
# Portainer's UI. PROVIDER_KEY is the Omni infra-provider key; the operator
# pastes it once from the host file below — never into Git or chat.

services:
  omni-infra-provider-proxmox:
    container_name: omni-infra-provider-proxmox
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.3.0
    # Host network: reaches Omni's loopback API listener on the same host.
    network_mode: host
    environment:
      # Omni's same-host loopback API listener; browser traffic still uses HTTPS.
      OMNI_ENDPOINT: http://127.0.0.1:8443
      # Infra-provider key (not an Omni service account key). Fail-fast: this
      # stack exists only to run the provider, so a missing key must be loud.
      OMNI_SERVICE_ACCOUNT_KEY: ${PROVIDER_KEY:?Set PROVIDER_KEY in Portainer}
      # Proxmox API TLS verifies against this bundle (public roots + the PVE
      # CA). `insecureSkipVerify` is not used.
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.pem
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      # Holds the least-privilege Proxmox API token, outside Git.
      - /mnt/tank/container-configs/omni-provider/config.yaml:/etc/provider/config.yaml:ro
      - /mnt/tank/container-configs/omni-provider/ca-bundle.pem:/etc/ssl/certs/ca-bundle.pem:ro
    command:
      - --config-file
      - /etc/provider/config.yaml
      - --id
      - proxmox-pve-data
    restart: unless-stopped

  # Second Proxmox host: the standalone pve-small node (192.168.1.42).
  # Distinct provider id, so Omni routes only the machine requests whose
  # MachineClass names proxmox-pve-small here; the pve-data provider keeps
  # serving the requests it already owns.
  omni-infra-provider-proxmox-small:
    container_name: omni-infra-provider-proxmox-small
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.3.0
    # Host network: reaches Omni's loopback API listener on the same host.
    network_mode: host
    environment:
      OMNI_ENDPOINT: http://127.0.0.1:8443
      OMNI_SERVICE_ACCOUNT_KEY: ${PROVIDER_KEY_SMALL:?Set PROVIDER_KEY_SMALL in Portainer}
      # Separate bundle: pve-small has its own PVE Cluster Manager CA.
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.pem
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      - /mnt/tank/container-configs/omni-provider-small/config.yaml:/etc/provider/config.yaml:ro
      - /mnt/tank/container-configs/omni-provider-small/ca-bundle.pem:/etc/ssl/certs/ca-bundle.pem:ro
    command:
      - --config-file
      - /etc/provider/config.yaml
      - --id
      - proxmox-pve-small
    restart: unless-stopped

  # Third Proxmox host: the standalone pve-cp node (192.168.1.46, PVE node
  # name `pve`). Same single-provider-per-endpoint constraint as pve-small;
  # see home-prod/docs/management-stack.md §Second Proxmox host.
  omni-infra-provider-proxmox-cp:
    container_name: omni-infra-provider-proxmox-cp
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.3.0
    network_mode: host
    environment:
      OMNI_ENDPOINT: http://127.0.0.1:8443
      OMNI_SERVICE_ACCOUNT_KEY: ${PROVIDER_KEY_CP:?Set PROVIDER_KEY_CP in Portainer}
      # pve-cp has its own standalone PVE Cluster Manager CA.
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.pem
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      - /mnt/tank/container-configs/omni-provider-cp/config.yaml:/etc/provider/config.yaml:ro
      - /mnt/tank/container-configs/omni-provider-cp/ca-bundle.pem:/etc/ssl/certs/ca-bundle.pem:ro
    command:
      - --config-file
      - /etc/provider/config.yaml
      - --id
      - proxmox-pve-cp
    restart: unless-stopped

  # Fourth Proxmox host: the standalone pve-ai node (RTX PRO 5000 LLM
  # worker). Same single-provider-per-endpoint constraint; MachineClass
  # home-gpu-worker references this exact id.
  # Ordering hazard (docs/management-stack.md): set PROVIDER_KEY_AI in the
  # Portainer stack env BEFORE this change is pushed — interpolation is
  # all-or-nothing and an unset key takes the other providers down.
  omni-infra-provider-proxmox-ai:
    container_name: omni-infra-provider-proxmox-ai
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.3.0
    network_mode: host
    environment:
      OMNI_ENDPOINT: http://127.0.0.1:8443
      OMNI_SERVICE_ACCOUNT_KEY: ${PROVIDER_KEY_AI:?Set PROVIDER_KEY_AI in Portainer}
      # pve-ai has its own standalone PVE Cluster Manager CA.
      SSL_CERT_FILE: /etc/ssl/certs/ca-bundle.pem
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      - /mnt/tank/container-configs/omni-provider-ai/config.yaml:/etc/provider/config.yaml:ro
      - /mnt/tank/container-configs/omni-provider-ai/ca-bundle.pem:/etc/ssl/certs/ca-bundle.pem:ro
    command:
      - --config-file
      - /etc/provider/config.yaml
      - --id
      - proxmox-pve-ai
    restart: unless-stopped
