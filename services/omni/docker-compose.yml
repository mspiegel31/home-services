name: omni-mgmt

# Outside-cluster management stack — TrueNAS SCALE variant.
#
# Omni, the Omni-only Pocket ID instance, a stock-Traefik management reverse
# proxy, the outside-cluster availability monitor, and the opt-in Proxmox
# infrastructure provider.
#
# Browser-facing endpoints use PUBLIC HOSTNAMES under one management subzone
# and Let's Encrypt certificates obtained with the ACME DNS-01 challenge via
# Cloudflare. That choice is deliberate and load-bearing:
#   - WebAuthn requires the RP ID to be a domain name. An https://<ip> origin
#     can never enrol a passkey — the browser rejects it with
#     `SecurityError: This is an invalid domain` before touching an
#     authenticator.
#   - A private CA means every client needs a trust import, and Firefox
#     blocks WebAuthn outright on origins reached through a certificate
#     exception. A publicly trusted chain removes both problems.
#   - DNS-01 validates by TXT record, so the names may resolve to a private
#     LAN address and nothing has to be reachable from the internet.
# The management subzone is separate from the application namespace so it
# cannot collide with the public proxy records already in that zone.
#
# Portainer CE edge stack: no env_file by design. Every ${VAR} is declared
# explicitly below; set values in the Portainer edge-stack UI. Required
# values use the fail-fast `${VAR:?message}` form so a missing value fails
# loudly instead of resolving to an empty string. Secrets are never stored
# in this file. The variable table lives in
# `.agents/skills/omni-management-stack/SKILL.md`.
#
# Only one LAN-facing port: TrueNAS owns 80/443 for its own UI, so Traefik
# terminates TLS on 9443. Everything else is routed by Host header on that
# single entrypoint, so no per-service host ports exist (the previous
# four-entrypoint scheme existed only because IP-only routing needs one port
# per service).
#
# The Traefik dynamic route config is a Go template delivered by the
# git-sync sidecar into a shared volume, because Portainer CE drops compose
# `configs:` and does not resolve relative bind-mount paths. Same pattern as
# the hermes and glance stacks on this host.
#
# Topology (loopback-minimal, source-verified against Omni v1.12.2):
#   - Traefik: host network; binds 192.168.1.39:9443 (TLS, ACME DNS-01).
#     Reaches every backend over 127.0.0.1. All static configuration is
#     CLI flags (single source of truth); no entrypoint script, no dashboard,
#     no access log, no labels provider, no Docker socket.
#   - Omni: host network; API 127.0.0.1:8443 (cleartext h2c), k8s-proxy
#     127.0.0.1:8095 (TLS, internal CA), machine API 0.0.0.0:8090 (LAN/VPN
#     direct for Talos nodes). No private API is bound to 0.0.0.0 except the
#     machine API and SideroLink.
#   - Pocket ID / Uptime Kuma: bridge, published to host loopback only.
#   - Provider: host network (opt-in profile), reaches the loopback Omni API.
#
# Durable state lives under /mnt/tank/container-configs/omni-mgmt/ (repo
# convention for services on this host) so it is covered by the existing ZFS
# snapshot and backup policy.

networks:
  omni-mgmt:
    driver: bridge

services:
  git-sync:
    # Delivers the templated Traefik dynamic route config into the shared
    # volume. The repository is public, so no credentials are involved.
    # There is no sparse-checkout file: compose `configs:` is dropped by
    # Portainer, so a full --depth=1 checkout is used instead.
    container_name: omni-mgmt-git-sync
    image: registry.k8s.io/git-sync/git-sync:v4.4.2@sha256:3089d9787b89bdc5af01d9f6e8d515aefb9672e8aea3972d7ff67478112bacb3
    restart: unless-stopped
    user: "0:0"
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - git-sync
      - --repo=https://github.com/mspiegel31/home-services.git
      - --ref=${OMNI_CONFIG_REF:?Set OMNI_CONFIG_REF in Portainer}
      - --root=/git
      - --link=current
      - --depth=1
      - --submodules=off
      - --period=30s
      - --http-bind=:1234
    volumes:
      - /mnt/tank/container-configs/omni-mgmt/git:/git
    healthcheck:
      # The route config must exist before Traefik starts: the file provider
      # loads it once at startup (watch=false), so a missing file means no
      # routes at all. curl is present in this image.
      test:
        - CMD-SHELL
        - test -f /git/current/services/omni/traefik/dynamic.yaml && curl -fsS http://127.0.0.1:1234/ >/dev/null
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  omni:
    # Self-hosted Omni, single host-container model
    # (docs.siderolabs.com/omni/self-hosted/run-omni-on-prem). Listener binds
    # live in the operator-protected omni-config.yaml, not here.
    #
    # SideroLink always creates a WireGuard device and there is no config
    # option to skip it. Omni v1.12.2 uses ONLY userspace wireguard-go:
    # its siderolink manager always passes a non-nil Bind and a non-empty
    # InputPacketFilters, and siderolabs/siderolink forces userspace whenever
    # either is set (`ForceUserspace = ForceUserspace || Bind != nil ||
    # InputPacketFilters != nil`). The native kernel-wg branch is therefore
    # unreachable and /dev/net/tun is mandatory. On this host that is a
    # non-issue: TrueNAS is not an unprivileged container, so the node
    # exists natively.
    container_name: omni
    image: ghcr.io/siderolabs/omni:v1.12.2
    network_mode: host
    init: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      # Embedded etcd + sqlite (durable, backed up per docs/management-stack.md)
      # and the reviewed config: omni-config.yaml, the omni.asc etcd GPG key,
      # the internal TLS certs for the k8s-proxy listener, and the internal CA.
      - /mnt/tank/container-configs/omni-mgmt/omni:/var/lib/omni
      - /mnt/tank/container-configs/omni-mgmt/omni-config:/etc/omni:ro
    command: --config-path=/etc/omni/omni-config.yaml
    restart: unless-stopped

  pocket-id:
    # Omni-only identity: separate issuer hostname, database, encryption key,
    # clients and passkey enrolment from any household instance. Published to
    # host loopback only; Traefik reaches it there. Never exposed on the LAN.
    #
    # Image contract verified against v2.16.0 source and image:
    #   env   APP_URL (advertised issuer), ENCRYPTION_KEY_FILE (>=16 bytes),
    #         TRUST_PROXY, UI_CONFIG_DISABLED, ANALYTICS_DISABLED,
    #         VERSION_CHECK_DISABLED, PUID/PGID (entrypoint chowns /app/data)
    #   state /app/data           (SQLite DB + uploads)
    #   port  1411/tcp
    #   healthcheck is supplied by the image (no override needed here)
    # v2 renamed these from the v0.53.x names (PUBLIC_APP_URL, ...), so do not
    # copy environment from the older IP-only stack.
    container_name: omni-pocket-id
    image: ghcr.io/pocket-id/pocket-id:v2.16.0
    environment:
      APP_URL: ${POCKET_ID_URL:?Set POCKET_ID_URL in Portainer}
      # Secrets at rest are encrypted with this key. Read from a file so the
      # value never appears in argv, inspect output or this repository.
      ENCRYPTION_KEY_FILE: /etc/pocket-id/encryption.key
      # Only Traefik reaches this container, from the host loopback.
      TRUST_PROXY: "true"
      UI_CONFIG_DISABLED: "true"
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      PUID: ${PUID:?Set PUID in Portainer}
      PGID: ${PGID:?Set PGID in Portainer}
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      - /mnt/tank/container-configs/omni-mgmt/pocket-id:/app/data
      - /mnt/tank/container-configs/omni-mgmt/pocket-id-key/encryption.key:/etc/pocket-id/encryption.key:ro
    ports:
      - "127.0.0.1:1411:1411"
    networks:
      - omni-mgmt
    restart: unless-stopped

  traefik:
    # Management reverse proxy. Terminates the public DNS-01 certificates for
    # the management hostnames and routes to Pocket ID + monitor over host
    # loopback and to Omni (API h2c; k8s-proxy TLS with the internal CA
    # trusted).
    #
    # All static configuration is CLI flags. The dynamic route config is read
    # from the git-sync volume and rendered as a native Go template by the
    # file provider, so the hostnames are substituted from the environment
    # below without an entrypoint script.
    container_name: omni-mgmt-traefik
    image: traefik:v3.7.6@sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
    network_mode: host
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      # The only listener. 443 is unavailable: TrueNAS serves its own UI there.
      - "--entrypoints.websecure.address=192.168.1.39:9443"
      # Dynamic routes from the git-sync volume; the file provider renders the
      # Go template at load time. watch=false: activating a config change is a
      # deliberate restart.
      - "--providers.file.filename=/config/current/services/omni/traefik/dynamic.yaml"
      - "--providers.file.watch=false"
      # ACME: public certificates via the Cloudflare DNS provider bundled in
      # the pinned image (lego). DNS-01 is required for the wildcard and needs
      # no inbound reachability.
      - "--certificatesresolvers.mgmt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in Portainer}"
      - "--certificatesresolvers.mgmt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.mgmt.acme.dnschallenge.provider=cloudflare"
      # Telemetry off; anonymous usage off.
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--log.level=INFO"
    environment:
      # Scoped Cloudflare API token with Zone:DNS:Edit for the management
      # zone only — never a Global API Key. Set in the Portainer UI.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?Set CF_DNS_API_TOKEN in Portainer}
      # Site hostnames and the subzone, rendered into the route config by the
      # file provider's Go-template support. The wildcard certificate is
      # derived from MGMT_DOMAIN.
      MGMT_DOMAIN: ${MGMT_DOMAIN:?Set MGMT_DOMAIN in Portainer}
      OMNI_HOSTNAME: ${OMNI_HOSTNAME:?Set OMNI_HOSTNAME in Portainer}
      OMNI_K8S_HOSTNAME: ${OMNI_K8S_HOSTNAME:?Set OMNI_K8S_HOSTNAME in Portainer}
      POCKET_ID_HOSTNAME: ${POCKET_ID_HOSTNAME:?Set POCKET_ID_HOSTNAME in Portainer}
      MONITOR_HOSTNAME: ${MONITOR_HOSTNAME:?Set MONITOR_HOSTNAME in Portainer}
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      # ACME account key and issued certificates. Durable: losing it means
      # re-issuing on every restart and risking the ACME rate limits.
      - /mnt/tank/container-configs/omni-mgmt/acme:/data
      # Templated route config delivered by git-sync.
      - /mnt/tank/container-configs/omni-mgmt/git:/config:ro
      # CA for the Traefik -> Omni k8s-proxy hop (serversTransport.rootCAs).
      # Internal CA, machine-facing only: nothing a browser ever sees.
      - /mnt/tank/container-configs/omni-mgmt/omni-k8s-ca/ca.crt:/etc/traefik/certs/omni-k8s-ca.crt:ro
    depends_on:
      # Routes are only live once git-sync has delivered the route config.
      git-sync:
        condition: service_healthy
      # The proxy must not start before its identity backend is ready.
      pocket-id:
        condition: service_healthy
    restart: unless-stopped

  uptime-kuma:
    # Outside-cluster availability monitor with durable state. Published to
    # host loopback only; Traefik routes monitor.<subzone> to 127.0.0.1:3001.
    # SMTP is configured in the UI (the pinned release reads no SMTP_* env).
    container_name: omni-mgmt-kuma
    image: ghcr.io/louislam/uptime-kuma:2.5.5
    environment:
      TZ: ${TZ:?Set TZ in Portainer}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - /mnt/tank/container-configs/omni-mgmt/kuma:/app/data
    networks:
      - omni-mgmt
    restart: unless-stopped

  omni-infra-provider-proxmox:
    # Official Proxmox infra provider. Explicit opt-in gate: it only starts
    # with `--profile provider`, so a plain deployment can never mutate
    # Proxmox. Host network so it reaches the loopback-only Omni API.
    # Enablement procedure: home-prod/docs/management-stack.md.
    container_name: omni-infra-provider-proxmox
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.3.0
    profiles:
      - provider
    network_mode: host
    environment:
      # Flags read these env vars by default (cmd/main.go v0.3.0); the key
      # never appears in argv, logs or this file. Fixed loopback endpoint for
      # the same-host internal path; external clients still use HTTPS.
      OMNI_ENDPOINT: http://127.0.0.1:8443
      OMNI_SERVICE_ACCOUNT_KEY: ${PROVIDER_KEY:?Set PROVIDER_KEY in Portainer}
      # Proxmox API TLS is verified against this bundle (public roots + the
      # PVE CA). Self-signed PVE is not yet supported by this variant: the
      # bundle must exist.
      SSL_CERT_FILE: /etc/ssl/certs/pve-ca-bundle.pem
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      # config.yaml holds the least-privilege Proxmox token
      # (tokenID/tokenSecret), outside Git.
      - /mnt/tank/container-configs/omni-mgmt/provider:/etc/provider:ro
      - /mnt/tank/container-configs/omni-mgmt/pve-ca-bundle.pem:/etc/ssl/certs/pve-ca-bundle.pem:ro
    command: --config-file /etc/provider/config.yaml
    depends_on:
      - omni
    restart: unless-stopped
