name: omni-mgmt

# Outside-cluster management stack (Omni, Omni-only Pocket ID, stock Traefik,
# opt-in Proxmox provider, git-sync config sidecar) — TrueNAS SCALE host,
# Portainer CE edge stack. Rationale and procedure:
# home-prod/docs/management-stack.md.
# No env_file (Portainer CE rule): every ${VAR} is declared below and set in
# the edge-stack UI. Required values use fail-fast `${VAR:?…}` so a missing
# value fails the deploy loudly; values with a correct default use
# `${VAR:-…}`. Secrets are never stored in this file.

networks:
  omni-mgmt:
    driver: bridge

services:
  git-sync:
    # Portainer CE drops compose `configs:` and does not resolve relative
    # bind paths, so the Traefik dynamic route config
    # (services/omni/traefik/dynamic.yaml) is delivered to a shared volume
    # by git-sync. Public repo: anonymous HTTPS, no credentials.
    container_name: omni-mgmt-git-sync
    image: registry.k8s.io/git-sync/git-sync:v4.4.2@sha256:3089d9787b89bdc5af01d9f6e8d515aefb9672e8aea3972d7ff67478112bacb3
    restart: unless-stopped
    user: "0:0"
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - git-sync
      - --repo=https://github.com/mspiegel31/home-services.git
      # Set only to pin a branch or SHA. Case-sensitive (`MAIN` fails);
      # must equal the edge stack's Reference. Defaults to main.
      - --ref=${OMNI_CONFIG_REF:-main}
      - --root=/git
      - --link=current
      - --depth=1
      - --submodules=off
      - --period=30s
      - --http-bind=:1234
    volumes:
      - /mnt/tank/container-configs/omni-mgmt/git:/git
    healthcheck:
      # The file provider loads the route config once at startup
      # (watch=false): a missing file means Traefik has no routes at all.
      # curl is present in this image.
      test:
        - CMD-SHELL
        - test -f /git/current/services/omni/traefik/dynamic.yaml && curl -fsS http://127.0.0.1:1234/ >/dev/null
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s

  omni:
    # Self-hosted Omni, single host-container model
    # (docs.siderolabs.com/omni/self-hosted/run-omni-on-prem). Listener
    # binds live in the operator-protected omni-config.yaml, not here.
    # /dev/net/tun is mandatory (SideroLink userspace wireguard-go):
    # home-prod/docs/management-stack.md → Prerequisites.
    container_name: omni
    image: ghcr.io/siderolabs/omni:v1.12.2
    network_mode: host
    init: true
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      # Embedded etcd + sqlite, and the reviewed config (omni-config.yaml,
      # etcd GPG key, self-signed k8s-proxy TLS pair). Backup set:
      # home-prod/docs/management-stack.md → Backups and recovery.
      - /mnt/tank/container-configs/omni-mgmt/omni:/var/lib/omni
      - /mnt/tank/container-configs/omni-mgmt/omni-config:/etc/omni:ro
    command: --config-path=/etc/omni/omni-config.yaml
    restart: unless-stopped

  pocket-id:
    # Omni-only identity: separate issuer/DB/key/clients from any household
    # instance. Loopback-only; Traefik reaches it there.
    # v2 env names (APP_URL, …) — never copy environment from the v0.53.x
    # IP-only stack; the names were renamed in v2.
    container_name: omni-pocket-id
    image: ghcr.io/pocket-id/pocket-id:v2.16.0
    environment:
      APP_URL: ${POCKET_ID_URL:-https://pocket-id.${MGMT_DOMAIN}:9443}
      # Read from a file so the key never appears in argv or inspect output.
      ENCRYPTION_KEY_FILE: /etc/pocket-id/encryption.key
      TRUST_PROXY: "true"
      UI_CONFIG_DISABLED: "true"
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      - /mnt/tank/container-configs/omni-mgmt/pocket-id:/app/data
      - /mnt/tank/container-configs/omni-mgmt/pocket-id-key/encryption.key:/etc/pocket-id/encryption.key:ro
    ports:
      - "127.0.0.1:1411:1411"
    networks:
      - omni-mgmt
    restart: unless-stopped

  traefik:
    # Management reverse proxy: the single LAN-facing listener
    # 192.168.1.39:9443 (TrueNAS owns 80/443); everything else routes by
    # Host header. All static config is CLI flags; dynamic routes come from
    # the git-sync volume as a Go template (no entrypoint script).
    container_name: omni-mgmt-traefik
    image: traefik:v3.7.6@sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
    network_mode: host
    init: true
    security_opt:
      - no-new-privileges:true
    command:
      - "--entrypoints.websecure.address=192.168.1.39:9443"
      # watch=false: activating a route-config change is a deliberate restart.
      - "--providers.file.filename=/config/current/services/omni/traefik/dynamic.yaml"
      - "--providers.file.watch=false"
      - "--certificatesresolvers.mgmt.acme.email=${ACME_EMAIL:?Set ACME_EMAIL in Portainer}"
      - "--certificatesresolvers.mgmt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.mgmt.acme.dnschallenge.provider=cloudflare"
      # The LAN resolver intercepts port 53 and caches NXDOMAIN, so lego's
      # own propagation check can never see the TXT record: skip it.
      - "--certificatesresolvers.mgmt.acme.dnschallenge.propagation.disablechecks=true"
      # With checks off, wait this long after creating the TXT record so
      # Cloudflare's anycast fleet serves it before Let's Encrypt queries.
      - "--certificatesresolvers.mgmt.acme.dnschallenge.propagation.delayBeforeChecks=60s"
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--log.level=INFO"
    environment:
      # Scoped Cloudflare token, Zone:DNS:Edit for the management zone only
      # — never a Global API Key.
      CF_DNS_API_TOKEN: ${CF_DNS_API_TOKEN:?Set CF_DNS_API_TOKEN in Portainer}
      # Each hostname defaults to its well-known label under MGMT_DOMAIN;
      # override one only for a non-default layout.
      MGMT_DOMAIN: ${MGMT_DOMAIN:?Set MGMT_DOMAIN in Portainer}
      OMNI_HOSTNAME: ${OMNI_HOSTNAME:-omni.${MGMT_DOMAIN}}
      OMNI_K8S_HOSTNAME: ${OMNI_K8S_HOSTNAME:-omni-k8s.${MGMT_DOMAIN}}
      POCKET_ID_HOSTNAME: ${POCKET_ID_HOSTNAME:-pocket-id.${MGMT_DOMAIN}}
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      # ACME account key + certificates: losing it means re-issuing on every
      # restart and risking the ACME rate limits.
      - /mnt/tank/container-configs/omni-mgmt/acme:/data
      - /mnt/tank/container-configs/omni-mgmt/git:/config:ro
    depends_on:
      git-sync:
        condition: service_healthy
      pocket-id:
        condition: service_healthy
    restart: unless-stopped

  omni-infra-provider-proxmox:
    # Official Proxmox infra provider. Opt-in gate: starts only with
    # `--profile provider`, so a plain deployment can never mutate Proxmox.
    # Host network to reach the loopback Omni API. Enablement procedure:
    # home-prod/docs/management-stack.md → Provider enablement gate.
    container_name: omni-infra-provider-proxmox
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.3.0
    profiles:
      - provider
    network_mode: host
    environment:
      # Fixed loopback endpoint for the same-host internal path; external
      # clients still use HTTPS.
      OMNI_ENDPOINT: http://127.0.0.1:8443
      # Deliberately NOT fail-fast `${VAR:?}`: Compose interpolates every
      # service regardless of profiles, so a required provider variable
      # would fail a plain deployment that never starts the provider.
      OMNI_SERVICE_ACCOUNT_KEY: ${PROVIDER_KEY:-}
      # Proxmox API TLS verifies against this bundle (public roots + the PVE
      # CA). Self-signed PVE is not supported by this variant: the bundle
      # must exist.
      SSL_CERT_FILE: /etc/ssl/certs/pve-ca-bundle.pem
      TZ: ${TZ:?Set TZ in Portainer}
    volumes:
      # config.yaml holds the least-privilege Proxmox token, outside Git.
      - /mnt/tank/container-configs/omni-mgmt/provider:/etc/provider:ro
      - /mnt/tank/container-configs/omni-mgmt/pve-ca-bundle.pem:/etc/ssl/certs/pve-ca-bundle.pem:ro
    command: --config-file /etc/provider/config.yaml
    depends_on:
      - omni
    restart: unless-stopped
