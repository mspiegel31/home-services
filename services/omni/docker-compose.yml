name: omni

# Outside-cluster management stack (home-prod plan §5), IP-only / self-signed
# design: Omni, the Omni-only Pocket ID instance, the official Proxmox infra
# provider (opt-in profile), a stock-Traefik management reverse proxy and the
# outside-cluster availability monitor. Runs on a dedicated VM (192.168.1.51);
# endpoints are LAN/VPN-only and reached by IP on dedicated ports (no DNS, no
# DNS-01, one IP-SAN self-signed cert).
#
# Portainer CE repository stack: no env_file by design. Every ${VAR} is
# declared explicitly; set values in the Portainer stack UI. Secrets are never
# stored in this file. The variable table lives in
# .agents/skills/omni-management-stack/SKILL.md.
#
# Topology (loopback-minimal, source-verified against Omni v1.12.2):
#   - Traefik: host network; four dedicated entrypoints bound to
#     ${MGMT_LAN_IP} (9443 omni, 9095 k8s-proxy, 9411 pocket-id, 9001 kuma).
#     File provider only (no Docker socket, no labels provider, no dashboard).
#     Static config via CLI flags; the dynamic route config is an inline
#     compose `configs:` entry (no git-sync sidecar — the routes are static).
#   - Omni: host network; API 127.0.0.1:8443 (cleartext h2c), k8s-proxy
#     127.0.0.1:8095 (TLS, internal CA), machine API 0.0.0.0:8090 (LAN direct).
#     SSL_CERT_FILE points at a trust bundle containing the mgmt CA so the
#     Omni OIDC client trusts the self-signed Pocket ID issuer.
#   - Pocket ID / Uptime Kuma: bridge, published to host loopback only.
#   - Provider: host network (opt-in profile), reaches the loopback Omni API.
#
# External LAN/VPN exposure: 9443/tcp (omni), 9095/tcp (k8s-proxy),
# 9411/tcp (pocket-id), 9001/tcp (kuma), 8090/tcp (machine API) and
# 50180/udp (SideroLink). Nothing else.

configs:
  # Static Traefik routes. No templating: hostnames are gone, so the four
  # routers each match every path on their own dedicated entrypoint port.
  # One tlsStore (the IP-SAN mgmt cert) is shared by all four.
  traefik_dynamic:
    content: |
      http:
        routers:
          omni:
            rule: "PathPrefix(`/`)"
            entryPoints: [omni-ep]
            service: omni-svc
            tls:
              stores: [mgmt]
          k8sproxy:
            rule: "PathPrefix(`/`)"
            entryPoints: [k8s-ep]
            service: k8sproxy-svc
            tls:
              stores: [mgmt]
          pocketid:
            rule: "PathPrefix(`/`)"
            entryPoints: [pid-ep]
            service: pocketid-svc
            tls:
              stores: [mgmt]
          kuma:
            rule: "PathPrefix(`/`)"
            entryPoints: [kuma-ep]
            service: kuma-svc
            tls:
              stores: [mgmt]
        services:
          omni-svc:
            loadBalancer:
              servers:
                - url: h2c://127.0.0.1:8443
          k8sproxy-svc:
            loadBalancer:
              servers:
                - url: https://127.0.0.1:8095
              serversTransport: k8sproxy
          pocketid-svc:
            loadBalancer:
              servers:
                - url: http://127.0.0.1:1411
          kuma-svc:
            loadBalancer:
              servers:
                - url: http://127.0.0.1:3001
        serversTransports:
          # Internal CA for the Traefik -> Omni k8s-proxy hop (IP SAN, no SNI).
          k8sproxy:
            rootCAs:
              - /etc/traefik/certs/omni-k8s-ca.crt
        tls:
          stores:
            mgmt:
              certificates:
                - certFile: /etc/traefik/certs/mgmt.crt
                  keyFile: /etc/traefik/certs/mgmt.key

networks:
  omni-mgmt:
    driver: bridge

volumes:
  kuma-data:

services:
  omni:
    # Self-hosted Omni, single host-container model (docs.siderolabs.com
    # run-omni-on-prem). Host networking is required for SideroLink
    # (WireGuard 50180/udp). Listener binds are set in the reviewed
    # omni-config.yaml (home-prod bootstrap/management/), not here.
    container_name: omni
    image: ghcr.io/siderolabs/omni:v1.12.2
    network_mode: host
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    environment:
      TZ: ${TZ:-UTC}
      # Go honors SSL_CERT_FILE (it REPLACES the system trust store). The
      # bundle must keep the distro roots plus the mgmt CA so the Omni OIDC
      # client trusts the self-signed Pocket ID issuer; without it, login
      # fails at the /api/oidc/discovery TLS handshake.
      SSL_CERT_FILE: /etc/omni-trust/bundle.pem
    volumes:
      # /var/lib/omni: embedded etcd + sqlite. /etc/omni: reviewed
      # omni-config.yaml, omni.asc etcd GPG key and the internal TLS certs.
      - ${OMNI_STATE_DIR:-/opt/omni-mgmt/omni}:/var/lib/omni
      - ${OMNI_CONFIG_DIR:-/opt/omni-mgmt/omni-config}:/etc/omni:ro
      - ${OMNI_TRUST_BUNDLE:-/opt/omni-mgmt/mgmt-ca/combined-ca-bundle.pem}:/etc/omni-trust/bundle.pem:ro
    command: --config-path=/etc/omni/omni-config.yaml
    restart: unless-stopped

  pocket-id:
    # Omni-only identity (plan §2/§5): separate issuer, database, keys,
    # clients and passkey enrollment from the household instance.
    # Published to host loopback only; Traefik (host network) reaches it via
    # 127.0.0.1:1411. Never exposed on the LAN directly.
    container_name: omni-pocket-id
    image: ghcr.io/pocket-id/pocket-id:2.16.0
    environment:
      # Issuer URL advertised in OIDC discovery. IP-only: the dedicated
      # Traefik entrypoint, e.g. https://192.168.1.51:9411. INTERNAL_APP_URL
      # is omitted — it defaults to APP_URL, and the Omni API client reaches
      # the issuer through Traefik on the same VM, so there is no second
      # address to set.
      APP_URL: ${POCKET_ID_APP_URL}
      ENCRYPTION_KEY_FILE: /etc/pocket-id/encryption.key
      TRUST_PROXY: "true"
      UI_CONFIG_DISABLED: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_FROM: ${SMTP_FROM:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_TLS: ${SMTP_TLS:-starttls}
      ANALYTICS_DISABLED: "true"
      VERSION_CHECK_DISABLED: "true"
    volumes:
      # Durable full app state (SQLite DB + uploads) and the encryption key;
      # both are part of the management backup set.
      - ${POCKET_ID_STATE_DIR:-/opt/omni-mgmt/pocket-id}:/app/data
      - ${POCKET_ID_KEY_DIR:-/opt/omni-mgmt/pocket-id-key}:/etc/pocket-id:ro
    ports:
      - "127.0.0.1:1411:1411"
    healthcheck:
      test: ["CMD", "/app/pocket-id", "healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - omni-mgmt
    restart: unless-stopped

  traefik:
    # Management reverse proxy. IP-only / self-signed: serves one IP-SAN cert
    # (mgmt CA) across four dedicated entrypoints and routes to Pocket ID +
    # monitor over host loopback and to Omni (API h2c, k8s-proxy TLS with the
    # internal CA trusted). File provider only.
    container_name: omni-mgmt-traefik
    image: traefik:v3.7.6@sha256:21a3d83696379bac6434bb32e1dde0aff0e84ef2abd053ed3db87d3f45e749b2
    network_mode: host
    command:
      # Four dedicated entrypoints, all bound to the management VM address.
      - "--entrypoints.omni-ep.address=${MGMT_LAN_IP:-127.0.0.1}:9443"
      - "--entrypoints.k8s-ep.address=${MGMT_LAN_IP:-127.0.0.1}:9095"
      - "--entrypoints.pid-ep.address=${MGMT_LAN_IP:-127.0.0.1}:9411"
      - "--entrypoints.kuma-ep.address=${MGMT_LAN_IP:-127.0.0.1}:9001"
      # Static route config from the inline `configs:` entry.
      - "--providers.file.filename=/etc/traefik/dynamic/dynamic.yaml"
      - "--providers.file.watch=false"
      # Telemetry off; anonymous usage off.
      - "--global.checknewversion=false"
      - "--global.sendanonymoususage=false"
      - "--log.level=INFO"
    environment:
      TZ: ${TZ:-UTC}
    configs:
      - source: traefik_dynamic
        target: /etc/traefik/dynamic/dynamic.yaml
    volumes:
      # IP-SAN mgmt cert served on all four entrypoints (via the tlsStore).
      - ${MGMT_TLS_DIR:-/opt/omni-mgmt/mgmt-tls}/mgmt.crt:/etc/traefik/certs/mgmt.crt:ro
      - ${MGMT_TLS_DIR:-/opt/omni-mgmt/mgmt-tls}/mgmt.key:/etc/traefik/certs/mgmt.key:ro
      # CA for the Traefik -> Omni k8s-proxy hop (serversTransport.rootCAs).
      - ${OMNI_K8S_CA:-/opt/omni-mgmt/omni-k8s-ca/ca.crt}:/etc/traefik/certs/omni-k8s-ca.crt:ro
    depends_on:
      pocket-id:
        condition: service_healthy
    restart: unless-stopped

  uptime-kuma:
    # Outside-cluster availability monitor with durable state (plan §5).
    # Published to host loopback only; Traefik serves it on :9001. SMTP is
    # configured in the UI (the pinned release does not read SMTP_* env vars).
    container_name: omni-mgmt-kuma
    image: ghcr.io/louislam/uptime-kuma:2.5.5
    environment:
      TZ: ${TZ:-UTC}
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - kuma-data:/app/data
    networks:
      - omni-mgmt
    restart: unless-stopped

  omni-infra-provider-proxmox:
    # Official Proxmox infra provider (plan §5). Explicit opt-in gate:
    # it only starts with `--profile provider`, so a plain
    # `docker compose up -d` can never mutate Proxmox. Host network so it
    # reaches the loopback-only Omni API. Enablement: docs/management-stack.md.
    container_name: omni-infra-provider-proxmox
    image: ghcr.io/siderolabs/omni-infra-provider-proxmox:v0.3.0
    profiles:
      - provider
    network_mode: host
    environment:
      # Flags read these env vars by default (cmd/main.go v0.3.0); the key
      # never appears in argv, logs or this file. Fixed loopback endpoint for
      # the same-VM internal path; external clients still use HTTPS.
      OMNI_ENDPOINT: http://127.0.0.1:8443
      OMNI_SERVICE_ACCOUNT_KEY: ${PROVIDER_KEY}
      # Proxmox TLS is a config.yaml decision: CA-signed clusters trust the
      # combined CA bundle (public roots + PVE CA) via PVE_CA_BUNDLE below;
      # self-signed clusters set insecureSkipVerify: true in config.yaml and
      # omit PVE_CA_BUNDLE — the then-missing bundle path is auto-created as
      # an empty dir by Docker and stays inert because verification is skipped.
      SSL_CERT_FILE: /etc/ssl/certs/pve-ca-bundle.pem
      TZ: ${TZ:-UTC}
    volumes:
      # config.yaml holds the least-privilege Proxmox token
      # (tokenID/tokenSecret) on the management VM, outside Git.
      - ${PROVIDER_CONFIG_DIR:-/opt/omni-mgmt/provider}:/etc/provider:ro
      # CA-signed clusters only: omit PVE_CA_BUNDLE for self-signed.
      - ${PVE_CA_BUNDLE:-/opt/omni-mgmt/pve-ca-bundle.pem}:/etc/ssl/certs/pve-ca-bundle.pem:ro
    command: --config-file /etc/provider/config.yaml
    depends_on:
      - omni
    restart: unless-stopped
