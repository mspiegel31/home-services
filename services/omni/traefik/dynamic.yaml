# Management reverse proxy — dynamic routes (TrueNAS variant).
#
# Rendered as a Go template by the Traefik file provider: the
# {{ env "..." }} placeholders resolve from the container environment at
# load time. watch=false in the static config, so a change here takes
# effect on a deliberate Traefik restart.
#
# Certificates: every router requests the SAME wildcard via the `mgmt`
# resolver — `tls.domains` is exactly one entry, main = `*.<MGMT_DOMAIN>`,
# with no `sans`: one DNS-01 order, one authorization, reused for all SNI
# names. Wildcard-only is a hard rule: never add the subzone apex to the
# order (apex/wildcard TXT race — home-prod/docs/management-stack.md →
# Known traps). No hostname uses the bare apex, so it needs no certificate.
#
# Two quoting traps — both silent until deploy:
#   1. The file must be valid YAML *including* the placeholder text, so the
#      wildcard entry is single-quoted (unquoted, `{{` parses as a flow
#      mapping and `*` as an alias).
#   2. Never put quotes inside the templated value: Traefik parses the YAML
#      first and templates the resulting value, so injected quotes land in
#      the domain string and ACME orders `"*...."`.
#
# Upstreams are loopback-only (host network). Unmatched hosts receive
# Traefik's default 404: there is no catch-all router.

http:
  routers:
    omni:
      rule: Host(`{{ env "OMNI_HOSTNAME" }}`)
      entryPoints:
        - websecure
      service: omni-svc
      tls:
        certResolver: mgmt
        domains:
          - main: '*.{{ env "MGMT_DOMAIN" }}'

    omni-k8s:
      rule: Host(`{{ env "OMNI_K8S_HOSTNAME" }}`)
      entryPoints:
        - websecure
      service: k8sproxy-svc
      tls:
        certResolver: mgmt
        domains:
          - main: '*.{{ env "MGMT_DOMAIN" }}'

    pocket-id:
      rule: Host(`{{ env "POCKET_ID_HOSTNAME" }}`)
      entryPoints:
        - websecure
      service: pocketid-svc
      tls:
        certResolver: mgmt
        domains:
          - main: '*.{{ env "MGMT_DOMAIN" }}'

  services:
    omni-svc:
      loadBalancer:
        servers:
          - url: h2c://127.0.0.1:8443

    k8sproxy-svc:
      loadBalancer:
        servers:
          - url: https://127.0.0.1:8095
        serversTransport: k8sproxy

    pocketid-svc:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:1411

  # The k8s-proxy listener is always TLS with a self-signed certificate, so
  # verification is skipped. Accepted because the hop is loopback-only
  # (127.0.0.1): no network path exists on which a wrong certificate could
  # be presented. serverName is unnecessary with verification off.
  serversTransports:
    k8sproxy:
      insecureSkipVerify: true
