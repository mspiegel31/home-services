# Management reverse proxy — dynamic routes (TrueNAS variant).
#
# Consumed by the Traefik file provider, which renders this file as a Go
# template: the {{ env "..." }} placeholders are resolved from the container
# environment at load time (no entrypoint script, no sed, no templating
# sidecar). watch=false in the static config, so a change here takes effect
# on a deliberate Traefik restart.
#
# Hostnames, set in the compose `traefik.environment` block:
#   OMNI_HOSTNAME, OMNI_K8S_HOSTNAME, POCKET_ID_HOSTNAME, MONITOR_HOSTNAME,
#   MGMT_DOMAIN (the management subzone, used for the wildcard certificate)
#
# Certificates: every router requests the SAME wildcard via the `mgmt` ACME
# resolver: `tls.domains` is exactly one entry, main = `*.<MGMT_DOMAIN>`,
# with no `sans` — one DNS-01 order, one authorization, reused for all four
# SNI names. Do not add the subzone apex to the order: apex and wildcard
# authorizations share one `_acme-challenge` TXT name, and lego's sequential
# present/validate/clean-up then races Let's Encrypt into an NXDOMAIN for the
# second authorization (observed 2026-10-06). No hostname uses the bare
# subzone apex, so it needs no certificate. A router with `certResolver` but
# no `domains` would instead issue a separate certificate per hostname.
#
# Upstream topology (loopback-only, host network):
#   Omni API     h2c://127.0.0.1:8443   cleartext HTTP/2, gRPC-capable
#   k8s-proxy    https://127.0.0.1:8095 TLS, self-signed, unverified (loopback)
#   Pocket ID    http://127.0.0.1:1411  bridge service on host loopback
#   Kuma         http://127.0.0.1:3001  bridge service on host loopback
#
# Unmatched hosts receive Traefik's default 404: there is no catch-all router.

http:
  routers:
    omni:
      rule: Host(`{{ env "OMNI_HOSTNAME" }}`)
      entryPoints:
        - websecure
      service: omni-svc
      tls:
        certResolver: mgmt
        domains:
          - main: '*.{{ env "MGMT_DOMAIN" }}'

    omni-k8s:
      rule: Host(`{{ env "OMNI_K8S_HOSTNAME" }}`)
      entryPoints:
        - websecure
      service: k8sproxy-svc
      tls:
        certResolver: mgmt
        domains:
          - main: '*.{{ env "MGMT_DOMAIN" }}'

    pocket-id:
      rule: Host(`{{ env "POCKET_ID_HOSTNAME" }}`)
      entryPoints:
        - websecure
      service: pocketid-svc
      tls:
        certResolver: mgmt
        domains:
          - main: '*.{{ env "MGMT_DOMAIN" }}'

    monitor:
      rule: Host(`{{ env "MONITOR_HOSTNAME" }}`)
      entryPoints:
        - websecure
      service: kuma-svc
      tls:
        certResolver: mgmt
        domains:
          - main: '*.{{ env "MGMT_DOMAIN" }}'

  services:
    omni-svc:
      loadBalancer:
        servers:
          - url: h2c://127.0.0.1:8443

    k8sproxy-svc:
      loadBalancer:
        servers:
          - url: https://127.0.0.1:8095
        serversTransport: k8sproxy

    pocketid-svc:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:1411

    kuma-svc:
      loadBalancer:
        servers:
          - url: http://127.0.0.1:3001

  # Upstream trust for the Omni k8s-proxy hop: the listener is always TLS and
  # serves a self-signed certificate, so verification is skipped. The tradeoff
  # is accepted because the hop is loopback-only (127.0.0.1) — there is no
  # network path on which an attacker could present a different certificate.
  # serverName is unnecessary: with verification off, no SAN has to match.
  serversTransports:
    k8sproxy:
      insecureSkipVerify: true
