name: taskview

# Networks: internal services (db, migration) use the taskview network only.
# Services exposed via Cloudflare Tunnel (api-server, webapp) also join cloudflare_tunnel.
x-taskview-env: &taskview-env
  DB_HOST: "db"
  DB_USER: ${DB_USER:-}
  DB_PASSWORD: ${DB_PASSWORD:-}
  DB_NAME: ${DB_NAME:-}
  DB_PORT: "5432"
  APP_PORT: "1401"
  JWT_ALG: "HS256"
  JWT_SIGN: ${JWT_SIGN:-}
  ACCESS_LIFE_TIME: "3d"
  REFRESH_LIFE_TIME: "9d"
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_ENCRYPTION: ${SMTP_ENCRYPTION:-tls}
  SMTP_FROM_NAME: ${SMTP_FROM_NAME:-TaskView}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
  APP_URL: ${APP_URL:-}
  AUTH_LOGIN_METHODS: ${AUTH_LOGIN_METHODS:-}
  GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
  GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
  GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-}
  GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
  GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
  GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-}
  APPLE_CLIENT_ID: ${APPLE_CLIENT_ID:-}
  APPLE_TEAM_ID: ${APPLE_TEAM_ID:-}
  APPLE_KEY_ID: ${APPLE_KEY_ID:-}
  APPLE_KEY_LOCATION: ${APPLE_KEY_LOCATION:-/usr/src/app/AuthKey.p8}
  APPLE_CALLBACK_URL: ${APPLE_CALLBACK_URL:-}
  GITHUB_INTEGRATION_CLIENT_ID: ${GITHUB_INTEGRATION_CLIENT_ID:-}
  GITHUB_INTEGRATION_CLIENT_SECRET: ${GITHUB_INTEGRATION_CLIENT_SECRET:-}
  GITHUB_INTEGRATION_CALLBACK_URL: ${GITHUB_INTEGRATION_CALLBACK_URL:-}
  GITLAB_INTEGRATION_CLIENT_ID: ${GITLAB_INTEGRATION_CLIENT_ID:-}
  GITLAB_INTEGRATION_CLIENT_SECRET: ${GITLAB_INTEGRATION_CLIENT_SECRET:-}
  GITLAB_INTEGRATION_CALLBACK_URL: ${GITLAB_INTEGRATION_CALLBACK_URL:-}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}

services:
  db:
    container_name: taskview_db
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-}
      POSTGRES_DB: ${DB_NAME:-}
    volumes:
      - /mnt/tank/container-configs/taskview/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-} -d ${DB_NAME:-}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - taskview

  migration:
    container_name: taskview_migration
    image: gimanhead/taskview-ce-db-migration:latest
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      <<: *taskview-env
    networks:
      - taskview

  taskview-api-server:
    container_name: taskview_api
    image: gimanhead/taskview-ce-api-server:latest
    restart: unless-stopped
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=1
      - net.ipv6.conf.default.disable_ipv6=1
    ports:
      - "1725:1401"
    depends_on:
      db:
        condition: service_healthy
      migration:
        condition: service_completed_successfully
    environment:
      <<: *taskview-env
    volumes:
      - /mnt/tank/container-configs/taskview/logs:/usr/src/app/logs
    networks:
      - taskview
      - cloudflare_tunnel

  taskview-webapp:
    container_name: taskview_web
    image: gimanhead/taskview-ce-webapp:latest
    restart: unless-stopped
    environment:
      TASKVIEW_API_URL: ${TASKVIEW_API_URL:-}
    ports:
      - "8888:80"
    networks:
      - cloudflare_tunnel

networks:
  taskview:
  cloudflare_tunnel:
    external: true
