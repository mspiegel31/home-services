name: nomic-embed-text-v2-moe

networks:
  litellm:
    external: true

services:
  embeddings:
    container_name: nomic-embed-text-v2-moe
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.9@sha256:8419f533857b503ebf6ec292a95d4f1cf9c0464ac8b8abeef39518cf110e5726
    init: true
    restart: unless-stopped
    networks:
      - litellm
    volumes:
      - /mnt/models/huggingface:/data
    command:
      - --model-id
      - nomic-ai/nomic-embed-text-v2-moe
      - --served-model-name
      - nomic-embed-text-v2-moe
      - --dtype
      - float32
      - --tokenization-workers
      - "4"
      - --max-concurrent-requests
      - "32"
      - --max-batch-requests
      - "4"
      - --max-batch-tokens
      - "2048"
      - --max-client-batch-size
      - "32"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:80/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 2m
