# LiteLLM Proxy Gateway — eval fixture (trimmed).
# Secrets (set in Portainer UI, never committed):
#   LITELLM_MASTER_KEY, LITELLM_SALT_KEY, LITELLM_POSTGRES_PASSWORD,
#   LLAMA_SWAP_API_KEY  (presented to the llama-swap router on every request)

# Chat-model deployments live in ./models/*.yaml — one model per file, pulled
# in via LiteLLM's `include` directive (no glob; every file is listed).
# Merge semantics: model_list entries are concatenated in listed order;
# a model id must appear in exactly one file.
# To add a model, drop a new <model-id>.yaml in models/ and add it to the
# include list below.
include:
  - models/qwen3.8-27b-nvfp4.yaml
  - models/swift-1.5-fp8.yaml

model_list:
  - model_name: nomic-embed-text-v2-moe
    litellm_params:
      model: nomic-embed-text-v2-moe
      api_base: http://litellm-nomic-embed-text-v2-moe:80/v1
      api_key: none
      custom_llm_provider: hosted_vllm
    model_info:
      mode: embedding
      context_window: 512
      max_input_tokens: 512
      supported_openai_params:
        - dimensions
        - encoding_format
      input_cost_per_token: 0.0
      output_cost_per_token: 0.0

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true

litellm_settings:
  drop_params: true
  # Central translation for local reasoning-model chat-template controls.
  callbacks:
    - custom_callbacks.local_thinking_policy
  cache: true
  cache_params:
    type: redis
    url: redis://valkey:6379
